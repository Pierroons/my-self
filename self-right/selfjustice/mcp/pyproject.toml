[project]
name = "selfright-mcp"
version = "0.4.1"
description = "Serveur MCP de consultation du droit français (LEGI), de conventionnalité (UE, CEDH, RGPD, règlement IA), de jurisprudence (Judilibre) et des démarches administratives officielles"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
# 🔑 Déclarer la licence ne suffit pas : l'AGPL demande qu'une copie de son
# texte accompagne le programme. Sans cette ligne, le paquet publié portait
# l'identifiant SPDX dans ses métadonnées et aucun texte de licence.
# Le fichier est un lien vers celui du dépôt — une seconde copie divergerait.
license-files = ["LICENSE"]
keywords = ["mcp", "droit", "legifrance", "legi", "rgpd", "ai-act"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Sociology :: History",
]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[project.scripts]
selfright-mcp = "selfright_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["selfright_mcp"]
