; Les ouvriers de SelfJustice — à poser dans /etc/php/8.4/fpm/pool.d/,
; à côté du groupe `www`.
;
; Le vhost (nginx.conf) lui confie ses six routes PHP : le retour de
; signalement, l'API, la page d'un article, et les trois routes de SelfAct.
;
; 🔑 Pourquoi ce groupe existe : il porte un SECRET. La clé d'API du portail de
; jurisprudence amont était déclarée dans le groupe partagé — donc lisible par
; `getenv()` depuis n'importe lequel des huit sites PHP de la machine. Un
; groupe d'ouvriers partagé partage ses ouvriers, mais aussi ses variables
; d'environnement. Elle quitte le groupe `www` pour celui-ci, qui sert les
; seules routes qui l'emploient.
;
; 🔑 Pourquoi `user` change mais pas `listen.owner`. `user` est l'identité qui
; exécute le PHP ; `listen.owner`/`listen.group` disent qui peut PARLER à la
; socket. nginx tourne ses ouvriers sous `www-data` (mesuré le 24/11/2026),
; c'est donc lui qui l'ouvre, et `0660` avec ce propriétaire ferme la socket à
; tout le reste — y compris aux autres groupes d'ouvriers.
;
; 🔴 `php-justice` ne doit PAS être membre du groupe `www-data`. Mesuré le
; 24/11/2026 : 74 répertoires de l'arbre servi sont inscriptibles par ce
; groupe. Un membre y déposerait un fichier PHP que tous les autres groupes
; exécuteraient — et la clé repartirait par la porte qu'on vient de fermer.
; Détail et ordre des gestes : `deploy/my-self/README.md`.
;
; ⚠️ Ce qui doit suivre, et qui n'est pas de ce dépôt-ci : les trois minuteries
; de synchronisation (`jade-update`, `judilibre-update`, `fraicheur-check`)
; tournent sous `root` avec `ReadWritePaths=/var/lib/selfjustice` — elles ne
; sont donc pas gênées par un changement de propriétaire. Mais le répertoire
; lui-même est à reprendre : mesuré `drwxr-xr-x` le 24/11/2026, c'est-à-dire
; lisible par TOUT compte de la machine, avec 52 fichiers dans le même état et
; les sous-répertoires `admin` et `demo-sessions` en `drwxrwxr-x`. Ce constat
; appartient à la conv MCP et lui a été déposé ; il n'est pas corrigé ici.
;
; ⚠️ Un groupe neuf ne reprend AUCUN réglage du groupe `www` : tout le
; durcissement PHP de cette machine vient de son `php.ini`, pas du groupe
; (mesuré le 19/11/2026). Refaire la mesure avant de poser ailleurs.
;
; ⚠️ CE FICHIER SE POSE AVANT LE VHOST. `nginx -t` ne vérifie pas qu'une
; socket existe : un vhost posé seul rendrait 502 sur tout SelfJustice.

[justice]
user = php-justice
group = php-justice
listen = /run/php/php8.4-fpm-justice.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
; 🔑 À LA DEMANDE : la consultation n'a pas de trafic continu, donc aucun
; ouvrier n'a de raison d'attendre en mémoire. Au repos ce groupe ne coûte
; rien. ⚠️ Conséquence à connaître : après un moment sans requête, le premier
; appel démarre un ouvrier neuf, qui ne garde donc aucun état du précédent —
; ce qui est déjà vrai de PHP-FPM, mais plus visible ici.
pm = ondemand
; 🔑 **Aucune dérivation lourde ici, et c'est MESURÉ, pas supposé.** Le
; 24/11/2026, une recherche d'appels à Argon2id, aux enveloppes et aux
; primitives sur `self-right/selfjustice/` et `self-right/selfact/` rend
; **zéro fichier** : la consultation du droit lit des bases, elle ne dérive pas
; de clé. Le pic d'un ouvrier d'ici est donc son repos, et rien de plus.
;
; ⚠️ Ce marqueur est une PROPRIÉTÉ, pas un réglage : si une route de ce site
; se met un jour à dériver, il devient faux et le budget de la machine est
; sous-estimé sans que rien ne le dise. Le refaire mesurer est le geste à
; reprendre quand ce site gagne une route qui chiffre.
;
; @pic: aucun
;
; TROIS au plus : ~29 Mo par ouvrier au repos (mesuré le 24/11/2026), donc
; ~87 Mo au pire. Le chiffre se relit par `POOL_SSH_HOST=<alias> bash
; deploy/my-self/tests/pic-ouvrier-php.sh`, qui tranche.
pm.max_children = 3
; Un ouvrier ne se perd pas : au-delà de cette échéance il est arrêté, là où
; `fastcgi_read_timeout` ne ferme que la connexion côté nginx et laisse le
; script courir.
;
; 🔑 **65 s borne le script qui SE TAIT, et c'est le seul qu'il borne.**
; `fastcgi_read_timeout` mesure le SILENCE entre deux lectures, pas la durée de
; la réponse : un script qui diffuse par morceaux reste servi indéfiniment tant
; qu'il parle toutes les 60 s, et 65 s le couperait en pleine réponse. Aucune
; route de ce site ne diffuse — la consultation rend une réponse d'un bloc —
; mais la vérification se refait avant d'en ajouter une qui le ferait. Le détail
; de la mesure est dans `deploy/my-self/php-fpm-www.conf`.
request_terminate_timeout = 65s

; ⚠️ **La valeur est un gabarit, à substituer à la pose.** Elle ne doit jamais
; être écrite ici : ce dépôt est public.
;
; 🔑 **Cette ligne arrive du groupe `www`, elle n'y est plus.** Avant d'en
; ajouter une autre, la chercher HORS du dépôt : sur l'instance, `grep -rl
; <nom>` sur `/var/www`, `/usr/local/bin`, `/usr/local/sbin` et `/etc/nginx`.
; ⚠️ Une recherche rend une liste, jamais une absence : qualifier tout zéro par
; un témoin, c'est-à-dire par le même motif sur une variable réellement lue.
;
; ⚠️ Sa rotation du 20/11/2026 a trois porteurs, et la conv MCP les suit. Un
; changement de groupe en est un quatrième : le lui dire, comme elle l'a
; demandé.
env[SELFJUSTICE_JUDILIBRE_KEY] = "<cle d-API du portail amont>"
