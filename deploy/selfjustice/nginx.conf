# SelfJustice et SelfAct — justice.example.org
#
# Gabarit du vhost servi : TLS terminé ici, sur le 443 de la machine. La racine
# est le sous-répertoire site/ ; api/ et admin/ sont au-dessus, et les scripts
# FastCGI sont donc désignés par chemin absolu — `$document_root/api/…`
# chercherait dans site/api/, qui n'existe pas.

# Les trois zones sont déclarées ici pour que le gabarit se suffise. Une instance
# qui les déclare déjà ailleurs (conf.d) retire ces lignes : nginx refuse une
# zone déclarée deux fois.
limit_req_zone $binary_remote_addr zone=selfjustice:10m       rate=10r/s;
limit_req_zone $binary_remote_addr zone=selfjustice_api:10m   rate=5r/s;
limit_req_zone $binary_remote_addr zone=selfjustice_admin:10m rate=10r/m;
# Les retours sont anonymes et pèsent jusqu'à 5 Mo : quelques-uns par minute.
limit_req_zone $binary_remote_addr zone=selfjustice_feedback:10m rate=6r/m;

server {
    # Refuse les copies de sauvegarde tombées dans une racine servie. Le fichier
    # à poser est `deploy/my-self/snippets/deny-bakfiles.conf`, à copier dans
    # `/etc/nginx/snippets/` : le déploiement ne touche pas aux vhosts, donc ni
    # à leurs snippets. Sans cette copie, nginx refuse de démarrer.
    include snippets/deny-bakfiles.conf;
    listen 443 ssl;
    server_name justice.example.org;

    ssl_certificate     /etc/ssl/justice.example.org/fullchain.pem;
    ssl_certificate_key /etc/ssl/justice.example.org/privkey.pem;

    root  /var/www/myself/self-right/selfjustice/site;
    index index.php;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Scripts : fichiers du site seulement, aucun script inline ni gestionnaire `on*=`.
    # Styles inline admis : l'accueil et /act en portent des dizaines.
    # ⚠️ Un `add_header` dans un `location` annule tous ceux-ci pour ce chemin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    include snippets/hsts.conf;

    # ---- API de consultation des sources juridiques ----
    location = /api/feedback {
        limit_req zone=selfjustice_feedback burst=2 nodelay;
        client_max_body_size 6M;
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myself/self-right/selfjustice/api/feedback.php;
        fastcgi_param SCRIPT_NAME /api/feedback.php;
    }

    location /api {
        limit_req zone=selfjustice_api burst=10 nodelay;
        try_files $uri $uri/ /api/api.php$is_args$args;
    }

    location ~ ^/api/api\.php {
        limit_req zone=selfjustice_api burst=10 nodelay;
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myself/self-right/selfjustice/api/api.php;
        fastcgi_param SCRIPT_NAME /api/api.php;
        # Les URL que l'API compose partent de là, jamais de l'en-tête Host.
        fastcgi_param SELFJUSTICE_BASE_URL https://justice.example.org;
    }

    # ---- Panneau de veille, adressé par jeton (pas de chemin devinable) ----
    location ~ "^/w-([a-f0-9]{32})/?$" {
        # L'URL porte le jeton : elle n'entre dans aucun journal.
        access_log off;
        limit_req zone=selfjustice_admin burst=5 nodelay;
        set $sj_token $1;
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myself/self-right/selfjustice/admin/watch.php;
        fastcgi_param SCRIPT_NAME /admin/watch.php;
        fastcgi_param SJ_PROVIDED_TOKEN $sj_token;
    }

    # ---- SelfAct ----
    # L'URI n'a pas d'extension : sans type déclaré, la page part en
    # application/octet-stream et le navigateur la télécharge.
    location = /act/docs {
        alias /var/www/myself/self-right/selfact/site/act-docs.html;
        default_type "text/html; charset=utf-8";
    }
    location = /act {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myself/self-right/selfact/site/act.php;
    }

    # Liste blanche des routes : un fichier PHP posé dans api/ sans y figurer
    # n'est pas joignable.
    location ~ ^/act/api/(find|draft|catalog|deadline|gabarits)\.php$ {
        limit_req zone=selfjustice_api burst=10 nodelay;
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myself/self-right/selfact/api/$1.php;
        fastcgi_param SELFJUSTICE_BASE_URL https://justice.example.org;
    }
    location = /act/api/find    { rewrite ^ /act/api/find.php; }
    location = /act/api/draft   { rewrite ^ /act/api/draft.php; }
    location = /act/api/catalog { rewrite ^ /act/api/catalog.php; }
    location = /act/api/deadline { rewrite ^ /act/api/deadline.php; }
    location = /act/api/gabarits { rewrite ^ /act/api/gabarits.php; }

    location = /act/api/directives.md {
        alias /var/www/myself/self-right/selfact/api/directives.md;
        types { }
        default_type "text/markdown; charset=utf-8";
    }
    location = /act/api/directives.txt {
        alias /var/www/myself/self-right/selfact/api/directives.md;
        types { }
        default_type "text/plain; charset=utf-8";
    }
    location = /act/api/print.js {
        alias /var/www/myself/self-right/selfact/api/print.js;
    }
    location = /act/api/copy-prompts.js {
        alias /var/www/myself/self-right/selfact/api/copy-prompts.js;
    }

    # ---- Site statique ----
    location / {
        limit_req zone=selfjustice burst=20 nodelay;
        try_files $uri $uri/ =404;
    }

    # 🔑 Rendu côté serveur : la page porte les compteurs du corpus, et une IA
    # — son premier lecteur — n'exécute pas de JavaScript. Exception nommée ;
    # l'interdiction générale des .php reste en vigueur juste en dessous.
    location = / {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }

    # ⚠️ Pas de cache d'un jour : il figerait pour la journée des compteurs
    # rafraîchis toutes les heures.
    location = /index.html { return 301 /; }
    location = /index.php  { return 301 /; }

    location ~ /\.(?!well-known) { deny all; }
    location ~ \.php$ { deny all; }
    location ~ ~$    { deny all; }

    server_tokens off;
    access_log /var/log/nginx/selfjustice-access.log;
    error_log  /var/log/nginx/selfjustice-error.log warn;
}
