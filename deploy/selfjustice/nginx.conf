# SelfJustice — Nginx vhost configuration
# Deployment: justice.example.com via Cloudflare Tunnel
# SSL is handled by Cloudflare — this vhost listens on HTTP only.

# Rate limiting zone (prevent abuse)
limit_req_zone $binary_remote_addr zone=selfjustice:10m rate=10r/s;

server {
    listen 80;
    server_name justice.example.com;

    root /var/www/selfjustice;
    index index.php;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; frame-ancestors 'none'" always;

    # Rate limiting
    limit_req zone=selfjustice burst=20 nodelay;

    # Main location — static assets
    location / {
        try_files $uri $uri/ =404;
    }

    # 🔑 Les deux pages sont rendues côté serveur : elles portent les compteurs
    # du corpus, et une IA — leur premier lecteur — n'exécute pas de JavaScript.
    # L'accès direct aux .php reste interdit plus bas ; ces deux entrées sont
    # les seules exceptions, nommées une par une.
    location = / {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }
    location = /act {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/act.php;
    }

    # ⚠️ Pas de cache long ici, contrairement à la version statique qui vivait
    # un jour en mémoire du navigateur : la page porte maintenant des compteurs
    # rafraîchis toutes les heures. Un cache d'un jour les figerait pour le
    # visiteur, et on aurait remplacé une donnée périmée par une autre.
    location = /index.php { return 301 /; }
    add_header Cache-Control "public, max-age=600, must-revalidate";

    # Block common attack paths
    location ~ /\. { deny all; }
    location ~ \.php$ { deny all; }
    location ~ ~$ { deny all; }

    # Disable server tokens
    server_tokens off;

    # Access log (optional — disable if privacy is a concern)
    access_log /var/log/nginx/selfjustice-access.log;
    error_log /var/log/nginx/selfjustice-error.log warn;
}
