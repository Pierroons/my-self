; Les ouvriers PHP qui hachent — à poser dans /etc/php/8.4/fpm/pool.d/, à côté du groupe `www`.
;
; Le vhost du lab (nginx-ctf.conf) leur confie les routes qui paient un Argon2id ; le groupe
; `www` garde les pages. Trois bornes en découlent, quelle que soit l'origine des requêtes :
;
;   - le nombre de hachages simultanés est celui des ouvriers ci-dessous, jamais davantage ;
;   - les pages gardent leurs propres ouvriers, qu'aucun hachage n'occupe ;
;   - leur file d'attente est courte (`listen.backlog`) : quand elle est pleine, nginx
;     répond tout de suite « le serveur est occupé » (503, bloc `@sature` du vhost) au lieu
;     de faire patienter sans fin.
;
; nginx lit le corps de la requête AVANT de la confier à un ouvrier : une requête lente n'en
; occupe donc aucun.
;
; La priorité de ces ouvriers reste celle des autres (`process.priority` absent). Abaissée, ils
; cessent d'avancer dès que nginx absorbe un flot de connexions, leur file d'attente reste
; pleine, et c'est le visiteur honnête qui ne passe plus.
;
; ⚠️ Ces deux groupes ne reprennent AUCUN réglage du groupe `www` de la machine. Si celui-ci
; porte des lignes `php_admin_value`, `php_value`, `env[...]` ou `security.limit_extensions`,
; les reporter ici avant de poser : sans elles, les routes déplacées tourneraient sous d'autres
; règles que le reste du site.

[calcul]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm-calcul.sock
listen.owner = www-data
listen.group = www-data
listen.backlog = 16
pm = static
pm.max_children = 2
request_terminate_timeout = 120s

; L'inscription et le simulateur d'attaques ont leur groupe : ce sont de loin les routes les
; plus chères, et sans cette séparation les noyer fermerait aussi la connexion.
[lourd]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm-lourd.sock
listen.owner = www-data
listen.group = www-data
listen.backlog = 4
pm = static
pm.max_children = 1
request_terminate_timeout = 120s
