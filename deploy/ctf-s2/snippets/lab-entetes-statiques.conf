# En-têtes de sécurité des fichiers que nginx sert lui-même.
#
# L'application pose les siens depuis PHP — CSP avec nonce, HSTS, nosniff,
# X-Frame-Options, Referrer-Policy, COOP, CORP. Mais PHP ne voit jamais passer
# un .js, un .mjs ou un .svg : nginx les sert directement, et ils repartaient
# donc SANS AUCUN en-tête, pas même HSTS. Mesuré le 03/10/2026 : 5 en-têtes sur
# une page, 0 sur /js/e2e-memo.js.
#
# 🔑 `Cross-Origin-Resource-Policy` est ici le plus important, et pas seulement
# pour lui-même : c'est lui qui rendra possible un COEP `require-corp` sur les
# pages. Sans CORP sur chaque sous-ressource, COEP bloquerait le chargement des
# scripts de dérivation — donc le coffre du mémo, donc un drapeau.
#
# ⚠️ `add_header` dans un location REMPLACE ceux du niveau au-dessus : si un
# jour le serveur en pose, il faudra les répéter ici.
location ~* \.(js|mjs|css|svg|png|jpg|jpeg|gif|ico|webp|woff2?|map)$ {
    add_header X-Content-Type-Options        "nosniff"                          always;
    add_header Cross-Origin-Resource-Policy  "same-origin"                      always;
    add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
    add_header Strict-Transport-Security     "max-age=31536000; includeSubDomains" always;
}

# `^~` : préfixe prioritaire, évalué avant les location à expression régulière.
# Sans lui, security.txt tomberait dans la règle des extensions ci-dessus ou,
# pire, dans un refus — et le canal par lequel un chercheur signale ce qu'il a
# trouvé cesserait de répondre.
location ^~ /.well-known/ {
    add_header X-Content-Type-Options        "nosniff"                          always;
    add_header Cross-Origin-Resource-Policy  "same-origin"                      always;
    add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
    add_header Strict-Transport-Security     "max-age=31536000; includeSubDomains" always;
}
