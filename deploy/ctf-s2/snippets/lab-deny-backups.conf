# Fichiers de sauvegarde et sources qui ne doivent jamais etre servis.
# Sans cette regle, un "fichier.php.bak" echappe a "location ~ \.php$"
# et nginx le sert comme du texte : le code source part en clair.
# Constate le 02/08/2026 sur /api/detect_abuse.php.pre-r10.*.bak (HTTP 200).
#
# ⚠️ Ni "txt" ni "asc" dans cette liste : .well-known/security.txt (RFC 9116) et
# vdp-pubkey.asc sont servis expres — les refuser couperait le canal par lequel
# un chercheur signale ce qu'il a trouve.
#
# Les refus se journalisent a part depuis le 03/10/2026, au lieu d'etre tus.
# Ce qu'un chercheur sonde est ce qu'on veut lire : "access_log off" effacait
# justement la trace qui a le plus de valeur sur un lab fait pour etre attaque.
location ~* \.(bak|old|orig|save|swp|swo|tmp|sql|db|sqlite3?|log|ini|conf|sh|py|lock|dist|example|md|zip|gz|tgz|tar|bz2|xz|7z|rar|json|ya?ml|pem|key|crt|csr|p12|pfx|inc|phps|patch|rej|diff|backup|csv|env|war|jar|DS_Store)$ {
    deny all;
    access_log /var/log/nginx/lab-sondes.log lab_anon;
}
location ~ ~$ { deny all; access_log /var/log/nginx/lab-sondes.log lab_anon; }
