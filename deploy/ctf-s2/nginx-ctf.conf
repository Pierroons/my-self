# Contexte http du lab — déclaré ICI, comme les autres gabarits du dépôt.
#
# 🔑 Un gabarit déclare ce qu'il emploie. Sorties dans un fichier à part, ces
# directives rendaient le vhost intestable (« unknown log format ») et le
# feraient refuser de démarrer sur une machine qui ne les porte pas déjà.

# Journaux du lab : l'adresse source est tronquée avant d'être écrite.
#
# Pourquoi : ce serveur est fait pour être attaqué, et ses journaux sont ce que
# quelqu'un lira s'il obtient un accès. Une adresse complète y désignerait des
# personnes — les chercheurs invités, et l'administrateur qui s'y connecte
# depuis chez lui. Le modèle de menace du lab interdit qu'il livre cela.
#
# Tronquer plutôt que masquer : /24 en IPv4 et /48 en IPv6 gardent de quoi
# reconnaître une même origine d'une requête à l'autre — donc de lire une
# campagne de scan — sans désigner un abonné.
#
# ⚠️ CrowdSec n'est pas concerné : sur cette machine il ne lit que le journal
# SSH (`acquis.yaml`, source unique journalctl ssh.service). Aucun bannissement
# ne dépend de ce format.
map $remote_addr $ip_tronquee {
    ~^(?<v4>\d+\.\d+\.\d+)\.           "$v4.0";
    ~^(?<v6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):  "$v6::";
    default                            "0.0.0.0";
}

# Clé des files d'attente ci-dessous : un PRÉFIXE, pas une adresse.
#
# Compter par adresse entière ne borne rien en IPv6 : ce serveur publie un AAAA
# et tout hébergeur route un /64 à ses clients, soit 2^64 clés gratuites pour
# qui veut en changer à chaque requête. Un /64 en IPv6 et un /24 en IPv4 sont
# les plus petits blocs qu'on n'obtient pas en les demandant.
#
# ⚠️ `default` rend l'adresse entière, jamais une constante : une constante
# rangerait toute adresse non reconnue dans une file commune, et la remplir
# fermerait le service pour les autres — le déni que cette zone doit empêcher.
map $remote_addr $cle_frein {
    ~^(?<p4>\d+\.\d+\.\d+)\.                                              "$p4.0";
    ~^(?<p6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):         "$p6::";
    default                                                               $remote_addr;
}

# La même adresse, vue de plus loin : un /32 en IPv6, un /16 en IPv4 — l'ordre de
# grandeur de ce qu'un fournisseur d'accès ou un hébergeur détient d'un seul
# tenant. Qui loue un bloc /48 dispose de 65 536 préfixes /64, donc d'autant de
# files ci-dessus ; vus d'ici, ils n'en font qu'une. Ce n'est pas un
# bannissement : les abonnés d'un même fournisseur partagent une file, large,
# qui ne se remplit que si l'un d'eux la remplit.
map $remote_addr $cle_fournisseur {
    ~^(?<f4>\d+\.\d+)\.                          "$f4.0.0";
    ~^(?<f6>[0-9a-fA-F]*:[0-9a-fA-F]*):              "$f6::";
    default                                          $remote_addr;
}

# Refus des requêtes déclenchées depuis un autre site.
#
# Les routes publiques à effet de bord n'ont pas de session à protéger, donc
# pas de jeton anti-CSRF : une page tierce peut les appeler chez chacun de ses
# visiteurs, avec leurs adresses à eux. Tout frein par adresse tombe alors, y
# compris agrégé. `Sec-Fetch-Site` dit d'où part la requête et le navigateur
# l'écrit lui-même ; un client qui ne l'envoie pas est toléré.
#
# Le refus porte sur l'API entière, et sur elle seule : une page s'ouvre depuis
# un lien posé ailleurs, un appel d'API ne part jamais que des pages du lab. Il
# se décide ici, sur le chemin, et non dans chaque `location` : une route neuve
# est couverte sans qu'on ait à y penser. `same-site` — un autre sous-domaine du
# même domaine — est refusé comme un site tiers.
map "$http_sec_fetch_site|$uri" $appel_tiers {
    ~^(same-origin|none)?\|   0;
    ~\|/api/                  1;
    default                   0;
}

# `$host` en dernier, apres les champs du format « combined » : un analyseur qui
# attend ce format lit les siens et ignore le surplus. Il est indispensable ici —
# le vhost est `default_server` sur le port 80, donc il recoit TOUT ce qui arrive
# sur cette adresse, y compris les requetes qui visent un autre nom. Sans ce
# champ, impossible de distinguer un visiteur du lab de quelqu'un qui cherche
# autre chose sur la machine.
log_format lab_anon '$ip_tronquee - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$host"';

# Lissage des points d'entrée coûteux du lab.
#
# Argon2id à 64 Mio est lent par conception — c'est ce qui protège les mots de
# passe. Avec deux cœurs, une poignée de vérifications simultanées suffit à
# saturer le processeur. Deux bornes s'en chargent, et aucune ne suffit seule :
# les files ci-dessous donnent à chaque préfixe sa part ; les groupes d'ouvriers
# PHP `calcul` et `lourd` (php-fpm-calcul.conf) bornent le nombre de
# hachages simultanés quelle que soit l'origine. Une file par préfixe ne retient
# pas qui dispose de mille préfixes.
#
# Volontairement PAS de bannissement : CrowdSec reste en SSH seul, aucun
# participant ne doit être exclu — sur ce serveur, scanner est le jeu.

# La connexion : une vérification par requête. La file fait patienter au lieu de
# refuser, pour ne pas renvoyer le bon mot de passe d'une adresse partagée.
limit_req_zone $cle_frein zone=lab_auth:10m rate=2r/s;

# L'inscription hache plusieurs secrets et un lot de codes de secours : c'est la
# route la plus chère du lab, et un geste qu'une personne fait une fois. Son
# débit est donc celui d'une personne.
limit_req_zone $cle_frein zone=lab_inscription:10m rate=6r/m;

# Le simulateur d'attaques rejoue de vraies inscriptions et de vraies connexions
# dans son bac à sable : un seul appel hache autant que plusieurs inscriptions.
limit_req_zone $cle_frein zone=lab_simulation:10m rate=6r/m;

# Le reste de l'API : toute route que les blocs nommés ne désignent pas. Une
# route neuve y tombe d'office — aucune ne naît sans file.
limit_req_zone $cle_frein zone=lab_api:10m rate=5r/s;

# Les mêmes routes, comptées par fournisseur : la part d'un seul reste en deçà
# de ce que les ouvriers savent hacher, pour que les autres trouvent une place.
limit_req_zone $cle_fournisseur zone=lab_calcul_fournisseur:10m rate=3r/s;
limit_req_zone $cle_fournisseur zone=lab_lourd_fournisseur:10m rate=12r/m;

# Un refus de file se lit dans le journal d'accès, par son code 429. Au niveau
# `error` par défaut, chacun écrirait en plus une ligne dans le journal
# d'erreurs : un flot de requêtes y remplirait le disque.
limit_req_log_level warn;

# Les portes du niveau 3 et les consoles d'arbitrage. Elles écrivent en base :
# un fil de discussion, un faisceau de réponses.
#
# 🔑 Deux lissages, et volontairement SANS `nodelay` : nginx fait patienter au
# lieu de refuser. La bibliothèque n'a pas de frein par compte — il fermerait la
# porte du titulaire —, donc la borne est au déploiement. Un refus la porterait
# mal : qui partage une adresse de sortie
# avec un tiers bruyant serait exclu pour le bruit d'un autre, et sur ce serveur
# chercher est le jeu. Une file ne mémorise rien et n'exclut personne.
limit_req_zone $cle_frein zone=lab_l3:10m rate=2r/s;
limit_req_zone $cle_frein zone=lab_arbitre:10m rate=2r/s;

# Les routes qui dérivent une clé : chaque requête y paie un Argon2id de 64 Mio. Les
# anonymes — le suivi d'un rapport, son dépôt, la soumission d'un drapeau, le profil
# public d'un membre — avant tout contrôle ; celles d'une session — la messagerie,
# l'enregistrement du profil, le simulateur d'attaques — derrière un compte qui
# s'obtient sans invitation. Même forme que ci-dessus : une file, pas un refus.
# La file compte par préfixe, pas par adresse : un /64 IPv6 ou un /24 IPv4 partage une clé.
limit_req_zone $cle_frein zone=lab_derive:10m rate=2r/s;

# Meme code que le verrou applicatif du lab, qui repond deja 429.
# Le defaut de nginx est 503, qui suggere une panne du serveur : un chercheur
# le rapporterait comme un deni de service qu il aurait provoque.
limit_req_status 429;

server {
    server_name ctf.my-self.fr;
    root /var/www/ctf-s2/demo/lab/public;
    index index.php;

    # Adresse source tronquée (/24 et /48) — le format vient de
    # conf.d/lab-journaux.conf, qui dit pourquoi.
    access_log /var/log/nginx/access.log lab_anon;

    if ($appel_tiers) { return 403; }

    location / { try_files $uri $uri/ =404; }

    # Une route ne se nomme que par son chemin exact. `/api/login.php/x.php` se
    # termine par `.php` : sans ce refus, le bloc générique du bas l'exécute comme
    # `login.php` suivi d'un reste de chemin, donc hors de sa file, de son plafond
    # de corps et de son groupe d'ouvriers. Le lab ne lit aucun reste de chemin.
    # ⚠️ Ce bloc doit rester le PREMIER des blocs à expression régulière : nginx
    # retient le premier qui convient.
    location ~ \.php/ { return 404; }

    # Deux refus, deux causes, et la page sait afficher l'un comme l'autre. 429 :
    # la file de CE préfixe est pleine. 503 : les ouvriers qui hachent sont tous
    # pris et leur file d'attente aussi — la cause est commune, pas le demandeur.
    # Rien n'est mémorisé, personne n'est exclu.
    location @occupe {
        default_type application/json;
        add_header Retry-After 5 always;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        return 429 '{"ok":false,"error":"file_pleine","message":"Trop de demandes depuis ta connexion : réessaie dans quelques secondes. / Too many requests from your connection: retry in a few seconds."}';
    }
    location @sature {
        default_type application/json;
        add_header Retry-After 10 always;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        return 503 '{"ok":false,"error":"sature","message":"Le serveur est occupé par d\'autres demandes : réessaie dans quelques secondes. / The server is busy with other requests: retry in a few seconds."}';
    }
    location @sature_page {
        default_type "text/html; charset=utf-8";
        add_header Retry-After 10 always;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        return 503 '<!doctype html><meta charset="utf-8"><title>503</title><p>Le serveur est occupé par d\'autres demandes : réessaie dans quelques secondes.</p><p>The server is busy with other requests: retry in a few seconds.</p>';
    }

    # Les fichiers que nginx sert lui-même repartaient sans aucun en-tête :
    # PHP pose les siens, mais il ne voit jamais passer un .js.
    include snippets/lab-entetes-statiques.conf;

    # Les deux routes les plus chères ont leurs propres ouvriers : les noyer ne
    # prend ni ceux de la connexion, ni ceux des pages.
    #
    # 🔑 `error_log … crit` : quand la file d'attente des ouvriers est pleine,
    # nginx écrit une ligne `[error]` par requête refusée. Sous un flot, ces lignes
    # rempliraient le disque ; le refus reste lisible au journal d'accès (503). Une
    # panne du groupe d'ouvriers, elle, s'écrit en `[crit]` et reste visible.
    location ~ ^/api/register\.php$ {
        limit_req zone=lab_inscription burst=2 nodelay;
        limit_req zone=lab_lourd_fournisseur burst=3 nodelay;
        client_max_body_size 4k;
        fastcgi_read_timeout 90s;
        error_page 429 = @occupe;
        error_page 502 504 = @sature;
        error_log /var/log/nginx/error.log crit;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-lourd.sock;
    }
    location ~ ^/api/attack\.php$ {
        limit_req zone=lab_simulation burst=3 nodelay;
        limit_req zone=lab_lourd_fournisseur burst=3 nodelay;
        client_max_body_size 4k;
        fastcgi_read_timeout 90s;
        error_page 429 = @occupe;
        error_page 502 504 = @sature;
        error_log /var/log/nginx/error.log crit;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-lourd.sock;
    }
    # La connexion.
    location ~ ^/api/login\.php$ {
        limit_req zone=lab_auth burst=10;
        limit_req zone=lab_calcul_fournisseur burst=12;
        client_max_body_size 4k;
        error_page 429 = @occupe;
        error_page 502 504 = @sature;
        error_log /var/log/nginx/error.log crit;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-calcul.sock;
    }
    # Niveau 3 : dépôt d'un dossier, fil avec l'arbitre, remise des secrets.
    #
    # 🔑 `vote.php` rejoint cette zone le 10/10/2026, et le nom `lab_l3` dit donc
    # moins que son contenu : ce qui réunit ces routes est qu'elles ÉCRIVENT EN
    # BASE à la demande de n'importe qui. Le nom reste parce qu'une zone se
    # déclare dans le contexte `http` en tête de ce fichier, et qu'un renommage
    # pour la seule justesse du libellé ne vaut pas un rechargement de plus.
    #
    # Pourquoi `vote.php` en avait besoin : il résolvait l'auteur d'une cible
    # AVANT de valider le motif, si bien qu'un identifiant nu distinguait
    # l'existant de l'inexistant — sans rien écrire, donc sans rien coûter.
    # L'ordre est corrigé dans `Moderate::applyVote`, et sonder par un vote négatif
    # exige un motif valide, donc inscrit un vote tracé et non répétable ; le vote
    # positif, au motif facultatif, reste une sonde (limite déclarée au README du
    # module). Le lissage borne la vitesse. Trois de ses voisines l'avaient, pas lui.
    location ~ ^/api/(recover_l3|recover_l3_init|recover_l3_reset|dispute_chat|vote)\.php$ {
        limit_req zone=lab_l3 burst=10;
        limit_req zone=lab_calcul_fournisseur burst=12;
        error_page 429 = @occupe;
        error_page 502 504 = @sature;
        error_log /var/log/nginx/error.log crit;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-calcul.sock;
    }
    # Les consoles d'arbitrage. Noyer l'arbitre n'apprend rien à personne.
    #
    # ⚠️ Le motif couvre `/api/admin_disputes.php` : c'est la route que la page
    # rappelle d'elle-même (cf. `setInterval` d'admin_disputes.php), donc celle
    # qui compte. Une énumération `admin_(freeze|unfreeze|dispute_…)` l'avait
    # laissée dehors — elle n'a pas le tiret bas après « dispute ».
    # `admin.php` sans tiret bas est le routeur d'arbitrage, et `/admin.php` sa
    # page : le motif `admin_[a-z_]+` les laissait tous deux dehors.
    location ~ ^/(api/admin(_[a-z_]+)?|admin|admin_disputes)\.php$ {
        limit_req zone=lab_arbitre burst=10;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    # Les appels d'API qui dérivent une clé, et l'enrôlement d'un appareil, qui
    # vérifie le mot mémorisé du titulaire.
    #
    # `recover.php` et `sel.php` rejoignent la zone : la récupération par code
    # mène à deux `password_verify` menés l'un comme l'autre quoi qu'il arrive,
    # pour ne pas trahir lequel a échoué — donc deux Argon2id par requête, sans
    # qu'aucun compte soit nécessaire.
    location ~ ^/api/(report_status|redteam_report|flag_submit|recover|sel|dm_send|dm_inbox|profile_save|device_enroll)\.php$ {
        limit_req zone=lab_derive burst=10;
        limit_req zone=lab_calcul_fournisseur burst=12;
        error_page 429 = @occupe;
        error_page 502 504 = @sature;
        error_log /var/log/nginx/error.log crit;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-calcul.sock;
    }
    # Les pages qui dérivent une clé : même file, mêmes ouvriers. Une page peut
    # être ouverte depuis un autre site — arriver sur le lab par un lien partagé
    # est une navigation légitime —, elle n'est donc jamais refusée sur sa provenance.
    location ~ ^/(profile|messages|recover)\.php$ {
        limit_req zone=lab_derive burst=10;
        limit_req zone=lab_calcul_fournisseur burst=12;
        error_page 502 504 = @sature_page;
        error_log /var/log/nginx/error.log crit;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-calcul.sock;
    }
    # La récupération « depuis cet appareil ». Deux appels suffisent à un
    # titulaire : demander un défi, le signer.
    #
    # 🔑 Le corps légitime tient en quelques centaines d'octets — identifiant de
    # 64 caractères au plus, défi de 43, signature P1363 en base64url de 86. Sans
    # ce plafond, le défaut de nginx laisse poster 1 Mo par requête, et la
    # bibliothèque range ce qu'on lui donne.
    location ~ ^/api/device_auth_(begin|finish)\.php$ {
        client_max_body_size 4k;
        limit_req zone=lab_l3 burst=10;
        limit_req zone=lab_calcul_fournisseur burst=12;
        error_page 429 = @occupe;
        error_page 502 504 = @sature;
        error_log /var/log/nginx/error.log crit;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-calcul.sock;
    }
    # Toute autre route de l'API. Aucune ne hache : elles gardent les ouvriers du
    # site. Une route qui en viendrait à hacher se déplace dans l'un des blocs
    # du dessus ; d'ici là elle a au moins cette file.
    location ~ ^/api/[a-z0-9_]+\.php$ {
        limit_req zone=lab_api burst=20;
        error_page 429 = @occupe;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    # Les pages. `try_files $uri` exige que le chemin demandé soit lui-même un
    # fichier : ce bloc n'exécute jamais un script suivi d'un reste de chemin, même
    # si le refus placé en tête des blocs venait à être déplacé.
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    include snippets/lab-deny-backups.conf;
    location ~ /\.(?!well-known) { deny all; }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ctf.my-self.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ctf.my-self.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = ctf.my-self.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server; listen [::]:80 default_server;
    server_name ctf.my-self.fr;

    # Ce bloc est `default_server` : il recoit tout ce qui vise un autre nom sur
    # cette adresse. Sans cette ligne, ces requetes retombent sur l'access_log du
    # contexte `http` — format `combined`, donc adresse source ENTIERE et pas de
    # champ `$host`. Les deux effets se mesurent ensemble (04/10) : une requete
    # portant un nom d'hote etranger inscrivait l'adresse de son auteur en clair,
    # et restait invisible au controle qui cherche exactement ce cas.
    access_log /var/log/nginx/access.log lab_anon;

    return 404; # managed by Certbot


}
