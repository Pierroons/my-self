# Contexte http du lab — déclaré ICI, comme les autres gabarits du dépôt.
#
# 🔑 Un gabarit déclare ce qu'il emploie. Sorties dans un fichier à part, ces
# directives rendaient le vhost intestable (« unknown log format ») et le
# feraient refuser de démarrer sur une machine qui ne les porte pas déjà.

# Journaux du lab : l'adresse source est tronquée avant d'être écrite.
#
# Pourquoi : ce serveur est fait pour être attaqué, et ses journaux sont ce que
# quelqu'un lira s'il obtient un accès. Une adresse complète y désignerait des
# personnes — les chercheurs invités, et l'administrateur qui s'y connecte
# depuis chez lui. Le modèle de menace du lab interdit qu'il livre cela.
#
# Tronquer plutôt que masquer : /24 en IPv4 et /48 en IPv6 gardent de quoi
# reconnaître une même origine d'une requête à l'autre — donc de lire une
# campagne de scan — sans désigner un abonné.
#
# ⚠️ CrowdSec n'est pas concerné : sur cette machine il ne lit que le journal
# SSH (`acquis.yaml`, source unique journalctl ssh.service). Aucun bannissement
# ne dépend de ce format.
map $remote_addr $ip_tronquee {
    ~^(?<v4>\d+\.\d+\.\d+)\.           "$v4.0";
    ~^(?<v6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):  "$v6::";
    default                            "0.0.0.0";
}

log_format lab_anon '$ip_tronquee - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Lissage des points d'entrée coûteux du lab.
#
# Argon2id à 64 Mo est lent par conception — c'est ce qui protège les mots de
# passe. Avec deux cœurs, une poignée de vérifications simultanées suffit à
# saturer le processeur. Cette zone empêche qu'une rafale y parvienne, sans
# gêner un usage normal ni une recherche méthodique.
#
# Volontairement PAS de bannissement : CrowdSec reste en SSH seul, aucun
# participant ne doit être exclu — sur ce serveur, scanner est le jeu.
limit_req_zone $binary_remote_addr zone=lab_auth:10m rate=10r/s;

# Meme code que le verrou applicatif du lab, qui repond deja 429.
# Le defaut de nginx est 503, qui suggere une panne du serveur : un chercheur
# le rapporterait comme un deni de service qu il aurait provoque.
limit_req_status 429;

server {
    server_name ctf.my-self.fr;
    root /var/www/ctf-s2/demo/lab/public;
    index index.php;

    # Adresse source tronquée (/24 et /48) — le format vient de
    # conf.d/lab-journaux.conf, qui dit pourquoi.
    access_log /var/log/nginx/access.log lab_anon;

    location / { try_files $uri $uri/ =404; }

    # Les fichiers que nginx sert lui-même repartaient sans aucun en-tête :
    # PHP pose les siens, mais il ne voit jamais passer un .js.
    include snippets/lab-entetes-statiques.conf;

    # Authentification : Argon2id sature vite deux cœurs. 10 req/s, rafale
    # de 20 tolérée sans délai — invisible en usage normal.
    location ~ ^/api/(login|register)\.php$ {
        limit_req zone=lab_auth burst=20 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location ~ \.php$ { include snippets/fastcgi-php.conf; fastcgi_pass unix:/run/php/php8.4-fpm.sock; }
    include snippets/lab-deny-backups.conf;
    location ~ /\.(?!well-known) { deny all; }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ctf.my-self.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ctf.my-self.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = ctf.my-self.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server; listen [::]:80 default_server;
    server_name ctf.my-self.fr;
    return 404; # managed by Certbot


}
