; Les ouvriers de la démonstration SelfDataGuard — à poser dans
; /etc/php/8.4/fpm/pool.d/, à côté du groupe `www`.
;
; Le vhost (nginx-dataguard.conf) lui confie son unique `location ~ \.php$`,
; donc toutes les routes PHP de ce site.
;
; 🔑 Pourquoi ce groupe est une CONDITION DE DÉPLOIEMENT, et pas un confort.
; SelfDataGuard 0.10.0 rend le poivre obligatoire et le range HORS de la base,
; dans un fichier que PHP lit. Sous un utilisateur partagé, une exécution de
; code dans n'importe lequel des autres sites PHP de la machine lit ce fichier
; ET la base : le poivre ne protégerait alors que d'une fuite de la base seule
; — injection, sauvegarde perdue — et d'aucun voisin. Il perdrait exactement ce
; pour quoi il existe. Ce groupe doit donc être posé AVANT que la 0.10.0
; atteigne ce site.
;
; 🔑 Pourquoi `user` change mais pas `listen.owner`. `user` est l'identité qui
; exécute le PHP ; `listen.owner`/`listen.group` disent qui peut PARLER à la
; socket. nginx tourne ses ouvriers sous `www-data` (mesuré le 24/11/2026),
; c'est donc lui qui l'ouvre, et `0660` avec ce propriétaire ferme la socket à
; tout le reste — y compris aux autres groupes d'ouvriers.
;
; 🔴 `php-dataguard` ne doit PAS être membre du groupe `www-data`. Mesuré le
; 24/11/2026 : 74 répertoires de l'arbre servi sont inscriptibles par ce
; groupe. Un membre y déposerait un fichier PHP que tous les autres groupes
; exécuteraient — le cloisonnement se contournerait par une seule écriture, et
; le poivre avec. Détail et ordre des gestes : `deploy/my-self/README.md`.
;
; ⚠️ TROIS choses doivent suivre dans le même geste, sinon le site perd son
; état en silence :
;   — `/var/lib/selfdataguard/` (mesuré `drwx------ www-data www-data` le
;     24/11/2026) : base, clé d'index, `sessions/`, et le poivre en `0400` ;
;   — le `User=` de `demo-sessions-purge.service`, qui purge
;     `/var/lib/selfdataguard/sessions` toutes les cinq minutes — son minuteur
;     est ARMÉ sur la machine (mesuré le 24/11/2026 à 05:20) ;
;   — `demo/selfdataguard/storage`, le seul répertoire d'état qui vit DANS
;     l'arbre servi (`drwxrwxr-x www-data www-data`). Lire ce que
;     l'application y écrit avant de choisir : lui donner ce propriétaire, ou
;     le déplacer sous `/var/lib/selfdataguard/`, ce qui serait plus propre.
;
; ⚠️ Le vhost donne à PHP deux chemins d'état par `fastcgi_param`
; (nginx-dataguard.conf, le bloc PHP) : ils doivent rester lisibles par CE
; groupe et par lui seul. Les relire après le changement de propriétaire.
;
; ⚠️ Un groupe neuf ne reprend AUCUN réglage du groupe `www` : tout le
; durcissement PHP de cette machine vient de son `php.ini`, pas du groupe
; (mesuré le 19/11/2026). Refaire la mesure avant de poser ailleurs.
;
; ⚠️ CE FICHIER SE POSE AVANT LE VHOST. `nginx -t` ne vérifie pas qu'une
; socket existe : un vhost posé seul rendrait 502 sur tout le site.

[dataguard]
user = php-dataguard
group = php-dataguard
listen = /run/php/php8.4-fpm-dataguard.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
; 🔑 À LA DEMANDE, et non `dynamic` : une démonstration ne reçoit pas de
; trafic continu, donc aucun ouvrier n'a de raison d'attendre en mémoire. Au
; repos ce groupe ne coûte rien ; le premier appel paie le démarrage d'un
; ouvrier, ce qui est invisible devant la dérivation de clé qui suit.
pm = ondemand
; 🔴 **C'est LE groupe le plus coûteux de la machine, et de loin.** Ouvrir une
; enveloppe fait allouer son `memlimit` par libsodium, **hors** du
; `memory_limit` de PHP. Et une enveloppe porte SON profil : un lecteur paie ce
; que son auteur a choisi, jusqu'au plafond que la bibliothèque accepte encore
; en relecture — `PROFILE_CEILING_MEMLIMIT` dans
; `self-security/selfdataguard/src/Crypto/Primitives.php`, quatre fois le profil
; de scellement. Le pic d'un ouvrier d'ici est donc son repos plus ce plafond.
;
; 🔑 **Et c'est ce qui justifie le découpage, pas seulement le poivre.** Tant
; qu'un seul groupe servait les huit vhosts, CHACUN de ses ouvriers pouvait
; atteindre ce plafond, puisque n'importe lequel pouvait être celui-ci : mesuré le
; 24/11/2026, 12 ouvriers × 285 Mio = 3 420 Mio de pire cas pour un budget de
; 3 885 Mio, soit 88 %. Maintenant seuls les ouvriers de CE groupe peuvent y
; monter, et le pire cas de la machine entière tombe sous la moitié du budget.
;
; @pic: selfdataguard-plafond
;
; TROIS au plus, et c'est un plafond serré exprès : trois relectures simultanées
; au plafond coûtent déjà ~855 Mio. Le chiffre se relit par
; `POOL_SSH_HOST=<alias> bash deploy/my-self/tests/pic-ouvrier-php.sh`, qui
; tranche sur la mémoire réelle de la machine — pas ce commentaire.
pm.max_children = 3
; Un ouvrier ne se perd pas : au-delà de cette échéance il est arrêté, là où
; `fastcgi_read_timeout` ne ferme que la connexion côté nginx et laisse le
; script courir. Aucune route de ce site n'a de délai long.
request_terminate_timeout = 65s
