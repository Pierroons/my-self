server {
    include snippets/deny-bakfiles.conf;
    listen 443 ssl;  # TLS terminé ici, en direct
    server_name dataguard.example.org;
    ssl_certificate     /etc/ssl/dataguard.example.org/fullchain.pem;
    ssl_certificate_key /etc/ssl/dataguard.example.org/privkey.pem;

    include snippets/security-headers-base.conf;
    include snippets/hsts.conf;
    include snippets/csp-dataguard.conf;
    root  /var/www/myself/demo/selfdataguard;
    index index.html;

    # Stockage (DB SQLite chiffree, .gitkeep) : jamais servi par le web.
    location ^~ /storage/ { deny all; }

    location ~ \.(md|sh|ya?ml|toml|lock|sql|ini|bak|example|sample)$ { return 404; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\.(?!well-known) { deny all; }

    # Execution PHP (sinon les .php sont servis en source brute).
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        # Etat mutable (DB SQLite chiffree + blindKey) hors du webroot immutable.
        fastcgi_param DATAGUARD_DB_PATH       /var/lib/selfdataguard/demo.sqlite;
        fastcgi_param DATAGUARD_BLINDKEY_PATH /var/lib/selfdataguard/blindkey.bin;
    }
}
