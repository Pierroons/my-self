# Bi-Self — Vhost pour your-instance.example
# Landing binôme SelfRecover + SelfModerate, préparé pour accueillir les
# démos live interactives (spec : bi-self/docs/demo/SPEC.md).

limit_req_zone $binary_remote_addr zone=biself:10m rate=10r/s;

server {
    server_name your-instance.example;

    root /var/www/bi-self;
    index index.html;

    # Security headers
    #
    # ⚠️ Un seul `add_header` dans un bloc `location` ANNULE toute cette liste
    # pour ce bloc — nginx ne fusionne pas, il remplace le niveau hérité. Le
    # piège est silencieux : la page continue de s'afficher, elle sort
    # simplement sans ses protections. Avant d'ajouter un `add_header` plus
    # bas, soit on recopie ces cinq lignes dans le bloc, soit on emploie une
    # directive qui n'est pas un `add_header` — `expires` en est une.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; frame-ancestors 'none'" always;

    location / {
        limit_req zone=biself burst=20 nodelay;
        try_files $uri $uri/ =404;
    }

    # `expires` pose Expires et Cache-Control sans passer par `add_header` :
    # les en-têtes de sécurité du bloc serveur restent donc en place ici. Le
    # `add_header Cache-Control` qui suivait faisait double emploi avec cette
    # directive, et coûtait les cinq protections sur la page d'accueil — la
    # plus visitée du site.
    location = /index.html {
        expires 1h;
    }

    # === Démos live (demo-backend) ===
    #
    # 🔑 Les routes sont énumérées, pas devinées. Chaque endpoint du backend
    # doit être nommé ici pour être joignable : `try_files` sur le dossier
    # servirait n'importe quel .php qui y traîne, y compris un fichier oublié.
    #
    # ⚠️ Conséquence à retenir : ajouter un fichier dans `api/recover/` ne
    # suffit pas. Sans son nom dans l'alternance ci-dessous, il répond 404
    # quoi qu'il arrive — le code est déployé et l'endpoint reste injoignable.
    location = /moderate { rewrite ^ /moderate.html last; }
    location = /duo      { rewrite ^ /duo.html last; }
    location = /recover  { rewrite ^ /recover.html last; }

    location = /demo/api/session {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/bi-self/demo-backend/api/session.php;
        fastcgi_param SCRIPT_NAME /demo/api/session;
    }

    # Flux d'événements : la mise en tampon est coupée, sinon les logs
    # n'arrivent au navigateur qu'à la fermeture de la connexion.
    location = /demo/api/events {
        fastcgi_buffering off;
        fastcgi_read_timeout 1800s;
        fastcgi_send_timeout 1800s;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/bi-self/demo-backend/api/events.php;
        fastcgi_param SCRIPT_NAME /demo/api/events;
    }

    location ~ "^/demo/api/recover/(register|login|logout|recover-l1|recover-l2-code|phishing-check|me|site-salt|phishing-sim|code)/?$" {
        set $sr_action $1;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/bi-self/demo-backend/api/recover/$sr_action.php;
        fastcgi_param SCRIPT_NAME /demo/api/recover/$sr_action;
    }

    location ~ "^/demo/api/moderate/(me|users|create-identity|vote|trigger-pack|drain-reputation|farm-upvotes|tick|code)/?$" {
        set $sm_action $1;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/bi-self/demo-backend/api/moderate/$sm_action.php;
        fastcgi_param SCRIPT_NAME /demo/api/moderate/$sm_action;
    }

    location ~ "^/demo/api/duo/(sybil-attack)/?$" {
        set $duo_action $1;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/bi-self/demo-backend/api/duo/$duo_action.php;
        fastcgi_param SCRIPT_NAME /demo/api/duo/$duo_action;
    }

    # Block attack paths
    location ~ /\. { deny all; }
    location ~ \.php$ { deny all; }
    location ~ ~$ { deny all; }

    server_tokens off;

    access_log /var/log/nginx/biself-access.log;
    error_log /var/log/nginx/biself-error.log warn;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/your-instance.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-instance.example/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Redirection HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-instance.example;
    if ($host = your-instance.example) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
