# Bi-Self — Vhost pour your-instance.example
# Landing binôme SelfRecover + SelfModerate, préparé pour accueillir les
# démos live interactives (spec : bi-self/docs/demo/SPEC.md).

# 🔑 Les freins comptent par PRÉFIXE, pas par adresse. `$binary_remote_addr`
# donne à chaque adresse d'une /64 IPv6 son propre quota : un seul fournisseur
# en tient des milliards, et le frein ne borne plus rien. Même motif que le lab
# CTF (`deploy/ctf-s2/nginx-ctf.conf`), repris à l'identique exprès — un second
# motif de clé serait une divergence à maintenir.
#
# ⚠️ CHANGER LA CLÉ D'UNE ZONE EXISTANTE NE S'APPLIQUE PAS À UN RECHARGEMENT.
# nginx garde la zone déjà en mémoire et ne dit rien. Les zones `biself` et
# `biself_recover` passant de `$binary_remote_addr` à `$cle_frein`, la pose de
# ce gabarit demande un `systemctl restart nginx` — environ une seconde de
# coupure, et les compteurs en cours repartent de zéro.
map $remote_addr $cle_frein {
    ~^(?<p4>\d+\.\d+\.\d+)\.                                              "$p4.0";
    ~^(?<p6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):         "$p6::";
    default                                                               $remote_addr;
}

limit_req_zone $cle_frein zone=biself:10m rate=10r/s;

# Le niveau 1 de SelfRecover n'a plus de frein par compte : ce lissage est la borne
# que la bibliothèque délègue au déploiement, et son modèle de menace la nomme. Un
# essai qui atteint la comparaison coûte un Argon2id à 64 Mio — deux par seconde et
# par adresse suffisent largement à qui recopie un papier, et bornent le reste.
#
# ⚠️ `burst` SANS `nodelay` : les requêtes en trop ATTENDENT leur tour au lieu
# d'être refusées. C'est la différence qui compte ici — une file ne mémorise rien,
# donc n'exclut aucun compte après coup, là où un refus ferme la porte à qui passe
# derrière un tiers bruyant.
limit_req_zone $cle_frein zone=biself_recover:10m rate=2r/s;

# Les routes d'API que rien ne nommait : `session`, les neuf de `moderate`,
# `duo/sybil-attack`. nginx ne retient qu'un bloc `location`, donc celui de `/`
# et sa zone `biself` ne s'appliquaient pas à elles — elles n'avaient AUCUN
# frein. Relevé par la conv Recover le 18/11/2026 (`REC-1811-2203`), à une
# heure où toutes partageaient le groupe d'ouvriers du reste de la machine.
limit_req_zone $cle_frein zone=biself_api:10m rate=5r/s;

# 🔑 Le flux d'événements se borne en CONNEXIONS, pas en requêtes. `events.php`
# est un `text/event-stream` qui boucle jusqu'à l'échéance de la session — son
# en-tête annonce « Timeout max : 30 min » — et le vhost lui accorde
# `fastcgi_read_timeout 1800s`. Une file au débit ne mesure rien là : UNE
# requête suffit à tenir un ouvrier une demi-heure. C'est le nombre de
# connexions simultanées qu'il faut plafonner.
limit_conn_zone $cle_frein zone=biself_flux:10m;

server {
    # Refuse les copies de sauvegarde tombées dans une racine servie. Le fichier
    # à poser est `deploy/my-self/snippets/deny-bakfiles.conf`, à copier dans
    # `/etc/nginx/snippets/` : le déploiement ne touche pas aux vhosts, donc ni
    # à leurs snippets. Sans cette copie, nginx refuse de démarrer.
    include snippets/deny-bakfiles.conf;

    server_name your-instance.example;

    # ⚠️ L'arborescence du dépôt est PRÉSERVÉE sous cette racine : les pages sont
    # servies depuis `demo/bi-self-duo/frontend/`, et non aplaties ici. C'est ce
    # qui permet au lien `frontend/js/sr-derive.js` d'atteindre
    # `bi-self/selfrecover/client/` quatre crans plus haut. Aplatir la
    # disposition poserait un lien mort, donc une page qui charge et une
    # inscription qui échoue en silence.
    root /var/www/myself/demo/bi-self-duo/frontend;
    index index.html;

    # 429 plutôt que le 503 par défaut : ces routes répondent à du JavaScript,
    # et « trop de requêtes » se distingue de « service indisponible » — un 503
    # fait croire à une panne, et les sondes de disponibilité le comptent comme
    # telle. Ce sont des directives, pas des `add_header` : l'avertissement
    # ci-dessus ne s'y applique pas.
    limit_req_status 429;
    limit_conn_status 429;

    # Security headers
    #
    # ⚠️ Un seul `add_header` dans un bloc `location` ANNULE toute cette liste
    # pour ce bloc — nginx ne fusionne pas, il remplace le niveau hérité. Le
    # piège est silencieux : la page continue de s'afficher, elle sort
    # simplement sans ses protections. Avant d'ajouter un `add_header` plus
    # bas, soit on recopie ces cinq lignes dans le bloc, soit on emploie une
    # directive qui n'est pas un `add_header` — `expires` en est une.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; frame-ancestors 'none'" always;

    location / {
        limit_req zone=biself burst=20 nodelay;
        try_files $uri $uri/ =404;
    }

    # `expires` pose Expires et Cache-Control sans passer par `add_header` :
    # les en-têtes de sécurité du bloc serveur restent donc en place ici. Le
    # `add_header Cache-Control` qui suivait faisait double emploi avec cette
    # directive, et coûtait les cinq protections sur la page d'accueil — la
    # plus visitée du site.
    location = /index.html {
        expires 1h;
    }

    # === Démos live (demo-backend) ===
    #
    # 🔑 Les routes sont énumérées, pas devinées. Chaque endpoint du backend
    # doit être nommé ici pour être joignable : `try_files` sur le dossier
    # servirait n'importe quel .php qui y traîne, y compris un fichier oublié.
    #
    # ⚠️ Conséquence à retenir : ajouter un fichier dans `api/recover/` ne
    # suffit pas. Sans son nom dans l'alternance ci-dessous, il répond 404
    # quoi qu'il arrive — le code est déployé et l'endpoint reste injoignable.
    location = /moderate { rewrite ^ /moderate.html last; }
    location = /duo      { rewrite ^ /duo.html last; }
    location = /recover  { rewrite ^ /recover.html last; }

    location = /demo/api/session {
        # Ouvrir une session de démo est ce qui donne droit au flux ci-dessous :
        # la borner borne aussi le nombre de flux qu'un préfixe peut réclamer.
        limit_req zone=biself_api burst=10;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myself/demo/bi-self-duo/api/session.php;
        fastcgi_param SCRIPT_NAME /demo/api/session;
    }

    # Flux d'événements : la mise en tampon est coupée, sinon les logs
    # n'arrivent au navigateur qu'à la fermeture de la connexion.
    location = /demo/api/events {
        # Deux flux par préfixe à la fois. Au-delà, 429 immédiat : mieux vaut un
        # refus lisible qu'une page qui attend un ouvrier qui ne viendra pas.
        limit_conn biself_flux 2;
        limit_req zone=biself_api burst=5;
        fastcgi_buffering off;
        fastcgi_read_timeout 1800s;
        fastcgi_send_timeout 1800s;
        include fastcgi_params;
        # 🔴 GROUPE D'OUVRIERS DÉDIÉ — `deploy/bi-self/php-fpm-flux.conf`.
        #
        # Ce flux tient son ouvrier jusqu'à trente minutes. Tant qu'il partageait
        # le groupe `www`, une poignée de connexions tenues sur cette seule route
        # de démonstration pouvait faire attendre TOUT ce que la machine sert en
        # PHP, pas la démonstration seule — un déploiement n'a qu'un groupe
        # d'ouvriers tant que personne ne lui en ajoute, et c'était le cas ici au
        # 19/11/2026. Un groupe à part transforme un déni de service général en
        # une démonstration qui sature seule.
        #
        # ⚠️ CE FICHIER SE POSE AVANT CE VHOST. `nginx -t` ne vérifie pas qu'une
        # socket existe : un vhost posé seul rend 502 sur le flux.
        fastcgi_pass unix:/run/php/php8.4-fpm-flux.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myself/demo/bi-self-duo/api/events.php;
        fastcgi_param SCRIPT_NAME /demo/api/events;
    }

    location ~ "^/demo/api/recover/(register|login|logout|recover-l1|recover-l2-code|phishing-check|me|sel|phishing-sim|code)/?$" {
        # nginx ne retient qu'un bloc `location` : celui de `/` ne s'applique pas ici.
        limit_req zone=biself_recover burst=10;
        set $sr_action $1;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myself/demo/bi-self-duo/api/recover/$sr_action.php;
        fastcgi_param SCRIPT_NAME /demo/api/recover/$sr_action;
    }

    location ~ "^/demo/api/moderate/(me|users|create-identity|vote|trigger-pack|drain-reputation|farm-upvotes|tick|code)/?$" {
        # nginx ne retient qu'un bloc : celui de `/` ne s'applique pas ici. Ces
        # neuf routes n'avaient donc aucun frein, `drain-reputation`, `tick` et
        # `farm-upvotes` comprises — celles qui font travailler le serveur.
        limit_req zone=biself_api burst=10;
        set $sm_action $1;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myself/demo/bi-self-duo/api/moderate/$sm_action.php;
        fastcgi_param SCRIPT_NAME /demo/api/moderate/$sm_action;
    }

    location ~ "^/demo/api/duo/(sybil-attack)/?$" {
        # Une démonstration d'attaque Sybil : par nature, elle fabrique des
        # identités à la chaîne. Le burst est volontairement court.
        limit_req zone=biself_api burst=3;
        set $duo_action $1;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myself/demo/bi-self-duo/api/duo/$duo_action.php;
        fastcgi_param SCRIPT_NAME /demo/api/duo/$duo_action;
    }

    # Block attack paths
    location ~ /\. { deny all; }
    location ~ \.php$ { deny all; }
    location ~ ~$ { deny all; }

    server_tokens off;

    access_log /var/log/nginx/biself-access.log;
    error_log /var/log/nginx/biself-error.log warn;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/your-instance.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-instance.example/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Redirection HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-instance.example;
    if ($host = your-instance.example) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
