; Les ouvriers du flux d'événements — à poser dans /etc/php/8.4/fpm/pool.d/,
; à côté du groupe `www`.
;
; Le vhost de bi-self (nginx-bi-self.conf) ne leur confie QU'UNE route :
; `/demo/api/events`. Toutes les autres gardent le groupe `www`.
;
; 🔑 Pourquoi une route seule mérite son groupe. `events.php` est un
; `text/event-stream` : il boucle jusqu'à l'échéance de la session, en relisant
; son journal toutes les 200 ms, et son en-tête annonce « Timeout max : 30 min
; (durée session) ». Le vhost lui accorde `fastcgi_read_timeout 1800s`. Donc
; UNE requête tient un ouvrier une demi-heure — ce qu'aucune limite de débit ne
; mesure, puisqu'il n'y a qu'une requête.
;
; Mesuré le 19/11/2026 sur le serveur de production : il n'y avait qu'UN SEUL
; groupe d'ouvriers (`pool.d/www.conf`) pour tous ses sites PHP. Une poignée de
; connexions tenues sur cette seule route de démonstration pouvait donc faire
; attendre toute la production PHP de la machine, pas la démonstration seule.
; Un groupe à part transforme ce défaut en une démonstration qui sature seule.
;
; ⚠️ `request_terminate_timeout` est volontairement PLUS LONG que les 1800 s du
; vhost. Un ouvrier tué avant la fin du flux couperait la démonstration en
; pleine séance, et le navigateur ne saurait pas distinguer cette coupure d'une
; panne. Ce n'est pas lui qui borne l'abus : ce sont le nombre d'ouvriers
; ci-dessous et le `limit_conn` du vhost.
;
; ⚠️ Un groupe neuf ne reprend AUCUN réglage du groupe `www` de la machine.
; Avant de poser, lister ce que celui-ci règle en plus :
;
;   sudo grep -vE '^[[:space:]]*(;|$|\[|listen|pm[. =])' /etc/php/8.4/fpm/pool.d/www.conf
;
; 🔑 **Mesuré le 19/11/2026, et le résultat est contre-intuitif : il n'y a rien
; à reporter ici.** Le groupe `www` de la machine déclarait quatre `env[...]`.
; Or `events.php` n'inclut qu'un fichier, et celui-ci lit exactement trois
; variables — `SELFRECOVER_SESSIONS_DIR`, `SELFRECOVER_COOKIE_DOMAIN`,
; `SELFRECOVER_COOKIE_INSECURE` — dont AUCUNE n'était déclarée là. Les quatre
; déclarées, elles, ne sont lues par aucun fichier de ce chemin. Reporter « tout
; par prudence » aurait donc donné à ce flux des secrets qu'il n'emploie pas.
;
; 🔴 **Un en particulier ne doit JAMAIS être reporté ici** : le groupe partagé
; porte la clé d'API d'un service amont que SelfJustice emploie, et que la
; démonstration n'emploie pas. Un groupe d'ouvriers partagé partage ses
; ouvriers, mais aussi ses SECRETS : toute application PHP de la machine peut
; lire par `getenv()` ce que son pool déclare. Ce groupe-ci n'en porte aucun,
; et ce n'est pas un oubli — c'est la seule raison pour laquelle un flux public
; exposé ne peut pas servir à lire une clé qui n'est pas la sienne.
;
; ⚠️ Avant de poser sur une AUTRE machine, refaire cette mesure : ce qui n'est
; pas à reporter ici l'est peut-être là-bas.
;
; ⚠️ CE FICHIER SE POSE AVANT LE VHOST. `nginx -t` ne vérifie pas qu'une socket
; existe : un vhost posé seul rendrait 502 sur le flux, et la démonstration
; paraîtrait cassée sans que la configuration le dise.

[biself-flux]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm-flux.sock
listen.owner = www-data
listen.group = www-data
; File courte : quand les deux ouvriers sont pris, nginx répond tout de suite
; au lieu de faire patienter sans fin.
listen.backlog = 4
pm = static
; 🔑 DEUX, et le chiffre vient d'une mesure. Le groupe partagé de la machine de
; production déclarait `pm.max_children = 5` pour TOUT ce qu'elle sert en PHP
; (mesuré le 19/11/2026). En ajouter quatre ici aurait presque doublé le total
; d'ouvriers d'une machine qui en prévoyait cinq — on aurait déplacé le risque
; de saturation au lieu de le borner. Deux suffisent : le flux est une
; démonstration, pas un service.
;
; ⚠️ Ce chiffre se relit sur la machine de destination avant la pose. Sur un
; hôte qui en prévoit vingt, deux sont inutilement serrés ; sur un hôte qui en
; prévoit cinq, quatre sont de trop.
pm.max_children = 2
request_terminate_timeout = 1860s
