; Les ouvriers de bi-self — à poser dans /etc/php/8.4/fpm/pool.d/,
; à côté du groupe `www`.
;
; Le vhost de bi-self (nginx-bi-self.conf) lui confie toutes ses routes PHP
; SAUF `/demo/api/events`, qui a son propre groupe (php-fpm-flux.conf) parce
; qu'un flux retient son ouvrier une demi-heure.
;
; 🔑 Pourquoi une IDENTITÉ et pas seulement un groupe d'ouvriers. Les deux
; groupes déjà posés dans ce dépôt (`flux` ici, `calcul` et `lourd` pour le
; lab) bornent le nombre d'ouvriers ; tous tournent sous `www-data`. Celui-ci
; est le premier à changer d'utilisateur, et le motif est différent : l'état de
; SelfRecover (`/var/lib/selfrecover/`) n'a aucune raison d'être lisible par
; les autres sites PHP de la machine. Sous un utilisateur partagé, une
; exécution de code dans n'importe lequel d'entre eux le lit.
;
; 🔑 Pourquoi `user` change mais pas `listen.owner`. Ce sont deux choses
; distinctes : `user` est l'identité qui exécute le PHP, `listen.owner` et
; `listen.group` disent qui peut PARLER à la socket. nginx tourne ses ouvriers
; sous `www-data` (mesuré le 24/11/2026) : c'est donc lui qui doit l'ouvrir, et
; `0660` avec ce propriétaire et ce groupe ferme la socket à tout le reste —
; y compris aux autres groupes d'ouvriers.
;
; 🔴 `php-biself` ne doit PAS être membre du groupe `www-data`. Mesuré le
; 24/11/2026 sur la machine qui sert : 74 répertoires de l'arbre servi sont
; inscriptibles par ce groupe, racine comprise. Un membre y déposerait un
; fichier PHP, que TOUS les groupes d'ouvriers exécuteraient ensuite — le
; cloisonnement se contournerait par une seule écriture. La création de
; l'utilisateur, les propriétaires d'état qui doivent suivre et l'ordre des
; gestes sont dans `deploy/my-self/README.md`.
;
; ⚠️ Ce qui doit changer de propriétaire DANS LE MÊME GESTE, sinon le site
; perd son état sans que la configuration le dise : `/var/lib/selfrecover/`
; (mesuré `drwx------ www-data www-data` le 24/11/2026) et le `User=` de
; `selfrecover-purger.service`, qui lit la même base.
;
; ⚠️ Un groupe neuf ne reprend AUCUN réglage du groupe `www`. La mesure du
; 19/11/2026 (consignée dans php-fpm-flux.conf) a établi qu'il n'y a rien à
; reporter : tout le durcissement PHP de cette machine vient de son `php.ini`,
; pas du groupe. Refaire la mesure avant de poser sur une autre machine.
;
; ⚠️ CE FICHIER SE POSE AVANT LE VHOST. `nginx -t` ne vérifie pas qu'une socket
; existe : un vhost posé seul rendrait 502 sur tout bi-self.

[biself]
user = php-biself
group = php-biself
listen = /run/php/php8.4-fpm-biself.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
; 🔑 **Le pic de ce groupe, et d'où il vient.** Les routes de récupération
; dérivent un Argon2id — mesuré le 24/11/2026 : 10 fichiers de
; `demo/bi-self-duo/` appellent cette dérivation. Son profil est celui de
; SelfRecover, `Hashing::ARGON2` dans
; `bi-self/selfrecover/src/Crypto/Hashing.php`, et libsodium alloue ce
; `memory_cost` **hors** du `memory_limit` de PHP. Le pic d'un ouvrier d'ici est
; donc son repos PLUS ce profil — pas son repos seul.
;
; ⚠️ **Ce n'est pas le même profil que SelfDataGuard**, qui relit des enveloppes
; sous un plafond quatre fois plus haut. C'est la raison du marqueur ci-dessous :
; avant le découpage, un seul groupe servait tout, donc chacun de ses ouvriers
; pouvait atteindre le PIRE des profils de la machine. Maintenant chaque groupe
; porte le sien, et `pic-ouvrier-php.sh` lit chaque profil dans sa source au lieu
; d'appliquer le pire à tous.
;
; @pic: selfrecover
;
; SIX au plus : c'est le site qui reçoit le vrai trafic des trois, et six
; dérivations simultanées restent loin du budget que le contrôle établit. Le
; chiffre se relit par `POOL_SSH_HOST=<alias> bash
; deploy/my-self/tests/pic-ouvrier-php.sh`, qui tranche — pas ce commentaire.
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Un ouvrier ne se perd pas : au-delà de cette échéance il est arrêté, alors
; que `fastcgi_read_timeout` du vhost ferme seulement la connexion côté nginx
; et laisse le script courir. Aucune route de ce groupe n'a de délai long —
; la seule qui en a (`/demo/api/events`, 1800 s) part dans le groupe `flux`.
request_terminate_timeout = 65s
