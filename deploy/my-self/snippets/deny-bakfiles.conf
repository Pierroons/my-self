# Refuse les fichiers qu'un déploiement laisse derrière lui.
#
# 🔑 Une copie de sauvegarde déposée dans une racine servie EST servie, en
# clair. Le 30/08/2026, `index.php.avant-legi-elargi-20260827` rendait 200 et
# 103 172 octets de PHP sur justice.my-self.fr — la copie faite trois jours plus
# tôt en basculant la base, dans le répertoire que nginx sert.
#
# ⚠️ Les suffixes `.avant-` et `.pre-` sont ceux que NOS procédures produisent.
# La première version de ce fichier ne couvrait que `.bak`, `.old`, `.orig`,
# `.swp`, `.swo` et `.tmp` : elle n'aurait pas attrapé celui-là. Un garde-fou
# calibré sur les conventions des autres laisse passer les siennes.
#
# À inclure dans chaque bloc `server`, pas seulement sur les vhosts qu'on croit
# exposés : le fichier de trop arrive toujours là où on ne l'attendait pas.
location ~* \.(bak|bak[~._0-9-]*|old|orig|swp|swo|tmp)$ {
    deny all;
    return 404;
    access_log off;
    log_not_found off;
}

location ~* \.(avant|pre)-[^/]*$ {
    deny all;
    return 404;
    access_log off;
    log_not_found off;
}

# Manifestes composer (R10-GS-01, pentest round 10).
location ~* /composer\.(json|lock)$ {
    deny all;
    return 404;
    access_log off;
    log_not_found off;
}
