# HSTS pour cet hôte seul : un an, sans `includeSubDomains` ni `preload`.
#
# `includeSubDomains` posé sur le domaine parent engagerait pour un an tout nom
# qu'il couvre, y compris ceux que le DNS résout sans qu'un vhost les serve avec
# un certificat valide. Chaque vhost servi inclut donc ce fragment pour lui-même.
#
# Une fois reçu, un certificat expiré devient pour le visiteur une erreur qu'il ne
# peut plus contourner : cet en-tête repose sur le renouvellement automatique.
add_header Strict-Transport-Security "max-age=31536000" always;
