# Socle + HSTS. Pour un vhost en TLS direct dont tous les sous-domaines ont un
# certificat valide — `includeSubDomains` les engage tous.
include snippets/security-headers-base.conf;

add_header X-XSS-Protection "1; mode=block" always;

# `preload` retiré : il demande l'inscription à la liste préchargée des navigateurs,
# dont la radiation prend des mois. Un engagement de cette portée se prend pour
# lui-même, pas en héritant d'un fragment partagé par cinq vhosts.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
