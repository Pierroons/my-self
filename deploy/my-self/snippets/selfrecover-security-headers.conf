# R10-SR-03 : en-têtes de sécurité pour le front SelfRecover (HSTS + CSP absents avant).
# CSP avec 'unsafe-inline' car le front a des <script>/<style> inline (admin.html, transparency…).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'" always;

# Ajoutés le 17/08/2026 : ce fragment ne servait que HSTS et la CSP, alors que
# les autres vhosts recevaient ces quatre-là par `security-headers.conf`.
# X-Frame-Options fait doublon avec `frame-ancestors 'none'` pour les
# navigateurs récents ; il reste pour les anciens, et ne coûte rien.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
