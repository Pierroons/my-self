# Socle + HSTS + CSP — front SelfRecover (R10-SR-03).
include snippets/security-headers-base.conf;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# 'unsafe-inline' car le front porte des <script>/<style> inline (admin.html,
# transparency…). `frame-ancestors 'none'` double le X-Frame-Options du socle :
# le premier pour les navigateurs récents, le second pour les anciens.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'" always;
