# CSP de la vitrine. Page statique, sans saisie : son script inline (le portrait
# pixelisé) et ses deux gestionnaires de survol passent par 'unsafe-inline'. Le
# reste ferme ce qui compte ici : aucune ressource ni connexion hors de l'origine,
# aucun objet embarqué, aucun encadrement par un autre site.
#
# Une ressource externe ajoutée à la page doit être déclarée ici, sinon elle est
# bloquée.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'" always;
