# CSP de la vitrine. Page statique, sans saisie. Ses scripts sont des fichiers de
# l'origine (`accueil.js`) : un bloc <script> inline ou un attribut d'événement
# (onclick, onmouseover…) ajouté à une page de ce site est bloqué. Les styles
# inline restent admis, la page en porte en attribut. Le reste ferme ce qui compte
# ici : aucune ressource ni connexion hors de l'origine, aucun objet embarqué,
# aucun encadrement par un autre site.
#
# Une ressource externe ajoutée à la page doit être déclarée ici, sinon elle est
# bloquée.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'" always;
