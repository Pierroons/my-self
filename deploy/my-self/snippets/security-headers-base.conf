# En-têtes de sécurité sans effet de bord — socle commun à tous les vhosts.
#
# Aucun des quatre ne peut rendre un site inaccessible : ils ne dépendent ni du
# certificat ni des ressources que la page charge. C'est ce qui permet de les poser
# sur un vhost qui n'a encore rien, avant de décider séparément de HSTS (engagement
# d'un an, `hsts.conf`) et de la CSP (qui dépend des pages servies, un fragment par
# site).
#
# ⚠️ nginx : un `add_header` dans un `location` annule TOUS les `add_header` du
# `server`. Un vhost qui pose un en-tête dans un `location` perd ces quatre-là pour
# ce chemin, et doit réinclure ce fragment sur place.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
