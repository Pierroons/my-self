# CSP de la démo SelfDataGuard. Ses scripts sont des fichiers (`app.js`,
# `coffre.js`) : aucun script inline n'est permis. Les styles inline le sont,
# `coffre.html` en porte. Les appels vont à `api/`, sur la même origine.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'" always;
