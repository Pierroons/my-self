; Le groupe d'ouvriers PHP **principal** du serveur — à poser dans
; /etc/php/8.4/fpm/pool.d/www.conf. `644 root:root`.
;
; 🔑 **Pourquoi ce gabarit existe.** Jusqu'au 21/11/2026, ce fichier vivait
; uniquement sur la machine : 22 Ko hors du dépôt, alors que la cinquième règle
; de l'`AGENTS.md` demande que « le dépôt et l'instance disent la même chose,
; dans les deux sens ». Rien n'aurait signalé sa dérive, et c'est lui qui porte
; les variables d'environnement de TOUT ce que la machine sert en PHP.
;
; ⚠️ **Il ne reprend pas les ~400 lignes de commentaires du paquet Debian** :
; seulement les directives ACTIVES, plus celles dont le défaut compte
; (ci-dessous). Le fichier du paquet reste la référence pour le reste.
;
; Écart mesuré : `deploy/my-self/tests/ecart-pool-php.sh`.

[www]

user = www-data
group = www-data

listen = /run/php/php8.4-fpm.sock
listen.owner = www-data
listen.group = www-data

; ⚠️ **Ce groupe est le SEUL de la machine**, et il sert huit vhosts (mesuré le
; 20/11/2026 par la conv MCP, en suivant les liens de `sites-enabled/`). Donc
; `pm.max_children` est le plafond de requêtes PHP simultanées du serveur
; ENTIER, pas d'un site.
;
; 🔑 **Ce que 12 mesure, et pourquoi pas plus.** Ce qui dimensionne n'est pas le
; poids d'un ouvrier au repos mais son **pic** : une ouverture d'enveloppe
; SelfDataGuard fait allouer son `memlimit` par libsodium, **en dehors** du
; `memory_limit` de PHP. Et une enveloppe porte SON profil, donc un lecteur paie
; ce que son auteur a choisi, jusqu'au plafond que la bibliothèque accepte en
; relecture — `PROFILE_CEILING_MEMLIMIT` de `Primitives.php`. La mémoire est
; rendue aussitôt la dérivation finie : seuls les ouvriers qui dérivent AU MÊME
; INSTANT la paient.
;
; Mesuré le 21/11/2026 : un ouvrier au repos 27 Mio (médiane des processus
; servis), son pic en relecture au plafond 283 Mio, la machine 5 664 Mio
; disponibles — à 70 % de quoi le budget tient **14** ouvriers. 12 est retenu
; pour garder de la marge quand la machine se charge : au plafond exact, le
; contrôle rougirait au premier mébioctet perdu, et deux lectures à dix minutes
; d'écart ont déjà rendu 14 puis 13. 12 est aussi ce que `nproc` rend sur cette
; machine, donc douze dérivations simultanées ne se disputent pas un cœur.
;
; La mesure se rejoue — elle n'est pas à recopier :
;   POOL_SSH_HOST=<alias> bash deploy/my-self/tests/pic-ouvrier-php.sh
;
; ⚠️ Ce chiffre borne la MÉMOIRE, pas la durée. La durée est bornée par
; `request_terminate_timeout`, posé dans ce fichier. Sans lui, ce plafond ne
; limite pas le temps qu'un script peut retenir un ouvrier : il dit seulement
; combien il y en a à perdre.
;
; ⚠️ **Au 21/11/2026, l'instance sert encore 5** — la valeur par défaut du
; paquet, jamais relevée, et ce gabarit n'est pas posé.
; `deploy/my-self/tests/ecart-pool-php.sh`
; signalera donc cette ligne comme « dans le gabarit mais PAS servi » : c'est le
; signal qu'il reste un geste à faire, pas un défaut du gabarit.
pm = dynamic
pm.max_children = 12

; Ces trois-là ne bornent rien : ils disent combien d'ouvriers attendent sans
; travail. Laissés aux valeurs servies — créer un ouvrier de plus coûte quelques
; millisecondes.
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; ── Les variables d'environnement ───────────────────────────────────────────
;
; 🔴 **Un groupe d'ouvriers partage ses ouvriers ET ses secrets** : toute
; application PHP servie par ce groupe lit ces valeurs par `getenv()`. Une
; faille dans n'importe lequel des huit vhosts les expose toutes. C'est la
; raison pour laquelle une route exposée mérite son propre groupe — voir
; `deploy/bi-self/php-fpm-flux.conf`, qui n'en porte aucune.
;
; ⚠️ **Les valeurs sont des gabarits, à substituer à la pose.** Aucune ne doit
; être écrite ici : ce dépôt est public.
;
; 🔑 **Le code de la démonstration lit `SESSIONS_DIR`, `COOKIE_DOMAIN` et
; `COOKIE_INSECURE`, qui ne sont pas déclarées ici.** Trois autres variables
; `SELFRECOVER_*` l'ont été longtemps sans que rien ne les lise.
;
; **Avant d'en ajouter une, la chercher HORS du dépôt** : sur l'instance,
; `grep -rl <nom>` sur `/var/www`, `/usr/local/bin`, `/usr/local/sbin` et
; `/etc/nginx`. ⚠️ Une recherche rend une liste, jamais une absence : qualifier
; tout zéro par un témoin, c'est-à-dire par le même motif sur une variable
; réellement lue — `SELFRECOVER_SESSIONS_DIR` en rendait un le 23/11/2026.
env[SELFJUSTICE_JUDILIBRE_KEY] = "<cle d-API du portail amont>"

; 🔴 **Sans cette ligne, un ouvrier se perd.** Le défaut de
; `request_terminate_timeout` est **0** : aucune limite, donc un script qui
; boucle retient son ouvrier jusqu'au rechargement du groupe. Et
; `fastcgi_read_timeout`, côté serveur web, n'y suffit pas : il ferme la
; connexion sans arrêter le script — **le client part, l'ouvrier reste.**
;
; 🔑 **65 s, et pas davantage** : nginx rend un 504 au bout de 60 s par défaut,
; donc au-delà le script ne sert plus personne. Descendre plus bas se discute,
; mais couperait des requêtes que le serveur web, lui, attend encore.
;
; ⚠️ **L'ORDRE DE POSE COMPTE.** Une seule route servie par cette socket porte un
; `fastcgi_read_timeout` plus long que le défaut de nginx : le flux de
; `bi-self`. Elle part dans `deploy/bi-self/php-fpm-flux.conf`, dont le
; `request_terminate_timeout` est accordé à ce flux. **Poser ce fichier-ci AVANT
; ce groupe dédié couperait le flux de démonstration.** La mesure se rejoue —
; `grep -rn fastcgi_read_timeout --dereference-recursive` sur `sites-enabled`,
; les liens étant à suivre sans quoi le compte rend zéro.
request_terminate_timeout = 65s

; ── Ce qui est laissé au défaut, et dont le défaut compte ────────────────────
;
; `clear_env` → défaut **yes** : l'environnement des ouvriers est vidé avant
;   que les `env[...]` ci-dessus soient posés. C'est ce qui empêche une variable
;   du système d'atteindre PHP par accident. Ne pas passer à `no`.
;
; `security.limit_extensions` → défaut **.php** : seul un `.php` est exécuté.
;
; Aucun `php_admin_value[...]` n'est actif : tout le durcissement PHP de cette
; machine vient de son `php.ini`, pas de ce groupe. Un groupe neuf hérite donc
; du même `php.ini`, et n'a rien à reporter de ce fichier-ci.
