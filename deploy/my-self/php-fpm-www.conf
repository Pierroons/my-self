; Le groupe d'ouvriers PHP **principal** du serveur — à poser dans
; /etc/php/8.4/fpm/pool.d/www.conf. `644 root:root`.
;
; 🔑 **Pourquoi ce gabarit existe.** Jusqu'au 21/11/2026, ce fichier vivait
; uniquement sur la machine : 22 Ko hors du dépôt, alors que la cinquième règle
; de l'`AGENTS.md` demande que « le dépôt et l'instance disent la même chose,
; dans les deux sens ». Rien n'aurait signalé sa dérive, et c'est lui qui porte
; les variables d'environnement de TOUT ce que la machine sert en PHP.
;
; ⚠️ **Il ne reprend pas les ~400 lignes de commentaires du paquet Debian** :
; seulement les directives ACTIVES, plus celles dont le défaut compte
; (ci-dessous). Le fichier du paquet reste la référence pour le reste.
;
; Écart mesuré : `deploy/my-self/tests/ecart-pool-php.sh`.

[www]

user = www-data
group = www-data

listen = /run/php/php8.4-fpm.sock
listen.owner = www-data
listen.group = www-data
; Posé explicitement depuis le découpage : les quatre autres groupes tournent
; sous une autre identité, et `0660` avec ce propriétaire ferme chaque socket
; à tout ce qui n'est pas nginx — les autres groupes d'ouvriers compris.
listen.mode = 0660

; ⚠️ **Ce groupe n'est plus celui de toute la machine : il est le RÉSIDUEL.**
; Depuis le découpage du 24/11/2026, bi-self, SelfDataGuard et SelfJustice ont
; chacun le leur, sous leur propre identité. Restent ici les vhosts qui ne
; portent aucun état sensible mesuré — le vhost par défaut et deux sites
; secondaires — et, tant qu'ils ne sont pas entrés dans ce dépôt, les sept
; directives `fastcgi_pass` servies qu'aucun gabarit versionné ne porte
; (18 mesurées sur la machine contre 11 ici, le 24/11/2026).
;
; 🔴 **L'ORDRE DE POSE N'EST PAS INDIFFÉRENT, et c'est ce fichier qui le dit.**
; Le plafond ci-dessous est descendu parce que ce groupe ne sert plus que trois
; sites. Posé AVANT que les vhosts soient redirigés vers leurs nouvelles
; sockets, il laisserait les huit se partager ce plafond réduit — une
; dégradation franche, et sur la production. Ce fichier se pose donc en
; DERNIER : les quatre autres groupes, puis les vhosts, puis celui-ci.
; `deploy/my-self/README.md` porte l'ordre complet.
;
; 🔑 **Ce qui dimensionne n'est pas le poids d'un ouvrier au repos mais son
; pic.** Une ouverture d'enveloppe SelfDataGuard fait allouer son `memlimit` par
; libsodium, **en dehors** du `memory_limit` de PHP. Et une enveloppe porte SON
; profil, donc un lecteur paie ce que son auteur a choisi, jusqu'au plafond que
; la bibliothèque accepte en relecture — `PROFILE_CEILING_MEMLIMIT` de
; `Primitives.php`. La mémoire est rendue aussitôt la dérivation finie : seuls
; les ouvriers qui dérivent AU MÊME INSTANT la paient.
;
; 🔑 **Et c'est le découpage qui a changé ce calcul, bien plus que les chiffres.**
; Tant qu'un seul groupe servait les huit vhosts, **chacun** de ses ouvriers
; pouvait relire une enveloppe au plafond : le pire cas était le plafond
; multiplié par le nombre total d'ouvriers. Mesuré le 24/11/2026 par
; `pic-ouvrier-php.sh` : 12 ouvriers × 285 Mio = **3 420 Mio**, pour un budget
; de 3 885 Mio. On vivait à 88 % du budget.
;
; Depuis le découpage, **seul le groupe `dataguard` peut atteindre ce pic** : lui
; seul relit des enveloppes. Ce groupe-ci ne dérive rien du tout — son pic est
; son repos. D'où le marqueur ci-dessous, que `pic-ouvrier-php.sh` lit pour
; appliquer à chaque groupe le profil qui est le sien au lieu du pire de tous.
;
; @pic: aucun
;
; **CINQ**, et le chiffre suit la charge réelle : ce groupe ne sert plus que
; trois vhosts du dépôt, plus les sept directives servies qu'aucun gabarit ne
; porte encore. Cinq ouvriers à 29 Mio (mesuré le 24/11/2026) coûtent 145 Mio au
; pire. ⚠️ **L'instance servait 5** avant le découpage — la valeur par défaut du
; paquet, jamais relevée : ce gabarit ne descend donc rien, il aligne enfin le
; gabarit sur ce qui tourne.
;
; La mesure se rejoue — elle n'est pas à recopier :
;   POOL_SSH_HOST=<alias> bash deploy/my-self/tests/pic-ouvrier-php.sh
;
; ⚠️ Ce chiffre borne la MÉMOIRE, pas la durée. La durée est bornée par
; `request_terminate_timeout`, posé dans ce fichier. Sans lui, ce plafond ne
; limite pas le temps qu'un script peut retenir un ouvrier : il dit seulement
; combien il y en a à perdre.
;
; 🔑 **À LA DEMANDE depuis le découpage.** Les trois vhosts qui restent ici ne
; reçoivent pas de trafic continu : aucun ouvrier n'a de raison d'attendre en
; mémoire. En `ondemand`, ce groupe ne coûte rien au repos, et `pm.start_servers`
; / `pm.min_spare_servers` / `pm.max_spare_servers` n'ont plus de sens — ils sont
; retirés plutôt que laissés inertes, pour qu'on ne les relise pas comme un
; réglage actif.
pm = ondemand
pm.max_children = 5

; ── Les variables d'environnement : AUCUNE, et c'est le but ────────────────
;
; 🔴 **Un groupe d'ouvriers partage ses ouvriers ET ses secrets** : toute
; application PHP servie par un groupe lit ses valeurs par `getenv()`. C'est la
; raison même du découpage du 24/11/2026 : la seule variable que ce groupe
; portait était la clé d'API du portail de jurisprudence amont, lisible depuis
; les huit vhosts alors qu'elle ne sert qu'à SelfJustice. Elle est partie dans
; `deploy/selfjustice/php-fpm-justice.conf`, avec les routes qui l'emploient.
;
; 🔑 **Ce groupe ne doit plus JAMAIS en porter**, et ce n'est pas une
; précaution : il est devenu le résiduel, celui qui sert les vhosts sans état
; propre et tout ce qui n'a pas encore été rangé. Lui confier un secret, c'est
; le confier au plus large périmètre de la machine. Une variable neuve va dans
; le groupe du site qui la lit, ou dans un groupe neuf.
;
; ⚠️ **Si une valeur doit malgré tout atterrir ici**, deux règles tiennent :
; elle reste un gabarit — ce dépôt est public — et elle se cherche d'abord HORS
; du dépôt, sur l'instance : `grep -rl <nom>` sur `/var/www`, `/usr/local/bin`,
; `/usr/local/sbin` et `/etc/nginx`. ⚠️ Une recherche rend une liste, jamais une
; absence : qualifier tout zéro par un témoin, c'est-à-dire par le même motif
; sur une variable réellement lue — `SELFRECOVER_SESSIONS_DIR` en rendait un le
; 23/11/2026.

; 🔴 **Sans cette ligne, un ouvrier se perd.** Le défaut de
; `request_terminate_timeout` est **0** : aucune limite, donc un script qui
; boucle retient son ouvrier jusqu'au rechargement du groupe. Et
; `fastcgi_read_timeout`, côté serveur web, n'y suffit pas : il ferme la
; connexion sans arrêter le script — **le client part, l'ouvrier reste.**
;
; 🔑 **65 s borne le script qui SE TAIT, et c'est le seul qu'il borne.**
; `fastcgi_read_timeout` ne mesure pas la durée d'une réponse : il mesure le
; SILENCE entre deux lectures. Un script qui boucle sans rien envoyer est donc
; abandonné par nginx au bout de 60 s, et 65 s l'arrête juste après — c'est le
; cas visé. Mais un script qui diffuse par morceaux reste servi indéfiniment
; tant qu'il parle toutes les 60 s : celui-là, 65 s le COUPERAIT en pleine
; réponse. ⓘ Relevé en relecture le 24/11/2026 ; la version d'avant disait
; « nginx rend un 504 au bout de 60 s, donc au-delà le script ne sert plus
; personne », ce qui est faux pour cette seconde famille.
;
; ✅ **Aucun script de ce groupe n'est dans ce cas, et c'est mesuré** (24/11/2026,
; en lecture sur l'instance) : `grep -rlE 'text/event-stream|ignore_user_abort|
; set_time_limit' --include=*.php` sur l'arbre servi rend **un seul fichier**,
; `events.php`, qui part au groupe dédié du flux. ⚠️ Les trois motifs sont une
; approche, pas une preuve d'exhaustivité : un script peut diffuser sans aucun
; d'eux. **Cette recherche se refait avant d'ajouter un script qui diffuse** —
; même geste que pour les variables d'environnement, et pour la même raison.
;
; ⚠️ **L'ORDRE DE POSE COMPTE.** Une seule route servie par cette socket porte un
; `fastcgi_read_timeout` plus long que le défaut de nginx : le flux de
; `bi-self`. Elle part dans `deploy/bi-self/php-fpm-flux.conf`, dont le
; `request_terminate_timeout` est accordé à ce flux. **Poser ce fichier-ci AVANT
; ce groupe dédié couperait le flux de démonstration.** La mesure se rejoue —
; `grep -Rn fastcgi_read_timeout` sur `sites-enabled`, car **`-R` suit les liens
; et `-r` ne les suit pas** : ce répertoire n'est qu'un dossier de liens, donc
; `-r` y rend zéro. ⓘ L'option longue `--dereference-recursive` dit la même
; chose que `-R`, mais écrit à côté d'un `-r` elle l'écrase — deux options qui
; se contredisent dans une commande qu'on recopie sans la relire.
request_terminate_timeout = 65s

; ── Ce qui est laissé au défaut, et dont le défaut compte ────────────────────
;
; `clear_env` → défaut **yes** : l'environnement des ouvriers est vidé avant
;   que les `env[...]` ci-dessus soient posés. C'est ce qui empêche une variable
;   du système d'atteindre PHP par accident. Ne pas passer à `no`.
;
; `security.limit_extensions` → défaut **.php** : seul un `.php` est exécuté.
;
; Aucun `php_admin_value[...]` n'est actif : tout le durcissement PHP de cette
; machine vient de son `php.ini`, pas de ce groupe. Un groupe neuf hérite donc
; du même `php.ini`, et n'a rien à reporter de ce fichier-ci.
