# Prod example.org — ecoute le 443 de la machine en direct.
# N'écoute que sur 8443 ; le lab myself.test reste sur 443 pour les tests locaux.
server {
    include snippets/deny-bakfiles.conf;
    listen 443 ssl;  # direct — separation du .60, 14/09/2026
    server_name example.org www.example.org;

    # vraie IP client transmise par le frontal .60

    ssl_certificate     /etc/ssl/example.org/fullchain.pem;
    ssl_certificate_key /etc/ssl/example.org/privkey.pem;

    root  /var/www/myself/web/example.org;
    index index.html;

    location ~ \.(md|sh|ya?ml|toml|lock|sql|ini|bak|example|sample)$ { return 404; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\.(?!well-known) { deny all; }
}
