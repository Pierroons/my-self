# Vitrine example.org — TLS terminé par ce vhost, sur le 443 de la machine.
server {
    include snippets/deny-bakfiles.conf;
    listen 443 ssl;  # TLS terminé ici, en direct
    server_name example.org www.example.org;

    ssl_certificate     /etc/ssl/example.org/fullchain.pem;
    ssl_certificate_key /etc/ssl/example.org/privkey.pem;

    include snippets/security-headers-base.conf;
    include snippets/hsts.conf;
    include snippets/csp-accueil.conf;

    root  /var/www/myself/web/example.org;
    index index.html;

    location ~ \.(md|sh|ya?ml|toml|lock|sql|ini|bak|example|sample)$ { return 404; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\.(?!well-known) { deny all; }
}
