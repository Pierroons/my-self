# Contrôle de structure — ce qu'un déplacement casse.
#
# 🔑 **Pourquoi ce workflow existe.** Le rangement du 17/08/2026 a déplacé plus de
# deux cents fichiers. Rien, dans ce dépôt, ne vérifiait qu'un chemin cité quelque
# part avait encore sa cible : ni le dépôt ni la CI. Les défauts trouvés ce jour-là
# — un script de déploiement qui affichait OK sans rien déployer, une exclusion
# OPSEC devenue orpheline, une règle .gitignore qui avait cessé de protéger une
# base de démonstration et deux artefacts cryptographiques — se ressemblent tous :
# ils ne cassent rien de visible.
#
# Les trois sondes lancées ici sont des **tests de garde-fou**, pas des tests
# fonctionnels. Quand un test fonctionnel échoue, une page blanche finit par
# alerter quelqu'un. Quand un garde-fou lâche, tout continue de fonctionner et
# personne ne le voit — c'est la catégorie qui ne survit pas à l'absence de CI.
name: structure

on:
  push:
    branches: [main, dev, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # SelfDataGuard se déclare compatible PHP 8.1 et plus (composer.json), et ses intégrateurs le
  # font tourner sur ce que leur distribution fournit — Debian 12 livre la 8.2. Le job principal
  # tourne en 8.4 : un écart de comportement de PDO entre versions y passait inaperçu (la 0.5.0
  # ouvrait une transaction en SQL que PDO 8.2 ne voit pas).
  selfdataguard-php-anciens:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Installer PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2 au 19/08/2026
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, pdo_sqlite, mbstring, json
          coverage: none
      - name: SelfDataGuard, couplage et parcours sous PHP ${{ matrix.php }}
        run: |
          php -v | head -1
          rc=0
          # Toutes les suites jouent, même après un échec : un arrêt au premier rouge laisse les
          # suivantes non éprouvées sur cette version, sans que rien ne le dise.
          for t in self-security/selfdataguard/tests/sanity_*.php; do
            echo "→ $(basename "$t")"
            php "$t" || { echo "::error::$(basename "$t") rouge sous PHP ${{ matrix.php }}"; rc=1; }
          done
          php bi-self/selfrecover/tests/sanity_couplage_dataguard.php | grep -qE '^OK — 10/10 ' \
            || { echo "::error::couplage hors 10/10 sous PHP ${{ matrix.php }}"; rc=1; }
          php bi-self/selfrecover/tests/sanity_parcours_dataguard.php | grep -qE '^OK — 21/21$' \
            || { echo "::error::parcours hors 21/21 sous PHP ${{ matrix.php }}"; rc=1; }
          exit $rc

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Installer PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2 au 19/08/2026
        with:
          php-version: '8.4'
          extensions: sodium, pdo_sqlite, mbstring, json
          coverage: none

      # ── Syntaxe ────────────────────────────────────────────────────────────
      - name: Syntaxe PHP, Python et shell
        run: |
          set -e
          for f in $(git ls-files '*.php'); do php -l "$f" > /dev/null; done
          echo "✓ PHP — $(git ls-files '*.php' | wc -l) fichiers"
          for f in $(git ls-files '*.py'); do python3 -m ast "$f" > /dev/null; done
          echo "✓ Python — $(git ls-files '*.py' | wc -l) fichiers"
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
          echo "✓ Shell — $(git ls-files '*.sh' | wc -l) fichiers"

      # ── Chemins ────────────────────────────────────────────────────────────
      # Le contrôle que le rangement a rendu nécessaire : liens Markdown, règles
      # .gitignore et chemins de workflow, confrontés à ce qui existe.
      - name: Le profil de hachage n'est défini qu'une fois
        run: bash scripts/check-profil-unique.sh

      - name: Chemins cités
        run: bash scripts/check-paths.sh

      - name: Canari — les chemins cités en code inline rougissent quand l'un meurt
        run: |
          F=demo/bi-self-duo/CONTRIBUTING.md
          cp "$F" /tmp/CB.intact
          printf '\nCopier `deploy/bi-self/inexistant-canari.conf`.\n' >> "$F"
          if bash scripts/check-paths.sh >/dev/null 2>&1; then
            cp /tmp/CB.intact "$F"
            echo "::error::le contrôle reste VERT sur un chemin mort en code inline"
            exit 1
          fi
          cp /tmp/CB.intact "$F"
          cmp -s /tmp/CB.intact "$F" \
            || { echo "::error::le fichier n'a pas été restauré à l'identique"; exit 1; }
          echo "✓ le contrôle rougit sur un chemin mort en code inline, et le fichier est restauré"

      - name: Canari — les chemins cités dans un bloc de code rougissent quand l'un meurt
        run: |
          F=demo/bi-self-duo/CONTRIBUTING.md
          cp "$F" /tmp/CB.intact
          printf '\n```bash\ncd bi-self/inexistant-canari\n```\n' >> "$F"
          if bash scripts/check-paths.sh >/dev/null 2>&1; then
            cp /tmp/CB.intact "$F"
            echo "::error::le contrôle reste VERT sur un chemin mort dans un bloc de code"
            exit 1
          fi
          cp /tmp/CB.intact "$F"
          cmp -s /tmp/CB.intact "$F" \
            || { echo "::error::le fichier n'a pas été restauré à l'identique"; exit 1; }
          echo "✓ le contrôle rougit sur un chemin mort dans un bloc de code, et le fichier est restauré"

      # ── Versions ───────────────────────────────────────────────────────────
      # modules.json est la source unique ; chaque porteur qu'il déclare doit la
      # répéter. Le tag manquant se suit à part, dans suivi.yml : il dépend d'un
      # geste de Pierroons et ne doit pas bloquer l'envoi d'un autre module.
      - name: Versions — chaque porteur dit la version de modules.json
        run: bash scripts/check-versions.sh

      - name: Canari — le contrôle des versions rougit sur un porteur décalé et sur un tag absent
        run: |
          F=bi-self/selfmoderate/README.md
          cp "$F" /tmp/SM.intact
          sed -i -E 's#(badge/status-v)[0-9]+\.[0-9]+\.[0-9]+#\10.0.0#' "$F"
          grep -q 'badge/status-v0.0.0' "$F" \
            || { cp /tmp/SM.intact "$F"; echo "::error::la plantation n'a pas pris — le canari ne prouve rien"; exit 1; }
          if bash scripts/check-versions.sh >/dev/null 2>&1; then
            cp /tmp/SM.intact "$F"
            echo "::error::le contrôle reste VERT avec un badge décalé — il ne mesure pas ce qu'il annonce"
            exit 1
          fi
          cp /tmp/SM.intact "$F"
          cmp -s /tmp/SM.intact "$F" \
            || { echo "::error::le fichier n'a pas été restauré à l'identique"; exit 1; }
          echo "✓ le contrôle rougit sur un porteur décalé, et le fichier est restauré"
          # Le texte alternatif d'un badge qui ne nomme pas son module, dans le README de ce module.
          F=bi-self/selfrecover/README.md
          cp "$F" /tmp/SR.intact
          sed -i -E 's#^\[!\[Status: v[0-9]+\.[0-9]+\.[0-9]+\]#[![Status: v0.0.0]#' "$F"
          grep -q '^\[!\[Status: v0.0.0\]' "$F" \
            || { cp /tmp/SR.intact "$F"; echo "::error::la plantation du texte alternatif n'a pas pris"; exit 1; }
          if bash scripts/check-versions.sh >/dev/null 2>&1; then
            cp /tmp/SR.intact "$F"
            echo "::error::le contrôle reste VERT avec un texte alternatif de badge décalé"
            exit 1
          fi
          cp /tmp/SR.intact "$F"
          cmp -s /tmp/SR.intact "$F" \
            || { echo "::error::le README de SelfRecover n'a pas été restauré à l'identique"; exit 1; }
          echo "✓ le contrôle rougit sur le texte alternatif d'un badge, et le fichier est restauré"
          # Le statut, dans les deux sens : un module déclaré bêta dont la ligne ne le dit plus,
          # un module non déclaré que sa ligne dit bêta.
          F=README.fr.md
          cp "$F" /tmp/RF.intact
          for plantation in \
            's#(\[SelfAct\]\(\./self-right/selfact/\).*\*\*v[0-9.]+) bêta\*\*#\1**#' \
            's#(\[SelfRecover\]\(\./bi-self/selfrecover/\).*\*\*v[0-9.]+)\*\*#\1 bêta**#'; do
            sed -i -E "$plantation" "$F"
            cmp -s /tmp/RF.intact "$F" \
              && { echo "::error::la plantation « $plantation » n'a pas pris — le canari ne prouve rien"; exit 1; }
            if bash scripts/check-versions.sh >/dev/null 2>&1; then
              cp /tmp/RF.intact "$F"
              echo "::error::le contrôle reste VERT après « $plantation »"
              exit 1
            fi
            cp /tmp/RF.intact "$F"
          done
          cmp -s /tmp/RF.intact "$F" \
            || { echo "::error::README.fr.md n'a pas été restauré à l'identique"; exit 1; }
          echo "✓ le contrôle rougit sur un statut déclaré que la ligne tait, et sur un statut qu'elle invente"
          # Mode --tags : une version qu'aucun tag ne porte, avec un délai nul, doit rougir.
          cp modules.json /tmp/MJ.intact
          python3 -c "import json;d=json.load(open('modules.json'));[m.update(version='9.9.9') for m in d['modules'] if m['id']=='selfmoderate'];json.dump(d,open('modules.json','w'),ensure_ascii=False,indent=2)"
          if VERSIONS_DELAI_JOURS=0 bash scripts/check-versions.sh --tags >/dev/null 2>&1; then
            cp /tmp/MJ.intact modules.json
            echo "::error::le mode --tags reste VERT sur une version sans tag"
            exit 1
          fi
          cp /tmp/MJ.intact modules.json
          cmp -s /tmp/MJ.intact modules.json \
            || { echo "::error::modules.json n'a pas été restauré à l'identique"; exit 1; }
          echo "✓ le mode --tags rougit sur une version sans tag, et modules.json est restauré"

      - name: Canari — le contrôle d'écosystème rougit quand selffarm-lite avance
        run: |
          # Deux dérives, à partir du vrai manifeste : une version qui avance, un module
          # qui disparaît. Le code attendu est 1 (dérive), pas 2 (panne) : un manifeste
          # injoignable ferait sinon passer le canari sans rien éprouver.
          curl -fsSL --retry 3 https://raw.githubusercontent.com/Pierroons/selffarm-lite/main/modules.json > /tmp/sfl.json
          python3 -c "import json;d=json.load(open('/tmp/sfl.json'));d['depot']['version']='9.9.9';json.dump(d,open('/tmp/sfl-version.json','w'))"
          python3 -c "import json;d=json.load(open('/tmp/sfl.json'));d['modules']=d['modules'][1:];json.dump(d,open('/tmp/sfl-module.json','w'))"
          cp README.md /tmp/RM.intact && cp README.fr.md /tmp/RF.intact && cp web/my-self.fr/index.html /tmp/IX.intact
          for cas in version module; do
            rc=0; SELFFARM_MANIFESTE_URL="file:///tmp/sfl-$cas.json" bash scripts/check-ecosysteme.sh >/dev/null 2>&1 || rc=$?
            [ "$rc" -eq 1 ] || { echo "::error::cas « $cas » : code $rc, 1 attendu — le contrôle ne voit pas la dérive"; exit 1; }
          done
          # Comparaison aux copies d'avant, et non à HEAD : un fichier modifié et non
          # commité ferait rougir `git diff` sans que le contrôle y soit pour rien.
          cmp -s /tmp/RM.intact README.md && cmp -s /tmp/RF.intact README.fr.md && cmp -s /tmp/IX.intact web/my-self.fr/index.html \
            || { echo "::error::le contrôle a modifié un bloc sans --ecrire"; exit 1; }
          echo "✓ le contrôle rougit sur une version voisine et sur un module retiré, sans rien modifier"

      # ── Vitrine ────────────────────────────────────────────────────────────
      # Les deux pages servies par my-self.fr, contre les préréglages recommended et
      # a11y de html-validate (.htmlvalidate.json). Version épinglée : une version
      # flottante changerait les règles sans qu'aucun commit le dise.
      - name: Vitrine — les pages de my-self.fr sont du HTML valide et accessible
        run: npx --yes html-validate@9.7.1 --config .htmlvalidate.json web/my-self.fr/index.html web/my-self.fr/pentest.html

      - name: Canari — le validateur rougit sur un style en ligne, un id en double, un titre sauté
        run: |
          F=web/my-self.fr/index.html
          cp "$F" /tmp/VX.intact
          for cas in style id titre; do
            cp /tmp/VX.intact "$F"
            case $cas in
              style) sed -i 's#<h1 class="visually-hidden">#<h1 class="visually-hidden" style="color:red">#' "$F" ;;
              id)    sed -i 's#<section class="support">#<section class="support" id="descartes-pixel">#' "$F" ;;
              titre) sed -i 's#<h2>Reprendre la main</h2>#<h4>Reprendre la main</h4>#' "$F" ;;
            esac
            if cmp -s /tmp/VX.intact "$F"; then
              echo "::error::cas « $cas » : la plantation n'a pas pris — le canari ne prouve rien"; exit 1
            fi
            if npx --yes html-validate@9.7.1 --config .htmlvalidate.json "$F" >/dev/null 2>&1; then
              cp /tmp/VX.intact "$F"
              echo "::error::cas « $cas » : le validateur reste VERT"; exit 1
            fi
          done
          cp /tmp/VX.intact "$F"
          cmp -s /tmp/VX.intact "$F" \
            || { echo "::error::$F n'a pas été restauré à l'identique"; exit 1; }
          echo "✓ le validateur rougit sur un style en ligne, un id en double et un titre sauté, et la page est restaurée"

      # ── Garde-fous ─────────────────────────────────────────────────────────
      # Priorité sur le reste : ce sont eux qui échouent en silence.
      - name: Garde-fou — socle SelfRecover (profil de hachage, encodage, diceware)
        run: php bi-self/selfrecover/tests/sanity_socle.php

      - name: Garde-fou — les appelants passent ce que la bibliothèque exige
        run: |
          # PHP ne compte les arguments qu'à l'exécution : un constructeur qui
          # gagne un paramètre obligatoire laisse tous ses appelants passer
          # `php -l` et lever à la première requête. C'est arrivé aux deux seules
          # routes de récupération de la démo publique, restées à 2 arguments.
          php bi-self/selfrecover/tests/sanity_constructions.php

      - name: Canari — le contrôle rougit sur un appel incomplet
        run: |
          PLANTE=$(mktemp -d)
          mkdir -p "$PLANTE/demo"
          cp demo/bi-self-duo/api/recover/recover-l1.php "$PLANTE/demo/"
          PLANTE="$PLANTE" python3 - <<'PY'
          import pathlib, os
          p = pathlib.Path(os.environ['PLANTE']) / 'demo/recover-l1.php'
          t = p.read_text(encoding='utf-8')
          bon = '$recovery = RecoverHelper::protocole($s);'
          assert t.count(bon) == 1, 'la plantation n\'a pas pris — ce canari ne prouve rien'
          p.write_text(t.replace(bon, '$recovery = new Pierroons\\SelfRecover\\Recovery\\Recovery($a, $b);'), encoding='utf-8')
          PY
          if sortie=$(SR_APPELANTS="$PLANTE" php bi-self/selfrecover/tests/sanity_constructions.php 2>&1); then
            echo "$sortie"
            echo "::error::le contrôle reste VERT sur une construction à 2 arguments"
            exit 1
          fi
          echo "$sortie"
          echo "$sortie" | grep -q 'Recovery reçoit 2 argument(s), 3 requis' \
            || { echo "::error::rouge, mais pas sur le cas attendu"; exit 1; }

      - name: Garde-fou — un secret rendu s'accompagne de sa consigne
        run: |
          # Une perte silencieuse est pire qu'une panne : la personne range son
          # papier et découvre des mois plus tard, au moment où elle en a besoin,
          # qu'il ne vaut plus rien. Rien n'échoue, rien ne se journalise.
          php bi-self/selfrecover/tests/sanity_annonce_secrets.php

      - name: Canari — le contrôle rougit si un message tait ce qu'il remplace
        run: |
          # Le défaut d'origine replanté : un message qui nomme ce qui SURVIT et
          # tait ce qui MEURT.
          # Jamais un chemin fixe : au second passage, cp copierait DANS le dossier
          # existant et la plantation porterait sur un source déjà planté.
          PLANTE=$(mktemp -d)
          cp -r bi-self/selfrecover/src "$PLANTE/src"
          PLANTE="$PLANTE" python3 - <<'PY'
          import pathlib, os
          p = pathlib.Path(os.environ['PLANTE']) / 'src/Recovery/Recovery.php'
          t = p.read_text(encoding='utf-8')
          m = 'note-les, les anciens ne valent plus rien et ceux-ci ne seront pas réaffichés. '
          assert t.count(m) == 2, 'la plantation n\'a pas pris — ce canari ne prouve rien'
          p.write_text(t.replace(m, ''), encoding='utf-8')
          PY
          if sortie=$(SR_SRC="$PLANTE/src" php bi-self/selfrecover/tests/sanity_annonce_secrets.php 2>&1); then
            echo "$sortie"
            echo "::error::le contrôle reste VERT alors que deux messages taisent le remplacement"
            exit 1
          fi
          echo "$sortie"
          echo "$sortie" | grep -q 'Recovery/Recovery.php.*sans dire de le noter' \
            || { echo "::error::rouge, mais pas sur le cas attendu"; exit 1; }

      - name: Garde-fou — facteur « cet appareil » (dont la prise de compte du 02/08)
        run: |
          sortie=$(php bi-self/selfrecover/tests/sanity_device.php 2>&1) && rc=0 || rc=$?
          echo "$sortie"
          [ "$rc" = 0 ] || { echo "::error::le banc du facteur « cet appareil » a échoué"; exit 1; }
          echo "$sortie" | grep -qE '^OK — 27/27$' \
            || { echo "::error::le banc du facteur « cet appareil » n'a pas joué ses 27 cas"; exit 1; }

      # Enrôler ouvre le compte avec le seul mot mémorisé : ce chemin n'avait aucun
      # frein par compte, donc rien sous un profil où l'adresse ne distingue personne.
      - name: Canari — l'enrôlement n'exige plus le titulaire, et ne freine plus par compte
        run: |
          F=bi-self/selfrecover/src/Device/Device.php
          cp "$F" /tmp/Device.intact
          avant=$(md5sum "$F" | cut -d" " -f1)
          python3 - <<'PY'
          chemin = 'bi-self/selfrecover/src/Device/Device.php'
          gardes = [
              ('        if ($titulaire !== Titulaire::AUTHENTIFIE) {', '        if (false) { // exigence débranchée'),
              ('        if ($this->stockage->compterEchecsCompte($etiquette,',
               '        if (false && $this->stockage->compterEchecsCompte($etiquette,'),
          ]
          s = open(chemin, encoding='utf-8').read()
          for avant, apres in gardes:
              assert s.count(avant) == 1, f'motif introuvable : {avant[:40]!r} — ce canari ne prouve rien'
              s = s.replace(avant, apres, 1)
          open(chemin, 'w', encoding='utf-8').write(s)
          PY
          grep -q 'exigence débranchée' "$F" && grep -q 'if (false && $this->stockage' "$F" \
            || { cp /tmp/Device.intact "$F"; echo "::error::la plantation n'a pas pris — ce canari ne prouve rien"; exit 1; }
          php -l "$F" >/dev/null \
            || { cp /tmp/Device.intact "$F"; echo "::error::la version plantée ne compile pas"; exit 1; }
          if sortie=$(php bi-self/selfrecover/tests/sanity_device.php 2>&1); then
            cp /tmp/Device.intact "$F"
            echo "$sortie"; echo "::error::le banc reste VERT sans l'exigence ni le frein"; exit 1
          fi
          cp /tmp/Device.intact "$F"
          # ⚠️ Mesuré contre l'empreinte prise AVANT la plantation. Comparer au témoin
          # qu'on vient de recopier ne peut échouer que si `cp` a échoué.
          [ "$(md5sum "$F" | cut -d" " -f1)" = "$avant" ] \
            || { echo "::error::le fichier n'a pas été restauré à l'identique"; exit 1; }
          echo "$sortie" | grep -q "❌ .*sans titulaire authentifié, l'enrôlement est refusé" \
            || { echo "$sortie"; echo "::error::rouge, mais pas sur le cas de l'exigence"; exit 1; }
          echo "$sortie" | grep -q '❌ .*au sixième essai, même le bon mot est freiné' \
            || { echo "$sortie"; echo "::error::rouge, mais pas sur le cas du frein"; exit 1; }
          echo "✓ le banc rougit, et sur les deux cas — l'exigence et le frein"

      # Le compte est écrit en dur : c'est un inventaire, pas un seuil. Un code de
      # sortie à zéro dit que les cas joués ont réussi, jamais qu'aucun n'a
      # disparu. Ajouter un cas demande donc de monter ce nombre : cette friction
      # est le contrôle.
      - name: Garde-fou — récupération niveaux 1 et 2, dont le frein par compte du niveau 2
        run: |
          # Le banc est lancé sans `set -e` sur l'affectation : sinon l'étape meurt
          # avant le contrôle du compte, là où il serait le plus utile — un cas
          # manquant sur les cinquante-huit.
          #
          # 🔑 Les DEUX profils, dans la même étape. Le corps du banc est le même :
          # seule l'origine change, absente en tor-onion. Un comportement qui ne
          # tiendrait que d'un côté se verrait ici, et le frein par compte est
          # précisément ce qui doit tenir des deux.
          for profil in clearweb tor-onion; do
            sortie=$(php bi-self/selfrecover/tests/sanity_recovery.php --profil="$profil" 2>&1) && rc=0 || rc=$?
            echo "$sortie"
            [ "$rc" = 0 ] || { echo "::error::le banc de récupération a échoué sous $profil"; exit 1; }
            echo "$sortie" | grep -qE '^OK — 61/61$' \
              || { echo "::error::le banc de récupération n'a pas joué ses 61 cas sous $profil"; exit 1; }
          done

      # La route du sel du niveau 2 est publique : elle doit rendre un sel pour tout
      # code. Le canari la fait répondre « rien » à un code inconnu, l'oracle que la
      # garde ferme ; le banc doit rougir sur ce cas-là.
      - name: Garde-fou — la route du sel rend toujours un sel
        run: |
          sortie=$(php bi-self/selfrecover/tests/sanity_sel_derivation.php 2>&1) && rc=0 || rc=$?
          echo "$sortie"
          [ "$rc" = 0 ] || { echo "::error::le banc de la route du sel a échoué"; exit 1; }
          echo "$sortie" | grep -qE '^OK — 10/10$' \
            || { echo "::error::le banc de la route du sel n'a pas joué ses 10 cas"; exit 1; }
          F=bi-self/selfrecover/src/Recovery/Recovery.php
          cp "$F" /tmp/recovery.intact; avant=$(md5sum "$F" | cut -d" " -f1)
          python3 -c 'import sys; f,a,b=sys.argv[1:4]; s=open(f).read(); n=s.count(a); sys.exit("motif trouvé %d fois" % n) if n != 1 else open(f,"w").write(s.replace(a,b))' \
            "$F" "return \$vrai !== null && \$vrai !== '' ? \$vrai : \$faux;" "return \$vrai ?? '';" \
            || { echo "::error::canari non planté"; exit 1; }
          if canari=$(php bi-self/selfrecover/tests/sanity_sel_derivation.php 2>&1); then
            cp /tmp/recovery.intact "$F"; echo "::error::le banc reste VERT quand la route répond rien"; exit 1
          fi
          cp /tmp/recovery.intact "$F"
          echo "$canari" | grep -q "❌ .*un code inconnu reçoit un sel de la forme d'un vrai" \
            || { echo "$canari"; echo "::error::rouge, mais pas sur le code inconnu"; exit 1; }
          [ "$(md5sum "$F" | cut -d" " -f1)" = "$avant" ] || { echo "::error::$F non restauré"; exit 1; }
          echo "✓ le banc rougit quand la route du sel cesse de mentir sur un code inconnu"

      # La passphrase qu'un utilisateur apporte, tirée aux dés, au lieu d'en recevoir
      # une du serveur. Le banc se joue sous les deux profils et compte ses cas. Chaque
      # canari retire une garde et exige le rouge sur son cas : le contrôle de liste,
      # le refus sans trace du niveau 1 (sinon n'importe qui chargerait le frein d'un
      # autre), le refus de l'ancienne passphrase à chaque niveau, le plafond d'octets,
      # l'égalité avec le mot de passe au niveau 3, le refus unique de l'ouverture et sa
      # durée, un secret absent des traces d'exception. Celui qui raccourcit le protocole fait passer la plus courte passphrase
      # apportable sous le plancher de scellement de SelfDataGuard, et le couplage doit
      # le voir.
      - name: Garde-fou — la passphrase apportée par l'utilisateur
        run: |
          for profil in clearweb tor-onion; do
            sortie=$(php bi-self/selfrecover/tests/sanity_passphrase_apportee.php --profil="$profil" 2>&1) && rc=0 || rc=$?
            echo "$sortie"
            [ "$rc" = 0 ] || { echo "::error::le banc de la passphrase apportée a échoué sous $profil"; exit 1; }
            echo "$sortie" | grep -qE '^OK — 42/42$' \
              || { echo "::error::le banc de la passphrase apportée n'a pas joué ses 42 cas sous $profil"; exit 1; }
          done
          canari() {  # canari <fichier> <avant> <après> <banc> <ligne rouge attendue>
            F="$1"; cp "$F" /tmp/canari.intact; avant=$(md5sum "$F" | cut -d" " -f1)
            python3 -c 'import sys; f,a,b=sys.argv[1:4]; s=open(f).read(); n=s.count(a); sys.exit("motif trouvé %d fois" % n) if n != 1 else open(f,"w").write(s.replace(a,b))' "$F" "$2" "$3" \
              || { echo "::error::canari non planté dans $F"; exit 1; }
            if sortie=$(php "$4" 2>&1); then
              cp /tmp/canari.intact "$F"; echo "$sortie"
              echo "::error::$4 reste VERT sans la garde"; exit 1
            fi
            cp /tmp/canari.intact "$F"
            echo "$sortie" | grep -qF "$5" || { echo "$sortie"; echo "::error::rouge, mais pas sur « $5 »"; exit 1; }
            [ "$(md5sum "$F" | cut -d" " -f1)" = "$avant" ] || { echo "::error::$F non restauré"; exit 1; }
            echo "✓ $(basename "$4") rougit sur « $5 »"
          }
          R=bi-self/selfrecover/src/Recovery/Recovery.php
          B=bi-self/selfrecover/tests/sanity_passphrase_apportee.php
          canari $R 'if (!Wordlist::inAnyList($mot)) {' 'if (false) {' \
            $B '❌ un mot hors des deux listes est refusé'
          canari $R '        // 🔑 La passphrase apportée est jugée avant les freins, sans trace ni' \
            '        $this->stockage->tracerTentative($nomCompte, false, $ip, $maintenant);' \
            $B '❌ un refus de la passphrase apportée ne charge pas le frein'
          canari $R "if (\$ancienne !== null && Hashing::verify(\$apport, (string) \$ancienne['empreinte_passphrase'])) {" 'if (false) {' \
            $B '❌ niveau 2 : la passphrase remplacée ne revient pas telle quelle'
          canari $R 'public const MOTS_PASSPHRASE = 6;' 'public const MOTS_PASSPHRASE = 4;' \
            bi-self/selfrecover/tests/sanity_couplage_dataguard.php '✗ plus courte passphrase apportable'
          canari $R 'if ($neuve === $ancienne) {' 'if (false) {' \
            $B '❌ apporter celle qui sert est refusé'
          canari $R 'if (strlen($saisie) > self::OCTETS_PASSPHRASE_MAXIMUM) {' 'if (false) {' \
            $B "❌ au-delà du plafond d'octets, la saisie est refusée comme trop longue"
          E=bi-self/selfrecover/src/Recovery/Escalade.php
          canari $E "if (\$ancienne !== null && Hashing::verify(\$jugee['canonique'], (string) \$ancienne['empreinte_passphrase'])) {" 'if (false) {' \
            $B "❌ apporter l'ancienne est refusé"
          canari $E "if (\$jugee['canonique'] === strtolower(Recovery::normaliserPassphrase(\$motDePasse))) {" 'if (false) {' \
            $B '❌ une passphrase égale au mot de passe choisi est refusée'
          # Le refus d'ouverture du niveau 3 est unique : un dossier déjà ouvert qui
          # se nommerait apprendrait à n'importe qui qu'un tiers récupère son compte.
          canari $E '            $this->stockage->compterDemandeurConcurrent($existant->id);' \
            "            return ['ok' => false, 'error' => 'deja_ouvert', 'message' => 'ouvert'];" \
            bi-self/selfrecover/tests/sanity_escalade.php '❌ ⭐ nom inconnu, dossier déjà ouvert, procédure gelée : une seule réponse'
          # Et il prend le même temps : un délai ajouté APRÈS le travail du refus en
          # garderait l'écart, et le chronomètre dirait ce que le message tait.
          canari $E '$reste = $this->delaiRefusUs - intdiv(hrtime(true) - $debut, 1000);' '$reste = $this->delaiRefusUs;' \
            bi-self/selfrecover/tests/sanity_escalade.php '❌ ⭐ nom inconnu, procédure gelée, dossier ouvert : la même durée'
          # Un secret marqué à l'entrée et pas sur le chemin qu'il emprunte ressort
          # en clair un cadre plus bas, dans la trace d'une exception du stockage.
          canari $E 'private function recevable(string $numero, #[\SensitiveParameter] string $sesame,' \
            'private function recevable(string $numero, string $sesame,' \
            $B '❌ niveau 3 : la trace porte le numéro, ni le sésame'

      # Un frein qu'on n'a jamais fait céder ne se distingue pas d'un frein qui
      # n'est relié à rien : les deux laissent le banc vert. Ce canari mesure que
      # celui du niveau 2 est branché, pas seulement écrit.
      - name: Canari — le banc rougit quand le frein du niveau 2 est débranché
        run: |
          F=bi-self/selfrecover/src/Recovery/Recovery.php
          cp "$F" /tmp/Recovery.intact
          avant=$(md5sum "$F" | cut -d" " -f1)
          python3 - <<'PY'
          chemin = 'bi-self/selfrecover/src/Recovery/Recovery.php'
          motif  = '        if ($etiquette !== null) {'
          s = open(chemin, encoding='utf-8').read()
          assert s.count(motif) == 1, 'motif introuvable — ce canari ne prouve rien'
          open(chemin, 'w', encoding='utf-8').write(s.replace(motif, '        if (false) { // débranché', 1))
          PY
          grep -q 'if (false) { // débranché' "$F" \
            || { cp /tmp/Recovery.intact "$F"; echo "::error::la plantation n'a pas pris — ce canari ne prouve rien"; exit 1; }
          php -l "$F" >/dev/null \
            || { cp /tmp/Recovery.intact "$F"; echo "::error::la version plantée ne compile pas — le rouge viendrait de la syntaxe"; exit 1; }
          if sortie=$(php bi-self/selfrecover/tests/sanity_recovery.php 2>&1); then
            cp /tmp/Recovery.intact "$F"
            echo "$sortie"; echo "::error::le banc reste VERT sans le frein du niveau 2"; exit 1
          fi
          cp /tmp/Recovery.intact "$F"
          # ⚠️ Mesuré contre l'empreinte prise AVANT la plantation. Comparer au témoin
          # qu'on vient de recopier ne peut échouer que si `cp` a échoué.
          [ "$(md5sum "$F" | cut -d" " -f1)" = "$avant" ] \
            || { echo "::error::le fichier n'a pas été restauré à l'identique"; exit 1; }
          echo "$sortie" | grep -q '❌ .*au sixième essai, même le bon mot est freiné' \
            || { echo "$sortie"; echo "::error::rouge, mais pas sur le cas du frein"; exit 1; }
          echo "✓ le banc rougit, et sur le cas du frein par compte"

      # Un profil qui ne refuse rien serait une déclaration, pas un garde-fou : le
      # défaut qu'il décrit passerait quand même.
      - name: Canari — le profil de déploiement ne refuse plus rien
        run: |
          F=bi-self/selfrecover/src/ProfilDeploiement.php
          cp "$F" /tmp/Profil.intact
          avant=$(md5sum "$F" | cut -d" " -f1)
          python3 - <<'PY'
          chemin = 'bi-self/selfrecover/src/ProfilDeploiement.php'
          motif  = '    public function verifierOrigine(?string $ip): void\n    {'
          s = open(chemin, encoding='utf-8').read()
          assert s.count(motif) == 1, 'motif introuvable — ce canari ne prouve rien'
          open(chemin, 'w', encoding='utf-8').write(s.replace(motif, motif + '\n        return; // neutralisé', 1))
          PY
          grep -q 'return; // neutralisé' "$F" \
            || { cp /tmp/Profil.intact "$F"; echo "::error::la plantation n'a pas pris — ce canari ne prouve rien"; exit 1; }
          php -l "$F" >/dev/null \
            || { cp /tmp/Profil.intact "$F"; echo "::error::la version plantée ne compile pas"; exit 1; }
          if sortie=$(php bi-self/selfrecover/tests/sanity_recovery.php 2>&1); then
            cp /tmp/Profil.intact "$F"
            echo "$sortie"; echo "::error::le banc reste VERT alors que le profil ne refuse plus rien"; exit 1
          fi
          cp /tmp/Profil.intact "$F"
          # ⚠️ Mesuré contre l'empreinte prise AVANT la plantation. Comparer au témoin
          # qu'on vient de recopier ne peut échouer que si `cp` a échoué.
          [ "$(md5sum "$F" | cut -d" " -f1)" = "$avant" ] \
            || { echo "::error::le fichier n'a pas été restauré à l'identique"; exit 1; }
          echo "$sortie" | grep -q '❌ .*une origine transmise est refusée' \
            || { echo "$sortie"; echo "::error::rouge, mais pas sur le cas du profil"; exit 1; }
          echo "✓ le banc rougit, et sur le cas du profil"

      # Il construit `Recovery` : le constructeur du niveau 2 ne peut pas changer
      # sans qu'un rouge apparaisse ici.
      - name: Garde-fou — le fuzzer du niveau 3
        run: php bi-self/selfrecover/tests/fuzz_escalade.php --tours=500

      # Le contrôle central de ce banc est qu'un refus ne touche pas au compte :
      # le code dont ce niveau est issu supprimait le compte au premier refus,
      # ce qui donnait à un attaquant le moyen de faire effacer un compte qu'il
      # n'arrivait pas à voler.
      - name: Garde-fou — récupération niveau 3, arbitrage et gel de procédure
        run: |
          # ⚠️ Le compte de cas se vérifie, comme pour les deux autres bancs : un
          # banc qui sort en 0 après avoir joué la moitié de ses cas rend le même
          # vert qu'un banc complet. Celui-ci n'avait pas ce contrôle, et c'est le
          # plus fourni des trois.
          sortie=$(php bi-self/selfrecover/tests/sanity_escalade.php)
          echo "$sortie"
          echo "$sortie" | grep -qE '^  Escalade SelfRecover — 129 passés, 0 échoués$' \
            || { echo "::error::le banc de l'escalade n'a pas joué ses 129 cas"; exit 1; }

      # La dérivation du mot mémorisé — les deux sondes des vecteurs figés.
      # Elles existaient depuis le 27/08 sans qu'aucun job ne les lance : les
      # vecteurs étaient figés, et ne gardaient rien. Cinq implémentations
      # pouvaient diverger sans qu'un seul rouge apparaisse.
      - name: Garde-fou — les vecteurs de dérivation, côté PHP
        run: php bi-self/selfrecover/tests/derivation.php

      - name: Garde-fou — les vecteurs de dérivation, sur la bibliothèque livrée
        run: |
          node --version
          node bi-self/selfrecover/tests/derivation.js

      # La KDF du facteur « cet appareil » — les mêmes vecteurs, dans deux
      # langages. Notre implémentation JavaScript face à libsodium en C : elles
      # ne partagent pas une ligne, et c'est ce qui rend le vert probant.
      - name: Garde-fou — les vecteurs de la KDF, côté PHP
        run: php bi-self/selfrecover/tests/argon2.php

      - name: Garde-fou — les vecteurs de la KDF, sur la bibliothèque livrée
        run: |
          sortie=$(node bi-self/selfrecover/tests/argon2.js)
          echo "$sortie"
          # ⚠️ Le banc annonce l'implémentation exercée. Sans ce contrôle, une
          # implémentation absente ou remplacée par un repli le ferait mesurer
          # autre chose que ce que les intégrateurs chargent, en rendant le même vert.
          echo "$sortie" | grep -qE '^▸ implémentation exercée : argon2id\.js \(écrite dans ce dépôt\)$' \
            || { echo "::error::le banc n'a pas exercé argon2id.js"; exit 1; }

      # Une démo qui recopierait la bibliothèque au lieu d'y pointer redeviendrait
      # le duplicata que ce lien existe pour supprimer — et le fichier recopié
      # aurait l'air correct le jour où il est posé.
      - name: Garde-fou — les démos pointent vers la bibliothèque, sans la copier
        run: bash scripts/check-liens-bibliotheque.sh

      # Les gabarits de vhost n'étaient validés par rien : un fichier cassé se
      # découvrait sur la machine, au rechargement. `nginx -t` a besoin du binaire,
      # pas du service — et le test tourne sans privilège, dans un préfixe jetable.
      - name: Installer nginx (pour valider les gabarits de vhost)
        run: |
          # ⚠️ `apt-get update` rend 100 dès qu'UN index est incohérent, y compris
          # celui d'un dépôt tiers préinstallé sur le runner et dont ce dépôt ne
          # dépend pas — vu le 09/09/2026 sur celui de Chrome. Le message d'apt le
          # dit lui-même : « They have been ignored, or old ones used instead ».
          # L'étape mourait alors, et les trente contrôles suivants passaient en
          # `skipped` : une panne amont éteignait la CI sans que rien ne le nomme.
          # C'est l'installation qui porte la propriété qu'on veut, pas la
          # fraîcheur de tous les index — elle reste donc bloquante.
          sudo apt-get update -qq || echo "::warning::index apt partiel — l'installation reste bloquante"
          sudo apt-get install -y -qq nginx-light

      - name: Garde-fou — les gabarits de vhost sont syntaxiquement valides
        run: bash scripts/check-vhost.sh

      - name: Garde-fou — la bibliothèque sur le schéma de bi-self-duo
        run: php demo/bi-self-duo/tests/equivalence_selfrecover.php

      # Le schéma d'exemple et l'adaptateur fournis avec le contrat, pour une
      # application qui n'a pas déjà ses tables. Quatrième porteur de
      # `StorageInterface` — après les deux démos et le double en mémoire — et
      # le seul à servir le facteur « cet appareil » sur un schéma qu'on livre.
      - name: Garde-fou — le schéma d'exemple et son adaptateur PDO
        run: |
          # ⚠️ `pipefail` + `tee` plutôt qu'une capture nue : sous `bash -e`,
          # `sortie=$(php …)` tue l'étape AVANT le `echo`, et la CI n'affiche
          # alors aucune ligne du banc — donc pas laquelle a rougi.
          set -o pipefail
          sortie=$(php bi-self/selfrecover/tests/banc_stockage_pdo.php | tee /dev/stderr)
          # ⚠️ Le banc MESURE ce qu'il a exercé (ReflectionClass + realpath), il
          # ne l'écrit pas : un littéral s'imprimerait à l'identique même s'il
          # chargeait un autre fichier, et ce contrôle ne vaudrait rien.
          echo "$sortie" | grep -qE '^▸ implémentation exercée : bi-self/selfrecover/src/Storage/StockagePdo\.php$' \
            || { echo "::error::le banc n'a pas exercé src/Storage/StockagePdo.php"; exit 1; }
          echo "$sortie" | grep -qE '^▸ schéma exercé          : bi-self/selfrecover/schema\.sql$' \
            || { echo "::error::le banc n'a pas exercé schema.sql"; exit 1; }
          # ⚠️ Le code de sortie du banc vient de son propre verdict : falsifier
          # ce verdict le rend muet, et aucune garde INTERNE ne peut l'attraper —
          # mesuré au canari. Ce grep est la seconde source, et elle est dehors.
          if echo "$sortie" | grep -q '❌'; then
            echo "::error::le banc a affiché au moins un échec tout en sortant à 0"; exit 1
          fi
          # ⚠️ Les greps ci-dessus prouvent que la classe se RÉSOUT au bon chemin,
          # pas qu'un contrôle l'a exercée : mesuré au canari, un banc à zéro
          # contrôle les passe tous les trois. Le plancher ci-dessous est le seul
          # à distinguer « tout est vert » de « rien n'a tourné », et il vit
          # dehors parce que celui du banc se contourne depuis l'intérieur.
          passes=$(echo "$sortie" | sed -nE 's/^✅ ([0-9]+) contrôle\(s\) passé\(s\).*/\1/p')
          if [ -z "$passes" ] || [ "$passes" -lt 150 ]; then
            echo "::error::le banc n'a rendu que « ${passes:-aucun} » contrôle(s) — il en faut au moins 150"
            exit 1
          fi

      - name: Garde-fou — déploiement SelfJustice
        run: bash self-right/selfjustice/tests/test_deploy.sh

      - name: Garde-fou — entrées acceptées par l'API SelfJustice
        run: php self-right/selfjustice/tests/sanity_entree_api.php

      - name: Garde-fou — mots comptés par le score de pertinence (MCP)
        run: python3 self-right/selfjustice/tests/sanity_pertinence.py

      - name: Garde-fou — calcul d'échéance de procédure (art. 640-643 CPC)
        run: bash self-right/selfact/tests/test_echeance.sh

      - name: Garde-fou — fraîcheur annoncée du catalogue SelfAct
        run: python3 self-right/selfjustice/tests/sanity_fraicheur_catalogue.py

      - name: Garde-fou — sur quelle date se juge le retard d'une base
        run: python3 self-right/selfjustice/tests/sanity_fraicheur_bases.py

      - name: Garde-fou — le texte d'une décision, selon son fonds (MCP)
        run: python3 self-right/selfjustice/tests/sanity_texte_decision.py

      - name: Garde-fou — le renvoi « Voir « homonymes » » trouve sa cible (MCP)
        run: python3 self-right/selfjustice/tests/sanity_renvoi_homonymes.py

      - name: Garde-fou — les pages de justice.my-self.fr restent compatibles avec sa CSP
        run: python3 self-right/selfjustice/tests/sanity_csp_compatible.py

      - name: Garde-fou — ce que la sentinelle appelle un retard
        run: bash self-right/selfjustice/tests/test_fraicheur.sh

      - name: Garde-fou — quel catalogue SelfAct est servi
        run: bash self-right/selfact/tests/test_chemin_catalogue.sh

      - name: Garde-fou — le scraper refuse une source tronquée
        run: bash self-right/selfact/tests/test_garde_catalogue.sh

      - name: Garde-fou — servis, les outils de ligne de commande de SelfAct ne font rien
        run: bash self-right/selfact/tests/test_garde_cli.sh

      - name: Garde-fou — les copies du journal du panneau de veille
        run: bash self-right/selfjustice/tests/test_admin_feed.sh

      - name: Garde-fou — le stockage des retours a un plafond
        run: php self-right/selfjustice/tests/test_quota_feedback.php

      # L'en-tête Host est choisi par le client : une URL composée avec lui part
      # dans des réponses mises en cache. SERVER_NAME, fixé par nginx, le remplace.
      - name: Garde-fou — Self-Right ne compose aucune URL avec l'en-tête Host
        run: |
          if git grep -n 'HTTP_HOST' -- 'self-right/*.php' ':!self-right/*/tests/*'; then
            echo "::error::HTTP_HOST lu par Self-Right"; exit 1
          fi
          echo "aucun HTTP_HOST dans Self-Right"

      # lxml à la version de l'instance : c'est son analyseur qui découpe les traités.
      - name: Garde-fou — un traité se découpe juste dans le Journal officiel
        run: |
          pip install --quiet 'lxml==6.1.1'
          python3 self-right/selfjustice/tests/test_tranche_jo.py

      - name: Garde-fou — la sonde amont de la vérification de référence
        run: bash self-right/selfjustice/tests/test_sonde_amont.sh

      - name: Garde-fou — une fenêtre de moisson récente n'est jamais complète
        run: python3 self-right/selfjustice/tests/test_sedimentation.py

      - name: Garde-fou — toute variable d'environnement lue est documentée
        run: python3 self-right/selfjustice/tests/sanity_variables_documentees.py

      - name: Garde-fou — un numéro d'article qui a changé de contenu
        run: bash self-right/selfjustice/tests/test_renvoi_article.sh

      - name: Garde-fou — la page n'annonce aucun code que l'API ne résout
        run: python3 self-right/selfjustice/tests/sanity_codes_annonces.py

      - name: Garde-fou — les articles cités par les directives de domaine sont mesurés
        run: python3 self-right/selfjustice/tests/sanity_articles_domaines.py

      - name: Garde-fou — le texte porte sa mise en forme, pas celle de sa source
        run: bash self-right/selfjustice/tests/test_texte_propre.sh

      - name: Garde-fou — la couverture juridictionnelle se dérive de l'index
        run: bash self-right/selfjustice/tests/sanity_juridictions_servies.sh

      - name: Garde-fou — un paramètre refusé par l'amont ne se découpe pas
        run: bash self-right/selfjustice/tests/sanity_refus_amont.sh

      - name: Garde-fou — les 113 libellés du fonds JADE sont tous classés
        run: python3 self-right/selfjustice/tests/sanity_jade_juridictions.py

      - name: Garde-fou — le collecteur JADE refuse bruyamment ce qu'il ne sait pas lire
        run: python3 self-right/selfjustice/tests/sanity_jade_collecteur.py

      - name: Garde-fou — le pilote JADE sonne quand le fonds décroche, et pas avant
        run: bash self-right/selfjustice/tests/test_update_jade.sh

      - name: Garde-fou — les deux collecteurs écrivent dans la même table
        run: python3 self-right/selfjustice/tests/sanity_schema_partage.py

      - name: Garde-fou — une moisson partielle se garde, elle ne se détruit pas
        run: bash self-right/selfjustice/tests/sanity_moisson_partielle.sh

      - name: Garde-fou — le compteur d'IA lit le User-Agent, pas la ligne
        run: bash self-right/selfjustice/tests/test_compteur_ia.sh

      - name: Garde-fou — le pont vers les démarches officielles
        run: bash self-right/selfact/tests/test_gabarits_officiels.sh

      - name: Garde-fou — situations.json, que rien d'autre ne charge
        run: bash self-right/selfact/tests/test_situations.sh

      - name: Garde-fou — le délai de prescription se lit, il ne se sérialise pas
        run: python3 self-right/selfjustice/tests/sanity_prescription.py

      # Le banc voisin extrait une fonction et l'exécute seule ; celui-ci lance le
      # vrai serveur MCP et l'interroge en JSON-RPC, parce que le défaut qu'il
      # attrape était une fonction ABSENTE du rendu — rien à extraire, rien à voir.
      # Les deux dépendances coûtent quelques secondes, comme cryptsetup plus bas.
      # Versions épinglées, comme les actions le sont par leur SHA : ce workflow
      # tourne aussi sur `pull_request`, et une dépendance flottante y entrerait
      # sans relecture. Le plancher déclaré par pyproject.toml est celui qu'on
      # éprouve — mcp 2.1.1 passe aussi, mesuré le 02/09/2026.
      - name: Dépendances du banc MCP
        run: pip install --quiet 'mcp==2.0.0' 'httpx==0.28.1'

      - name: Garde-fou — ce que le MCP rend vraiment d'une fiche de situation
        run: python3 self-right/selfjustice/tests/test_mcp_situation.py

      # Deux modules décrivent le même avertissement : SelfAct le pose sur le
      # document, le MCP l'annonce au modèle. Rien ne les tenait ensemble, et
      # corriger l'un sans l'autre inverse simplement le sens de l'écart.
      - name: Garde-fou — le MCP ne décrit pas un avertissement disparu
        run: python3 self-right/selfjustice/tests/sanity_mcp_decrit_le_document.py

      - name: Garde-fou — ce que le déploiement de l'arbre emporte
        run: bash deploy/my-self/tests/test_deploy.sh

      - name: Garde-fou — le déploiement d'une instance SelfAct
        run: bash deploy/selfact/tests/test_deploy.sh

      # cryptsetup n'est pas sur le runner, et argon2 non plus : les installer coûte
      # quelques secondes et rend ce banc exécutable ici. Il ne demande pas root — le
      # conteneur LUKS2 est un fichier, aucune activation device-mapper.
      - name: Outils du banc SelfRecover-LUKS
        run: |
          # `update` non bloquant, `install` bloquant — motif expliqué à l'installation de nginx.
          sudo apt-get update -qq || echo "::warning::index apt partiel — l'installation reste bloquante"
          sudo apt-get install -y -qq cryptsetup-bin python3-argon2 libargon2-dev
          # Le binaire C est celui que le keyscript appelle à l'amorçage. Le banc
          # choisit UN dérivateur : le C s'il est compilé, sinon le Python. Sans
          # cette compilation, la CI n'éprouvait que le Python — et le seul chemin
          # dont l'échec rend une machine non amorçable n'était couvert par aucun
          # vert.
          cc -O2 -Wall -o self-security/selfrecover-luks/selfrecover_derive \
             self-security/selfrecover-luks/selfrecover_derive.c -l:libargon2.so.1

      - name: Garde-fou — comment cryptsetup lit une clé selon le chemin emprunté
        run: |
          sortie=$(bash self-security/selfrecover-luks/tests/test_lecture_keyfile.sh)
          echo "$sortie"
          # ⚠️ Le banc annonce le dérivateur qu'il a exercé. Sans ce contrôle, une
          # compilation ratée le ferait retomber sur le Python et rendre le même
          # vert — en ayant mesuré l'autre chemin. Motif éprouvé dans les deux
          # sens : il reconnaît le binaire C, il refuse la ligne `python3 …`.
          echo "$sortie" | grep -qE '▸ dérivateur : [^ ]*/selfrecover_derive$' \
            || { echo "::error::le banc n'a pas exercé le dérivateur C"; exit 1; }

      - name: Garde-fou — le contrôle d'initramfs vise l'image que l'amorceur CHARGE
        run: |
          # Le 13/09/2026 sur RPi4 : image générée complète, image d'amorçage sans
          # une seule pièce SelfRecover, et le contrôle affichait « complet » sur une
          # machine non amorçable. Ce banc replante ce cas et ses voisins.
          # Il ne demande ni root ni initramfs réel : `lsinitramfs` est bouchonné.
          sortie=$(bash self-security/selfrecover-luks/tests/test_garde_fou_image_chargee.sh)
          echo "$sortie"
          # ⚠️ Le banc doit avoir joué TOUS ses cas. Sans ce contrôle, un banc qui
          # sortirait tôt — bouchon non exécutable, mktemp en échec — rendrait le
          # même vert en n'ayant rien éprouvé.
          #
          # Le compte est écrit en dur : c'est un inventaire, pas un seuil. Un
          # `N/N` suffirait à dire que les cas joués ont réussi, jamais qu'aucun
          # n'a disparu. Ajouter un cas au banc demande donc de le monter ici —
          # cette friction est le contrôle.
          echo "$sortie" | grep -qE '^✅ 26/26 ' \
            || { echo "::error::le banc du garde-fou n'a pas joué ses 26 cas"; exit 1; }

      - name: Canari — le banc du garde-fou rougit quand le correctif disparaît
        run: |
          # Un banc qu'on n'a jamais fait échouer ne se distingue pas d'un banc qui
          # ne mesure rien : les deux rendent vert. On neutralise ici la seule
          # instruction qui résout l'image chargée, et on exige que le banc rougisse.
          G=self-security/selfrecover-luks/initramfs-post-update-verifie-selfrecover
          sed 's|^  \[ -n "\$_NOM" \] && CHARGEE="\$FW/\$_NOM"|  : # neutralisé|' \
            "$G" > /tmp/garde-neutralise
          chmod 0755 /tmp/garde-neutralise
          grep -q '# neutralisé' /tmp/garde-neutralise \
            || { echo "::error::la neutralisation n'a rien changé — le canari ne prouve rien"; exit 1; }
          if sortie=$(GARDE=/tmp/garde-neutralise \
             bash self-security/selfrecover-luks/tests/test_garde_fou_image_chargee.sh 2>&1); then
            echo "$sortie"
            echo "::error::le banc reste VERT sans le correctif — il ne mesure pas ce qu'il annonce"
            exit 1
          fi
          # ⚠️ Le banc a rougi — mais POUR QUELLE RAISON ? Un canari qui se contente d'un
          # code de retour non nul ne distingue pas « le défaut planté est détecté » de
          # « le banc n'a pas pu démarrer ». Éprouvé : en le pointant vers un fichier
          # absent, il rougit aussi — et cette étape aurait conclu qu'il prouvait quelque
          # chose. Le cas vient d'un déploiement intégrateur, 15/09 : son canari
          # rougissait parce que php manquait sur l'hôte, pas parce que le défaut
          # planté était là. Un canari qui se trompe de motif ne vaut pas mieux que
          # la sonde qu'il éprouve.
          echo "$sortie" | grep -q '13/09.*VERT (attendu ROUGE)' \
            || { echo "$sortie"
                 echo "::error::le banc a échoué, mais PAS sur le cas du 13/09 — ce canari ne prouve rien"
                 exit 1; }
          echo "✓ le banc rougit, et il rougit SUR LE CAS DU 13/09 — pas sur un contretemps"

      - name: Canari — le garde-fou rougit sur une borne raw sous un keyscript hex
        run: |
          # L'image d'une machine migrée de raw à hex sans correction de la borne :
          # cryptsetup tronquerait la clé au démarrage. On range une borne différente
          # avec les bornes conformes, et le banc doit rougir sur ce cas-là.
          G=self-security/selfrecover-luks/initramfs-post-update-verifie-selfrecover
          sed 's/^            0|3) ;;/            0|1|3) ;;/' "$G" > /tmp/garde-borne
          chmod 0755 /tmp/garde-borne
          grep -q '^            0|1|3) ;;' /tmp/garde-borne \
            || { echo "::error::la plantation n'a pas pris — ce canari ne prouve rien"; exit 1; }
          if sortie=$(GARDE=/tmp/garde-borne \
             bash self-security/selfrecover-luks/tests/test_garde_fou_image_chargee.sh 2>&1); then
            echo "$sortie"
            echo "::error::le banc reste VERT sans l'alerte de borne"
            exit 1
          fi
          echo "$sortie" | grep -q 'keyscript hex sous keyfile-size=32.*VERT (attendu ROUGE)' \
            || { echo "$sortie"
                 echo "::error::rouge, mais pas sur la borne raw sous un keyscript hex"
                 exit 1; }

      # L'enrôlement, le démarrage et le secours dérivent la clé du slot sous un label.
      # Changé d'un seul côté, la machine ne s'ouvre plus au boot — et la preuve de
      # setup-add, qui relit son propre label, ne le verrait pas.
      - name: Garde-fou — un seul label de dérivation pour les trois scripts LUKS
        run: |
          sortie=$(bash self-security/selfrecover-luks/tests/test_label_derivation.sh)
          echo "$sortie"
          echo "$sortie" | grep -qE '^✅ 3/3 ' \
            || { echo "::error::le banc du label n'a pas jugé les trois scripts"; exit 1; }
          F=self-security/selfrecover-luks/selfrecover-unlock.sh
          cp "$F" /tmp/unlock.intact
          avant=$(md5sum "$F" | cut -d" " -f1)
          sed -i 's/^LABEL_DERIVATION=disk$/LABEL_DERIVATION=root/' "$F"
          grep -q '^LABEL_DERIVATION=root$' "$F" || { echo "::error::canari non planté"; exit 1; }
          if canari=$(bash self-security/selfrecover-luks/tests/test_label_derivation.sh); then
            cp /tmp/unlock.intact "$F"
            echo "::error::un label divergent rend encore vert"; exit 1
          fi
          cp /tmp/unlock.intact "$F"
          [ "$(md5sum "$F" | cut -d" " -f1)" = "$avant" ] \
            || { echo "::error::le fichier n'a pas été restauré à l'identique"; exit 1; }
          echo "$canari" | grep -q 'selfrecover-unlock.sh.*« root », les autres « disk »' \
            || { echo "$canari"; echo "::error::rouge, mais pas sur le label divergent"; exit 1; }
          echo "✓ le banc rougit sur un label divergent"

      - name: Garde-fou — les secrets irréversibles ont une sauvegarde UTILISABLE
        run: |
          # Le 15/09/2026, une machine passée en production publique avait sa seule
          # copie d'en-tête LUKS à l'intérieur du volume qu'elle sert à ouvrir.
          # INSTALL.md §4 le proscrivait déjà, mot pour mot : c'est un trou
          # d'exécution, pas de documentation. Ce banc éprouve le contrôle qui le
          # ferme — conteneur LUKS de 32 Mo sur fichier, ni root ni device-mapper.
          sortie=$(bash self-security/selfrecover-luks/tests/test_sauvegardes.sh)
          echo "$sortie"
          # ⚠️ Le compte est écrit en dur : un `N/N` dirait que les cas joués ont
          # réussi, jamais qu'aucun n'a disparu.
          echo "$sortie" | grep -qE '^✅ 11/11 ' \
            || { echo "::error::le banc des sauvegardes n'a pas joué ses 11 cas"; exit 1; }

      - name: Canari — le contrôle des sauvegardes rougit quand il cesse de mordre
        run: |
          # Le cas qui compte le plus est la sauvegarde PÉRIMÉE : elle existe, elle se
          # lit, elle appartient au bon volume — et elle ressuscite un slot révoqué.
          # C'est celui-là qu'on neutralise.
          V=self-security/selfrecover-luks/verifie-sauvegardes.sh
          sed 's|^\[ "\$N_DISQUE" = "\$N_SAUVE" \] \\|if false; then : ; fi; [ 1 = 1 ] \\|' \
            "$V" > /tmp/verif-neutralise.sh
          chmod 0755 /tmp/verif-neutralise.sh
          grep -q 'if false; then' /tmp/verif-neutralise.sh \
            || { echo "::error::la plantation n'a pas pris — ce canari ne prouve rien"; exit 1; }
          bash -n /tmp/verif-neutralise.sh \
            || { echo "::error::la version plantée ne compile pas — le rouge viendrait de la syntaxe"; exit 1; }
          if sortie=$(VERIF=/tmp/verif-neutralise.sh \
               bash self-security/selfrecover-luks/tests/test_sauvegardes.sh 2>&1); then
            echo "$sortie"
            echo "::error::le banc reste VERT sans le contrôle de péremption"
            exit 1
          fi
          # Rouge — mais SUR QUEL CAS ? Un banc qui n'aurait pas démarré rougirait aussi.
          echo "$sortie" | grep -q 'PÉRIMÉE.*ACCEPTE' \
            || { echo "$sortie"
                 echo "::error::rouge, mais pas sur le cas de la sauvegarde périmée"
                 exit 1; }

      - name: Garde-fou — un keyscript ne se pose pas sur un slot d'un autre format
        run: |
          # Un slot enrôlé en raw n'est pas ouvert par un keyscript hex : la machine
          # démarre encore, puis plus au redémarrage suivant. install.sh relit le
          # format enrôlé (format-slot.sh) avant de poser le keyscript, et aligne la
          # borne keyfile-size sur la longueur de la clé. Ce banc l'exerce sur des
          # conteneurs LUKS de 32 Mo, ni root ni device-mapper.
          sortie=$(bash self-security/selfrecover-luks/tests/test_format_slot.sh)
          echo "$sortie"
          echo "$sortie" | grep -qE '^✅ 40/40 ' \
            || { echo "::error::le banc du format de slot n'a pas joué ses 40 cas"; exit 1; }

      - name: Canari — le contrôle du format rougit quand il ne compare plus
        run: |
          # Le cas qui rend une machine muette : slot raw, keyscript hex. On retire la
          # comparaison, et le banc doit rougir sur ce cas-là.
          F=self-security/selfrecover-luks/format-slot.sh
          sed 's/\[ "\$ENROLE" = "\$LIVRE" \] || refus/true || refus/' "$F" > /tmp/format-neutralise.sh
          grep -q 'true || refus "le slot de' /tmp/format-neutralise.sh \
            || { echo "::error::la plantation n'a pas pris — ce canari ne prouve rien"; exit 1; }
          bash -n /tmp/format-neutralise.sh \
            || { echo "::error::la version plantée ne compile pas — le rouge viendrait de la syntaxe"; exit 1; }
          if sortie=$(FMT=/tmp/format-neutralise.sh \
               bash self-security/selfrecover-luks/tests/test_format_slot.sh 2>&1); then
            echo "$sortie"
            echo "::error::le banc reste VERT sans la comparaison des formats"
            exit 1
          fi
          echo "$sortie" | grep -q 'racine enrôlée raw, keyscript hex à poser.*ACCEPTE' \
            || { echo "$sortie"
                 echo "::error::rouge, mais pas sur le cas slot raw / keyscript hex"
                 exit 1; }

      - name: Canari — la table des longueurs de clé est tenue par cryptsetup
        run: |
          # La borne keyfile-size vient de `format-slot.sh taille`. On inverse la
          # table : la borne qu'elle donne au hex doit cesser d'ouvrir une clé hex.
          F=self-security/selfrecover-luks/format-slot.sh
          sed 's/hex) echo 64 ;;/hex) echo 32 ;;/; s/raw) echo 32 ;;/raw) echo 64 ;;/' "$F" > /tmp/format-table.sh
          grep -q 'hex) echo 32 ;;' /tmp/format-table.sh \
            || { echo "::error::la plantation n'a pas pris — ce canari ne prouve rien"; exit 1; }
          if sortie=$(FMT=/tmp/format-table.sh \
               bash self-security/selfrecover-luks/tests/test_format_slot.sh 2>&1); then
            echo "$sortie"
            echo "::error::le banc reste VERT avec une table des longueurs inversée"
            exit 1
          fi
          echo "$sortie" | grep -q 'clé hex, borne que format-slot.sh donne au hex.*ECHOUE (attendu OUVRE)' \
            || { echo "$sortie"
                 echo "::error::rouge, mais pas sur la clé hex sous sa propre borne"
                 exit 1; }

      - name: Canari — une borne différente se refuse
        run: |
          # Une borne raw sous un keyscript hex tronque la clé au démarrage. On retire
          # la comparaison : le banc doit rougir sur ce cas-là.
          F=self-security/selfrecover-luks/format-slot.sh
          sed 's/if \[ "\$ACTUELLE" = "\$TAILLE" \]; then/if true; then/' "$F" > /tmp/format-borne.sh
          grep -q '^    if true; then' /tmp/format-borne.sh \
            || { echo "::error::la plantation n'a pas pris — ce canari ne prouve rien"; exit 1; }
          if sortie=$(FMT=/tmp/format-borne.sh \
               bash self-security/selfrecover-luks/tests/test_format_slot.sh 2>&1); then
            echo "$sortie"
            echo "::error::le banc reste VERT sans la comparaison de la borne"
            exit 1
          fi
          echo "$sortie" | grep -q 'borne du raw sous un keyscript hex : refus.*code 0 (attendu 1)' \
            || { echo "$sortie"
                 echo "::error::rouge, mais pas sur la borne raw sous un keyscript hex"
                 exit 1; }

      - name: Garde-fou — le slot se prouve par le dérivateur de l'amorçage
        run: |
          # L'enrôlement dérive en Python, l'amorçage en C. Tant que la preuve
          # appelait le Python elle aussi, une divergence entre les deux
          # implémentations ne se voyait qu'au redémarrage suivant — celui où la
          # machine ne revient pas. Conteneurs LUKS de 32 Mo, ni root ni
          # device-mapper ; compte ~1 min, les luksAddKey passent par Argon2id.
          sortie=$(bash self-security/selfrecover-luks/tests/test_preuve_binaire_boot.sh)
          echo "$sortie"
          echo "$sortie" | grep -qE '^✅ 10/10 ' \
            || { echo "::error::le banc de la preuve n'a pas joué ses 10 cas"; exit 1; }
          # Le banc annonce le dérivateur qu'il a exercé. Il refuse de se rabattre
          # sur le Python, mais le vert ne le dit pas : cette ligne le dit.
          echo "$sortie" | grep -qE '▸ dérivateur du démarrage : .*/selfrecover_derive$' \
            || { echo "::error::le banc n'a pas exercé le dérivateur C"; exit 1; }

      - name: Canari — le banc rougit si la preuve repasse par l'enrôleur
        run: |
          # Le défaut d'origine, replanté : la preuve dérive avec le même outil que
          # l'enrôlement, donc elle s'accorde toujours avec elle-même.
          S=self-security/selfrecover-luks/setup-add-selfrecover-slot.sh
          sed 's/^if \[ -n "\$DERIVE_C" \]; then$/if false; then/' "$S" > /tmp/setup-neutralise.sh
          grep -q '^if false; then' /tmp/setup-neutralise.sh \
            || { echo "::error::la plantation n'a pas pris — ce canari ne prouve rien"; exit 1; }
          bash -n /tmp/setup-neutralise.sh \
            || { echo "::error::la version plantée ne compile pas — le rouge viendrait de la syntaxe"; exit 1; }
          if sortie=$(SETUP=/tmp/setup-neutralise.sh \
               bash self-security/selfrecover-luks/tests/test_preuve_binaire_boot.sh 2>&1); then
            echo "$sortie"
            echo "::error::le banc reste VERT quand la preuve n'emprunte plus le chemin du démarrage"
            exit 1
          fi
          echo "$sortie" | grep -q 'les deux dérivateurs divergent.*ACCEPTE (attendu REFUSE)' \
            || { echo "$sortie"
                 echo "::error::rouge, mais pas sur le cas de la divergence"
                 exit 1; }

      - name: Garde-fou — le secours d'amorçage rend les deux voies, jamais un shell
        run: |
          # Mesuré le 21/09/2026 sur les quatre machines chiffrées du parc : la clé
          # du dropbear d'amorçage était NUE, donc elle rendait un shell root avant
          # l'ouverture de la racine. /boot n'étant pas chiffré et le sel y voyageant,
          # ce shell permet de déposer un initrd modifié et de capturer la passphrase
          # suivante. C'est install.sh qui produisait ces clés nues.
          # Le remède ne doit pas coûter le filet anti-lockout : selfrecover-secours.sh
          # offre les DEUX passphrases sans rendre de shell. Ce banc l'éprouve.
          sortie=$(bash self-security/selfrecover-luks/tests/test_secours_sans_shell.sh)
          echo "$sortie"
          # Compte en dur : un `N/N` dirait que les cas joués passent, jamais
          # qu'aucun n'a disparu.
          echo "$sortie" | grep -qE '^✅ 23/23 ' \
            || { echo "::error::le banc du secours n'a pas joué ses 23 cas"; exit 1; }

      - name: Canari — le banc du secours rougit si le shell revient
        run: |
          # Le cas qui compte est celui qu'on vient de fermer : un secours qui rend
          # un shell. On le replante et on exige que le banc cesse de passer.
          S=self-security/selfrecover-luks/selfrecover-secours.sh
          sed 's|^    exec "\$UNLOCK"|    exec /bin/sh|' "$S" > /tmp/secours-avec-shell.sh
          chmod 0755 /tmp/secours-avec-shell.sh
          grep -q 'exec /bin/sh' /tmp/secours-avec-shell.sh \
            || { echo "::error::la plantation n'a pas pris — ce canari ne prouve rien"; exit 1; }
          sh -n /tmp/secours-avec-shell.sh \
            || { echo "::error::la version plantée ne compile pas — le rouge viendrait de la syntaxe"; exit 1; }
          if sortie=$(SECOURS=/tmp/secours-avec-shell.sh \
               bash self-security/selfrecover-luks/tests/test_secours_sans_shell.sh 2>&1); then
            echo "$sortie"
            echo "::error::le banc reste VERT alors que le secours rend un shell"
            exit 1
          fi
          # Rouge — mais SUR QUEL CAS ? Un banc qui n'aurait pas démarré rougirait aussi.
          echo "$sortie" | grep -q 'aucun exec/eval vers un shell' \
            || { echo "$sortie"
                 echo "::error::rouge, mais pas sur le cas du shell rendu"
                 exit 1; }
          echo "✓ le banc rougit, et il rougit SUR LE SHELL — pas sur un contretemps"
          echo "✓ le banc rougit, et sur le cas de la sauvegarde périmée"

      - name: Garde-fou — un seul plancher pour les secrets de déploiement
        run: bash scripts/check-plancher-secret.sh

      - name: Canari — le contrôle des planchers rougit quand l'un d'eux dérive
        run: |
          # Un plancher trop bas n'échoue jamais : il accepte. Ce contrôle est donc
          # le seul endroit où la divergence se voit — et un contrôle jamais vu
          # rougir ne se distingue pas d'un contrôle qui ne mesure rien.
          F=self-security/selfdataguard/src/Escrow/AuditLog.php
          cp "$F" /tmp/AL.intact
          sed -i 's/public const PLANCHER_SECRET = 32;/public const PLANCHER_SECRET = 16;/' "$F"
          grep -q 'PLANCHER_SECRET = 16' "$F" \
            || { cp /tmp/AL.intact "$F"; echo "::error::la plantation n'a pas pris — le canari ne prouve rien"; exit 1; }
          if bash scripts/check-plancher-secret.sh >/dev/null 2>&1; then
            cp /tmp/AL.intact "$F"
            echo "::error::le contrôle reste VERT avec un plancher à 16 — il ne mesure pas ce qu'il annonce"
            exit 1
          fi
          cp /tmp/AL.intact "$F"
          # Comparaison à la copie d'avant, et non à HEAD : `git diff` rendrait un
          # écart dès que le fichier porte une modification non commitée, donc un
          # faux rouge en local et un contrôle qui ne dit pas ce qu'il prétend.
          cmp -s /tmp/AL.intact "$F" \
            || { echo "::error::le fichier n'a pas été restauré à l'identique"; exit 1; }
          echo "✓ le contrôle rougit sur un plancher divergent, et le fichier est restauré"

      - name: Garde-fou — coût constant du hash factice (bi-self-duo)
        run: php demo/bi-self-duo/tests/sanity_timing.php

      - name: Préparer l'autoload du lab
        working-directory: demo/lab
        run: composer install --no-interaction --no-progress

      - name: Garde-fou — la bibliothèque sur le schéma réel du lab
        run: php demo/lab/tests/equivalence_selfrecover.php

      - name: Garde-fou — coût constant du hash factice (lab)
        run: php demo/lab/tests/sanity_timing.php

      # Le chemin CLIENT du facteur « cet appareil » — le seul banc du lab qui
      # ne soit pas en PHP, et le seul à dépasser l'API.
      - name: Garde-fou — le facteur « cet appareil », côté navigateur
        run: node demo/lab/tests/sanity_device_client.js

      # Le banc client simule `/api/sel.php` : celui-ci éprouve le vrai, par la
      # session que l'inscription ouvre, jusqu'à l'enrôlement.
      - name: Garde-fou — l'enrôlement d'appareil dérive avec le sel du compte
        run: |
          sortie=$(php demo/lab/tests/sanity_sel_session.php)
          echo "$sortie"
          echo "$sortie" | grep -qE '^OK — 5/5$' \
            || { echo "::error::le banc du sel de session n'a pas joué ses 5 cas"; exit 1; }

      # `login_attempts` est partagée entre la page de connexion et les compteurs de
      # la bibliothèque. Deux fois, un filtre censé écarter les seconds a emporté les
      # échecs qu'il devait montrer — dont les codes introuvables, le seul chemin
      # qu'aucun frein par compte ne couvre.
      - name: Garde-fou — la console compte les échecs qu'elle doit compter
        run: |
          sortie=$(php demo/lab/tests/sanity_console_freins.php 2>&1) && rc=0 || rc=$?
          echo "$sortie"
          [ "$rc" = 0 ] || { echo "::error::le banc des compteurs de la console a échoué"; exit 1; }
          echo "$sortie" | grep -qE '^OK — 12/12$' \
            || { echo "::error::le banc des compteurs de la console n'a pas joué ses 12 cas"; exit 1; }

      # Un refus ne doit publier que des clés décidées. Les enveloppes du lab
      # rendaient la réponse de la bibliothèque telle quelle, et 25 endpoints la
      # passent à `json_out()` : une clé ajoutée en amont sortait sans décision,
      # sur deux routes sans authentification.
      - name: Garde-fou — un refus ne publie que ce qu'on a décidé
        run: |
          sortie=$(php demo/lab/tests/sanity_refus_publiable.php 2>&1) && rc=0 || rc=$?
          echo "$sortie"
          [ "$rc" = 0 ] || { echo "::error::le banc des refus publiables a échoué"; exit 1; }
          echo "$sortie" | grep -qE '^OK — 15/15 ' \
            || { echo "::error::le banc des refus publiables n'a pas joué ses 15 cas"; exit 1; }

      # Refuser un dossier de niveau 3 compte sur le compte VISÉ : un tiers qui en
      # ouvre plusieurs fait geler l'ouverture au titulaire, par la main de
      # l'arbitre. L'abandon est la sortie, et il ne doit rien compter.
      - name: Garde-fou — l'abandon d'un dossier L3 ne gèle pas le titulaire
        run: |
          sortie=$(php demo/lab/tests/sanity_l3_abandon.php 2>&1) && rc=0 || rc=$?
          echo "$sortie"
          [ "$rc" = 0 ] || { echo "::error::le banc de l'abandon L3 a échoué"; exit 1; }
          echo "$sortie" | grep -qE '^OK — 6/6 ' \
            || { echo "::error::le banc de l'abandon L3 n'a pas joué ses 6 cas"; exit 1; }

      # Le frein de la page de connexion n'était gardé par aucun banc. Il mord sur
      # deux axes — par compte et par origine — et un frein qui cesse de mordre ne
      # fait aucun bruit.
      - name: Garde-fou — le frein de connexion mord sur ses deux axes
        run: |
          sortie=$(php demo/lab/tests/sanity_frein_login.php 2>&1) && rc=0 || rc=$?
          echo "$sortie"
          [ "$rc" = 0 ] || { echo "::error::le banc du frein de connexion a échoué"; exit 1; }
          echo "$sortie" | grep -qE '^OK — 9/9 ' \
            || { echo "::error::le banc du frein de connexion n'a pas joué ses 9 cas"; exit 1; }

      - name: Canari — la console reperd les tentatives sans étiquette
        run: |
          F=demo/lab/lib/admin.php
          cp "$F" /tmp/admin.intact
          avant=$(md5sum "$F" | cut -d" " -f1)
          # En SQL, `username != '…'` ne rend pas « vrai » sur une valeur absente :
          # retirer ce garde écarte les codes introuvables sans le dire.
          python3 - <<'PY'
          chemin = 'demo/lab/lib/admin.php'
          motif  = "(username IS NULL OR username != '__register__')"
          s = open(chemin, encoding='utf-8').read()
          assert s.count(motif) == 2, 'motif introuvable — ce canari ne prouve rien'
          open(chemin, 'w', encoding='utf-8').write(s.replace(motif, "username != '__register__'"))
          PY
          grep -q "AND username != '__register__'" "$F" \
            || { cp /tmp/admin.intact "$F"; echo "::error::la plantation n'a pas pris — ce canari ne prouve rien"; exit 1; }
          php -l "$F" >/dev/null \
            || { cp /tmp/admin.intact "$F"; echo "::error::la version plantée ne compile pas"; exit 1; }
          if sortie=$(php demo/lab/tests/sanity_console_freins.php 2>&1); then
            cp /tmp/admin.intact "$F"
            echo "$sortie"; echo "::error::le banc reste VERT alors que la console perd des échecs"; exit 1
          fi
          cp /tmp/admin.intact "$F"
          # ⚠️ Mesuré contre l'empreinte prise AVANT la plantation. Comparer au témoin
          # qu'on vient de recopier ne peut échouer que si `cp` a échoué.
          [ "$(md5sum "$F" | cut -d" " -f1)" = "$avant" ] \
            || { echo "::error::le fichier n'a pas été restauré à l'identique"; exit 1; }
          echo "$sortie" | grep -q '❌ .*voit exactement celles-là' \
            || { echo "$sortie"; echo "::error::rouge, mais pas sur le cas du compteur"; exit 1; }
          echo "✓ le banc rougit, et sur le cas du compteur de la console"

      # Le mémo chiffré du lab dérive par srKdfDeriver (Argon2id). Le banc rouvre
      # l'enveloppe produite par le JS avec PHP (libsodium, hash_hkdf, openssl) :
      # une étiquette ou un profil qui dériverait n'y survivrait pas.
      - name: Garde-fou — le mémo chiffré du lab scelle en Argon2id
        run: |
          sortie=$(node demo/lab/tests/sanity_memo_client.js)
          echo "$sortie"
          echo "$sortie" | grep -qE '^OK — 11/11 ' \
            || { echo "::error::le banc du mémo n'a pas joué ses 11 cas"; exit 1; }

      - name: Garde-fou — le stockage du coffre mémo exige ses paramètres Argon2id
        run: |
          sortie=$(php demo/lab/tests/sanity_memo_vault.php)
          echo "$sortie"
          echo "$sortie" | grep -qE 'OK — 9/9 ' \
            || { echo "::error::le banc du stockage mémo n'a pas joué ses 9 cas"; exit 1; }

      # Ce banc porte la justification écrite de l'ancre externe du journal SU
      # (contrôle 4) et le profil de hachage du secret SuperUser (contrôle 8).
      # Il tournait à la main depuis sa création : rien ne le lançait ici.
      - name: Garde-fou — journal et secret du super-utilisateur
        run: |
          sortie=$(php demo/lab/tests/sanity_su.php)
          echo "$sortie"
          # ⚠️ Le compte est écrit en dur : un `N/N` dirait que les cas joués ont
          # réussi, jamais qu'aucun n'a disparu. Un banc dont le nombre de cas change
          # sans que personne le dise est un banc qu'on ne sait plus lire.
          echo "$sortie" | grep -qE 'OK — 26/26 ' \
            || { echo "::error::le banc SU n'a pas joué ses 26 cas"; exit 1; }

      - name: Canari — la troncature du journal SU se voit encore depuis le dehors
        run: |
          # La chaîne de hachage ne détecte pas sa propre troncature : le préfixe
          # d'une chaîne valide est une chaîne valide. Seule la marque du témoin, qui
          # vit HORS du journal, rend un journal raccourci visible. On neutralise
          # cette comparaison et on exige que le banc rougisse — sur ce cas-là.
          F=demo/lab/lib/su_audit.php
          cp "$F" /tmp/su_audit.intact
          sed -i 's|^        if (\$marque > \$tete) {|        if (false) { // neutralisé|' "$F"
          grep -q 'if (false) { // neutralisé' "$F" \
            || { cp /tmp/su_audit.intact "$F"; echo "::error::la plantation n'a pas pris — ce canari ne prouve rien"; exit 1; }
          php -l "$F" >/dev/null \
            || { cp /tmp/su_audit.intact "$F"; echo "::error::la version plantée ne compile pas — le rouge viendrait de la syntaxe"; exit 1; }
          if sortie=$(php demo/lab/tests/sanity_su.php 2>&1); then
            cp /tmp/su_audit.intact "$F"
            echo "$sortie"; echo "::error::le banc reste VERT sans la détection de troncature"; exit 1
          fi
          cp /tmp/su_audit.intact "$F"
          cmp -s /tmp/su_audit.intact "$F" \
            || { echo "::error::le fichier n'a pas été restauré à l'identique"; exit 1; }
          echo "$sortie" | grep -q 'journal raccourci sous la marque' \
            || { echo "$sortie"; echo "::error::rouge, mais pas sur le cas de la troncature"; exit 1; }
          echo "✓ le banc rougit, et sur le cas du journal raccourci"

      - name: Garde-fou — SelfModerate, le moteur et son ban tracé
        run: |
          sortie=$(php demo/lab/tests/sanity_moderate.php 2>&1) || { echo "$sortie"; exit 1; }
          echo "$sortie"
          echo "$sortie" | grep -qx '✅ 45/45 contrôles passés' \
            || { echo "::error::le banc de modération n'a pas joué ses 45 contrôles"; exit 1; }

      - name: Canari — SelfModerate prolonge une peine en cours
        run: |
          # La garde qui empêche un ban en cours de reculer à chaque vote contraire
          # est retirée : le banc doit rougir sur ce cas précis.
          M=bi-self/selfmoderate/src/Moderate.php
          cp "$M" /tmp/moderate.intact
          python3 - "$M" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          garde = "        if ((int) $etat['banned_until'] > $maintenant) {\n            return;\n        }\n\n        $episode"
          assert s.count(garde) == 1, 'plantation impossible'
          open(p, 'w', encoding='utf-8').write(s.replace(garde, "        $episode"))
          PY
          [ $? -eq 0 ] || { cp /tmp/moderate.intact "$M"; echo "::error::la plantation n'a pas pris — ce canari ne prouve rien"; exit 1; }
          if sortie=$(php demo/lab/tests/sanity_moderate.php 2>&1); then
            cp /tmp/moderate.intact "$M"; echo "$sortie"; echo "::error::le banc reste VERT quand une peine se prolonge"; exit 1
          fi
          cp /tmp/moderate.intact "$M"
          cmp -s /tmp/moderate.intact "$M" || { echo "::error::le fichier n'a pas été restauré à l'identique"; exit 1; }
          echo "$sortie" | grep -q 'la peine a reculé' \
            || { echo "$sortie"; echo "::error::rouge, mais pas sur le cas de la peine prolongée"; exit 1; }
          echo "✓ le banc rougit, et sur le cas de la peine prolongée"

      - name: Garde-fou — premier administrateur et dernier administrateur
        run: |
          sortie=$(php demo/lab/tests/sanity_first_admin.php)
          echo "$sortie"
          echo "$sortie" | grep -qE 'OK — 30/30 ' \
            || { echo "::error::le banc first-admin n'a pas joué ses 30 cas"; exit 1; }

      - name: Canari — le dernier administrateur tombe sans ses deux gardes
        run: |
          # Deux gardes se recouvrent : la console refuse, et la base refuse derrière
          # elle. On retire les DEUX, et le banc doit rougir sur le dernier admin —
          # en retirer une seule laisse l'autre tenir, ce qui ne prouverait rien.
          C=demo/lab/selfrecover-su; D=demo/lab/lib/db.php
          cp "$C" /tmp/su.intact; cp "$D" /tmp/db.intact
          restaurer() { cp /tmp/su.intact "$C"; cp /tmp/db.intact "$D"; }
          sed -i 's|if (su_nb_admins(\$db) <= 1) {|if (false) { // neutralisé|' "$C"
          sed -i 's|AND (SELECT COUNT(\*) FROM accounts WHERE is_admin = 1) <= 1|AND 0|' "$D"
          grep -q 'if (false) { // neutralisé' "$C" && [ "$(grep -c '^             AND 0$' "$D")" = 2 ] \
            || { restaurer; echo "::error::la plantation n'a pas pris — ce canari ne prouve rien"; exit 1; }
          php -l "$C" >/dev/null && php -l "$D" >/dev/null \
            || { restaurer; echo "::error::la version plantée ne compile pas — le rouge viendrait de la syntaxe"; exit 1; }
          if sortie=$(php demo/lab/tests/sanity_first_admin.php 2>&1); then
            restaurer; echo "$sortie"; echo "::error::le banc reste VERT sans les gardes du dernier admin"; exit 1
          fi
          restaurer
          cmp -s /tmp/su.intact "$C" && cmp -s /tmp/db.intact "$D" \
            || { echo "::error::les fichiers n'ont pas été restaurés à l'identique"; exit 1; }
          echo "$sortie" | grep -q 'le dernier admin devait être gardé' \
            || { echo "$sortie"; echo "::error::rouge, mais pas sur le cas du dernier admin"; exit 1; }
          echo "✓ le banc rougit, et sur le cas du dernier admin"

      - name: Garde-fou — rotation de la clé du journal SU
        run: |
          sortie=$(php demo/lab/tests/sanity_rotation.php)
          echo "$sortie"
          echo "$sortie" | grep -qE 'OK — 18/18 ' \
            || { echo "::error::le banc de rotation n'a pas joué ses 18 cas"; exit 1; }

      - name: Canari — la rotation re-signe sans vérifier d'abord
        run: |
          # Sans la vérification sous l'ancienne clé, une entrée forgée sans la clé
          # (chaînage juste, HMAC faux) devient authentique sous la nouvelle.
          C=demo/lab/selfrecover-su
          cp "$C" /tmp/su-rot.intact
          restaurer() { cp /tmp/su-rot.intact "$C"; }
          python3 - "$C" <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          a = "$ver = SuAudit::verifierEntrees($entrees, $ancienne);\n        if (!$ver['ok']) {"
          assert s.count(a) == 1, "motif introuvable"
          open(p, 'w').write(s.replace(a, "$ver = SuAudit::verifierEntrees($entrees, $ancienne);\n        if (false) {"))
          PY
          [ $? -eq 0 ] && ! cmp -s /tmp/su-rot.intact "$C" \
            || { restaurer; echo "::error::la plantation n'a pas pris — ce canari ne prouve rien"; exit 1; }
          php -l "$C" >/dev/null \
            || { restaurer; echo "::error::la version plantée ne compile pas — le rouge viendrait de la syntaxe"; exit 1; }
          if sortie=$(php demo/lab/tests/sanity_rotation.php 2>&1); then
            restaurer; echo "$sortie"; echo "::error::le banc reste VERT quand la rotation blanchit une entrée forgée"; exit 1
          fi
          restaurer
          cmp -s /tmp/su-rot.intact "$C" \
            || { echo "::error::le fichier n'a pas été restauré à l'identique"; exit 1; }
          echo "$sortie" | grep -q 'entrée forgée sans la clé' \
            || { echo "$sortie"; echo "::error::rouge, mais pas sur le cas de l'entrée forgée"; exit 1; }
          echo "✓ le banc rougit, et sur le cas de l'entrée forgée"

      - name: Garde-fou — les secrets d'instance refusent au lieu de servir
        run: |
          sortie=$(php demo/lab/tests/sanity_secrets_instance.php)
          echo "$sortie"
          # ⚠️ Deux des sept sections ne s'éprouvent pas sous root : un répertoire en
          # 0500 ne lui ferme rien, et le banc les saute EN LE DISANT — mais il sort
          # quand même à zéro, puisque rien n'a échoué. Ces deux lignes sont donc le
          # seul témoin qui distingue « tout a été mesuré » de « la moitié l'a été ».
          # Le premier compteur dit ce qu'il compte : trois LECTURES DE SOURCE, qui
          # établissent que les trois fonctions délèguent — pas trois secrets écrits
          # sur un disque fermé, ce que le banc avoue ne pas faire.
          echo "$sortie" | grep -qE "▸ délégations contrôlées sur le source : 3$" \
            || { echo "::error::le banc n'a pas contrôlé les trois délégations"; exit 1; }
          echo "$sortie" | grep -qE "▸ sections sautées : 0$" \
            || { echo "::error::le banc a sauté une section — verdict partiel"; exit 1; }

      # ── Suites de module ───────────────────────────────────────────────────
      - name: SelfDataGuard — sanity
        run: |
          set -e
          for t in self-security/selfdataguard/tests/sanity_*.php; do
            echo "→ $(basename "$t")"
            php "$t"
          done

      # La démo publique de SelfDataGuard donne à chaque visiteur sa propre base. Les
      # canaris : la base commune remise, une lecture qui crée une base, un cookie qui
      # perd Secure par défaut, un quota par adresse levé — le banc doit rougir sur chacun.
      - name: Garde-fou — la démo SelfDataGuard isole chaque visiteur
        run: |
          php demo/selfdataguard/tests/sanity_sessions.php
          F=demo/selfdataguard/api/_bootstrap.php
          canari() {  # canari <avant> <après> <ligne rouge attendue>
            cp "$F" /tmp/boot.intact; avant=$(md5sum "$F" | cut -d" " -f1)
            python3 -c 'import sys; f,a,b=sys.argv[1:4]; s=open(f).read(); n=s.count(a); sys.exit("motif trouvé %d fois" % n) if n != 1 else open(f,"w").write(s.replace(a,b))' "$F" "$1" "$2" \
              || { echo "::error::canari non planté"; exit 1; }
            if sortie=$(php demo/selfdataguard/tests/sanity_sessions.php 2>&1); then
              cp /tmp/boot.intact "$F"; echo "::error::le banc reste VERT sans le correctif"; exit 1
            fi
            cp /tmp/boot.intact "$F"
            echo "$sortie" | grep -qF "$3" || { echo "$sortie"; echo "::error::rouge, mais pas sur « $3 »"; exit 1; }
            [ "$(md5sum "$F" | cut -d" " -f1)" = "$avant" ] || { echo "::error::$F non restauré"; exit 1; }
            echo "✓ le banc rougit sur « $3 »"
          }
          canari "\$baseVisiteur = \$repertoireBases . '/' . \$idVisiteur . '.sqlite';" \
            "\$baseVisiteur = \$repertoireBases . '/commune.sqlite';" 'le second visiteur voit le coffre du premier'
          canari "new SqliteAdapter(\$baseExiste ? 'sqlite:' . DEMO_DB_PATH : 'sqlite::memory:')" \
            "new SqliteAdapter('sqlite:' . DEMO_DB_PATH)" 'une lecture a créé une base'
          canari "=== '1';" "!== '0';" 'attributs du cookie'
          canari 'if (count($creations) >= DEMO_BASES_PAR_ADRESSE) {' 'if (false) {' 'quota par adresse'

      # SelfRecover et SelfDataGuard déclarent chacun leur minimum de mot de passe
      # et leur normalisation de la passphrase, sans dépendre l'un de l'autre : ce
      # banc les tient d'accord. Chaque canari désaccorde l'un des deux et exige le
      # rouge.
      - name: Garde-fou — les valeurs que SelfRecover partage avec SelfDataGuard
        run: |
          sortie=$(php bi-self/selfrecover/tests/sanity_couplage_dataguard.php)
          echo "$sortie"
          echo "$sortie" | grep -qE '^OK — 10/10 ' \
            || { echo "::error::le banc du couplage n'a pas jugé ses 10 valeurs"; exit 1; }
          F=self-security/selfdataguard/src/Vault/UserVault.php
          cp "$F" /tmp/UserVault.intact
          avant=$(md5sum "$F" | cut -d" " -f1)
          sed -i 's/public const PASSWORD_MIN_LEN = 12;/public const PASSWORD_MIN_LEN = 13;/' "$F"
          grep -q 'PASSWORD_MIN_LEN = 13;' "$F" || { echo "::error::canari non planté — motif introuvable"; exit 1; }
          if php bi-self/selfrecover/tests/sanity_couplage_dataguard.php; then
            cp /tmp/UserVault.intact "$F"
            echo "::error::les minimums désaccordés rendent encore vert"; exit 1
          fi
          cp /tmp/UserVault.intact "$F"
          [ "$(md5sum "$F" | cut -d" " -f1)" = "$avant" ] \
            || { echo "::error::le fichier n'a pas été restauré à l'identique"; exit 1; }
          echo "✓ la sonde rougit quand les minimums divergent"
          sed -i 's/return trim((string) preg_replace(/return ((string) preg_replace(/' "$F"
          grep -q 'return ((string) preg_replace(' "$F" || { echo "::error::canari non planté — motif introuvable"; exit 1; }
          if sortie=$(php bi-self/selfrecover/tests/sanity_couplage_dataguard.php); then
            cp /tmp/UserVault.intact "$F"
            echo "::error::les normalisations désaccordées rendent encore vert"; exit 1
          fi
          cp /tmp/UserVault.intact "$F"
          echo "$sortie" | grep -q '✗ normalisation de la passphrase' \
            || { echo "$sortie"; echo "::error::le rouge ne vient pas de la normalisation"; exit 1; }
          [ "$(md5sum "$F" | cut -d" " -f1)" = "$avant" ] \
            || { echo "::error::le fichier n'a pas été restauré à l'identique"; exit 1; }
          echo "✓ la sonde rougit quand les normalisations divergent"

      # Un coffre SelfDataGuard traverse chaque récupération de SelfRecover, sur les
      # vrais chemins des deux bibliothèques. Le canari fait oublier à recover() le
      # re-scellement de la passphrase : la passphrase consommée ouvrirait encore.
      - name: Garde-fou — un coffre survit à chaque récupération SelfRecover
        run: |
          sortie=$(php bi-self/selfrecover/tests/sanity_parcours_dataguard.php)
          echo "$sortie"
          echo "$sortie" | grep -qE '^OK — 21/21$' \
            || { echo "::error::le parcours n'a pas joué ses 21 cas"; exit 1; }
          F=self-security/selfdataguard/src/SelfDataGuard.php
          cp "$F" /tmp/SelfDataGuard.intact
          avant=$(md5sum "$F" | cut -d" " -f1)
          sed -i '/\$record = \$this->vault->changePassphrase(\$record, \$session, \$newPassphrase);/d' "$F"
          ! grep -q 'record = $this->vault->changePassphrase($record, $session, $newPassphrase);' "$F" \
            || { echo "::error::canari non planté — motif introuvable"; exit 1; }
          if sortie=$(php bi-self/selfrecover/tests/sanity_parcours_dataguard.php 2>&1); then
            cp /tmp/SelfDataGuard.intact "$F"
            echo "::error::le parcours reste VERT quand recover() oublie la passphrase"; exit 1
          fi
          cp /tmp/SelfDataGuard.intact "$F"
          echo "$sortie" | grep -q "❌ la passphrase consommée n'ouvre plus le coffre" \
            || { echo "$sortie"; echo "::error::le rouge ne vient pas de la passphrase"; exit 1; }
          [ "$(md5sum "$F" | cut -d" " -f1)" = "$avant" ] \
            || { echo "::error::le fichier n'a pas été restauré à l'identique"; exit 1; }
          echo "✓ la sonde rougit quand la passphrase n'est pas re-scellée"

      # Chaque correctif de SelfDataGuard a son cas dans un banc. Chaque canari
      # retire le correctif et exige que le banc rougisse sur ce cas-là.
      - name: Canaris — les correctifs de SelfDataGuard rougissent quand on les retire
        run: |
          canari() {  # canari <fichier> <avant> <après> <banc> <ligne rouge attendue>
            F="$1"; cp "$F" /tmp/canari.intact; avant=$(md5sum "$F" | cut -d" " -f1)
            python3 -c 'import sys; f,a,b=sys.argv[1:4]; s=open(f).read(); n=s.count(a); sys.exit("motif trouvé %d fois" % n) if n != 1 else open(f,"w").write(s.replace(a,b))' "$F" "$2" "$3" \
              || { echo "::error::canari non planté dans $F"; exit 1; }
            if sortie=$(php "$4" 2>&1); then
              cp /tmp/canari.intact "$F"; echo "$sortie"
              echo "::error::$4 reste VERT sans le correctif"; exit 1
            fi
            cp /tmp/canari.intact "$F"
            echo "$sortie" | grep -qF "$5" || { echo "$sortie"; echo "::error::rouge, mais pas sur « $5 »"; exit 1; }
            [ "$(md5sum "$F" | cut -d" " -f1)" = "$avant" ] || { echo "::error::$F non restauré"; exit 1; }
            echo "✓ $(basename "$4") rougit sur « $5 »"
          }
          D=self-security/selfdataguard
          canari $D/src/Fields/FieldCrypter.php 'if ($fieldName === EscrowVault::WRAP_AAD_TAG) {' 'if (false) {' \
            $D/tests/sanity_facade.php 'a planted "escrow" row was decrypted'
          canari $D/src/Escrow/AdminKey.php 'if (strlen($passphrase) < UserVault::PASSWORD_MIN_LEN) {' 'if (false) {' \
            $D/tests/sanity_escrow.php 'an admin key was sealed under a passphrase below the floor'
          canari $D/src/Escrow/AuditLog.php 'if ($anchorAt !== null) {' 'if (false) {' \
            $D/tests/sanity_audit.php 'a truncated log passed its anchor'
          canari $D/src/Vault/UserVault.php "public const HMAC_CONTEXT_SUFFIX = '/dataguard';" \
            "public const HMAC_CONTEXT_SUFFIX = '/dataguarD';" \
            $D/tests/sanity_vecteurs.php 'Memorized: key differs from the second implementation'
          canari $D/src/Vault/UserVault.php '$opslimit ?? $record->kdfOpslimit,' '$opslimit ?? Primitives::ARGON2_OPSLIMIT,' \
            $D/tests/sanity_vault.php 'a vault sealed under another profile no longer opens'
          canari $D/src/Escrow/AdminKey.php '            $sealKey = Primitives::deriveFromPassword($passphrase, $salt, $ops, $mem);' \
            '            $sealKey = Primitives::deriveFromPassword($passphrase, $salt);' \
            $D/tests/sanity_escrow.php 'a v2 key sealed under another profile no longer unseals'
          canari $D/src/SelfDataGuard.php 'if ($stored->kdfOpslimit !== $written->kdfOpslimit' 'if (false && $stored->kdfOpslimit !== $written->kdfOpslimit' \
            $D/tests/sanity_facade.php 'a vault read back under another Argon2id profile was reported as stored'
          canari $D/src/Escrow/EscrowVault.php '$head = self::adminHead($record->userId);' \
            '$head = substr($plain, 0, strlen($plain) - Primitives::KEY_LEN);' \
            $D/tests/sanity_escrow.php "alice's wrap_admin, moved into bob's record, opened as bob's"
          canari $D/src/SelfDataGuard.php 'if ($record === null || EscrowVault::isAccountBound($record)) {' 'if (true) {' \
            $D/tests/sanity_escrow.php 'rebindEscrowAdmin() did not re-seal the pre-0.6.0 wrap_admin, or it no longer opens'
          canari $D/src/Vault/VaultRecord.php 'if ($kdfOpslimit === null || $kdfMemlimit === null) {' \
            '$kdfOpslimit ??= Primitives::ARGON2_OPSLIMIT; $kdfMemlimit ??= Primitives::ARGON2_MEMLIMIT; if (false) {' \
            $D/tests/sanity_facade.php 'a storage that never reads the profile back was trusted'
          canari $D/src/SelfDataGuard.php 'unset($cipher[EscrowVault::WRAP_AAD_TAG]);' '' \
            $D/tests/sanity_facade.php 'getFields() refused the whole account for one reserved row'
          canari $D/bin/escrow-ceremony.php 'fwrite(STDERR, "❌ option inconnue : "' 'return; fwrite(STDERR, "❌ option inconnue : "' \
            $D/tests/sanity_ceremony.php 'was accepted'

      # Les vecteurs que rejoue sanity_vecteurs.php sont recalculés ici par une seconde
      # implémentation (argon2-cffi, la construction écrite à la main) : sans ce
      # contrôle, un fichier de vecteurs régénéré par la bibliothèque elle-même ne
      # prouverait plus rien.
      - name: Garde-fou — les vecteurs Argon2id de SelfDataGuard viennent d'une seconde implémentation
        run: python3 self-security/selfdataguard/tests/vecteurs_argon2.py

      # La taille du sel de compte vit à quatre endroits qui ne peuvent pas se lire :
      # sr-derive.js, sr-kdf.js, Recovery::SEL_OCTETS, le CHECK du schéma duo.
      - name: Garde-fou — une seule taille de sel de compte, du navigateur à la base
        run: |
          sortie=$(php bi-self/selfrecover/tests/sanity_forme_sel.php)
          echo "$sortie"
          echo "$sortie" | grep -qE '^OK — 7/7$' \
            || { echo "::error::le banc du sel n'a pas joué ses 7 cas"; exit 1; }
          F=bi-self/selfrecover/client/sr-derive.js
          cp "$F" /tmp/sr-derive.intact
          avant=$(md5sum "$F" | cut -d" " -f1)
          sed -i 's/const SEL_OCTETS = 16;/const SEL_OCTETS = 24;/' "$F"
          grep -q 'const SEL_OCTETS = 24;' "$F" || { echo "::error::canari non planté"; exit 1; }
          if canari=$(php bi-self/selfrecover/tests/sanity_forme_sel.php); then
            cp /tmp/sr-derive.intact "$F"; echo "::error::un sel JS divergent rend encore vert"; exit 1
          fi
          cp /tmp/sr-derive.intact "$F"
          [ "$(md5sum "$F" | cut -d" " -f1)" = "$avant" ] \
            || { echo "::error::le fichier n'a pas été restauré à l'identique"; exit 1; }
          echo "$canari" | grep -q '✗ sr-derive.js SEL_OCTETS' \
            || { echo "$canari"; echo "::error::rouge, mais pas sur le sel de sr-derive.js"; exit 1; }
          echo "✓ le banc rougit sur un sel JS divergent"

      # derive_cli.php recopie srDerive() pour seed.php, la simulation d'attaque et
      # trois bancs : il doit retrouver les vecteurs figés que tiennent déjà les
      # implémentations PHP et JS.
      - name: Garde-fou — la dérivation des scripts sans navigateur tient les vecteurs
        run: |
          sortie=$(php demo/lab/tests/sanity_derive_cli.php)
          echo "$sortie"
          echo "$sortie" | grep -qE '^OK — 5/5 vecteurs$' \
            || { echo "::error::derive_cli n'a pas retrouvé ses 5 vecteurs"; exit 1; }
          F=demo/lab/lib/derive_cli.php
          cp "$F" /tmp/derive_cli.intact
          avant=$(md5sum "$F" | cut -d" " -f1)
          sed -i "s/const SR_DERIVE_VERSION = 'v2';/const SR_DERIVE_VERSION = 'v3';/" "$F"
          grep -q "SR_DERIVE_VERSION = 'v3'" "$F" || { echo "::error::canari non planté"; exit 1; }
          if php demo/lab/tests/sanity_derive_cli.php; then
            cp /tmp/derive_cli.intact "$F"; echo "::error::une formule divergente rend encore vert"; exit 1
          fi
          cp /tmp/derive_cli.intact "$F"
          [ "$(md5sum "$F" | cut -d" " -f1)" = "$avant" ] \
            || { echo "::error::le fichier n'a pas été restauré à l'identique"; exit 1; }
          echo "✓ le banc rougit quand la formule diverge"
