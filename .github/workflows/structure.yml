# Contrôle de structure — ce qu'un déplacement casse.
#
# 🔑 **Pourquoi ce workflow existe.** Le rangement du 17/08/2026 a déplacé plus de
# deux cents fichiers. Rien, dans ce dépôt, ne vérifiait qu'un chemin cité quelque
# part avait encore sa cible : ni le dépôt ni la CI. Les défauts trouvés ce jour-là
# — un script de déploiement qui affichait OK sans rien déployer, une exclusion
# OPSEC devenue orpheline, une règle .gitignore qui avait cessé de protéger une
# base de démonstration et deux artefacts cryptographiques — se ressemblent tous :
# ils ne cassent rien de visible.
#
# Les trois sondes lancées ici sont des **tests de garde-fou**, pas des tests
# fonctionnels. Quand un test fonctionnel échoue, une page blanche finit par
# alerter quelqu'un. Quand un garde-fou lâche, tout continue de fonctionner et
# personne ne le voit — c'est la catégorie qui ne survit pas à l'absence de CI.
name: structure

on:
  push:
    branches: [main, dev, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Installer PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2 au 19/08/2026
        with:
          php-version: '8.4'
          extensions: sodium, pdo_sqlite, mbstring, json
          coverage: none

      # ── Syntaxe ────────────────────────────────────────────────────────────
      - name: Syntaxe PHP, Python et shell
        run: |
          set -e
          for f in $(git ls-files '*.php'); do php -l "$f" > /dev/null; done
          echo "✓ PHP — $(git ls-files '*.php' | wc -l) fichiers"
          for f in $(git ls-files '*.py'); do python3 -m ast "$f" > /dev/null; done
          echo "✓ Python — $(git ls-files '*.py' | wc -l) fichiers"
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
          echo "✓ Shell — $(git ls-files '*.sh' | wc -l) fichiers"

      # ── Chemins ────────────────────────────────────────────────────────────
      # Le contrôle que le rangement a rendu nécessaire : liens Markdown, règles
      # .gitignore et chemins de workflow, confrontés à ce qui existe.
      - name: Le profil de hachage n'est défini qu'une fois
        run: bash scripts/check-profil-unique.sh

      - name: Chemins cités
        run: bash scripts/check-paths.sh

      # ── Garde-fous ─────────────────────────────────────────────────────────
      # Priorité sur le reste : ce sont eux qui échouent en silence.
      - name: Garde-fou — socle SelfRecover (profil de hachage, encodage, diceware)
        run: php bi-self/selfrecover/tests/sanity_socle.php

      - name: Garde-fou — facteur « cet appareil » (dont la prise de compte du 02/08)
        run: php bi-self/selfrecover/tests/sanity_device.php

      - name: Garde-fou — récupération niveaux 1 et 2
        run: php bi-self/selfrecover/tests/sanity_recovery.php

      - name: Garde-fou — la bibliothèque sur le schéma de bi-self-duo
        run: php demo/bi-self-duo/tests/equivalence_selfrecover.php

      - name: Garde-fou — déploiement SelfJustice
        run: bash self-right/selfjustice/tests/test_deploy.sh

      - name: Garde-fou — entrées acceptées par l'API SelfJustice
        run: php self-right/selfjustice/tests/sanity_entree_api.php

      - name: Garde-fou — mots comptés par le score de pertinence (MCP)
        run: python3 self-right/selfjustice/tests/sanity_pertinence.py

      - name: Garde-fou — calcul d'échéance de procédure (art. 640-643 CPC)
        run: bash self-right/selfjustice/tests/test_echeance.sh

      - name: Garde-fou — fraîcheur annoncée du catalogue SelfAct
        run: python3 self-right/selfjustice/tests/sanity_fraicheur_catalogue.py

      - name: Garde-fou — ce que la sentinelle appelle un retard
        run: bash self-right/selfjustice/tests/test_fraicheur.sh

      - name: Garde-fou — quel catalogue SelfAct est servi
        run: bash self-right/selfjustice/tests/test_chemin_catalogue.sh

      - name: Garde-fou — ce que le déploiement de l'arbre emporte
        run: bash deploy/my-self/tests/test_deploy.sh

      - name: Garde-fou — coût constant du hash factice (bi-self-duo)
        run: php demo/bi-self-duo/tests/sanity_timing.php

      - name: Préparer l'autoload du lab
        working-directory: demo/lab
        run: composer install --no-interaction --no-progress

      - name: Garde-fou — la bibliothèque sur le schéma réel du lab
        run: php demo/lab/tests/equivalence_selfrecover.php

      - name: Garde-fou — coût constant du hash factice (lab)
        run: php demo/lab/tests/sanity_timing.php

      # ── Suites de module ───────────────────────────────────────────────────
      - name: SelfDataGuard — sanity
        run: |
          set -e
          for t in self-security/selfdataguard/tests/sanity_*.php; do
            echo "→ $(basename "$t")"
            php "$t"
          done
