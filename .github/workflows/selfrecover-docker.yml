name: SelfRecover — build & push image

# Construit l'image de démo SelfRecover (multi-arch) et la pousse sur ghcr.io
# au format ghcr.io/pierroons/selfrecover:<version> + :latest.
# Déclenché par un tag `selfrecover-v*` (ex: selfrecover-v0.3.0) ou manuellement.

on:
  push:
    tags:
      - 'selfrecover-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag à construire (ex: selfrecover-v0.3.0)'
        required: true
        default: 'selfrecover-v0.3.0'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Déterminer le tag à construire
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Calculer la version d'image
        id: ver
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: echo "version=${REF#selfrecover-}" >> "$GITHUB_OUTPUT"   # selfrecover-v0.3.0 -> v0.3.0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: bi-self/selfrecover/demo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/pierroons/selfrecover:${{ steps.ver.outputs.version }}
            ghcr.io/pierroons/selfrecover:latest
