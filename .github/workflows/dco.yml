name: dco

# Le certificat d'origine, vérifié là où il a un sens : sur les commits d'une
# demande de fusion, c'est-à-dire sur les apports extérieurs.
#
# 🔑 **La vérification ne porte que sur les demandes de fusion.** Le dépôt porte
# plus de neuf cents commits d'un seul auteur, qui est le titulaire des droits :
# aucune provenance n'y est à attester, et l'exiger sur un push rendrait la règle
# inapplicable sans réécrire un historique public. La portée du contrôle est
# celle du texte de CONTRIBUTING.md — si l'un change, l'autre change avec lui.
#
# ⚠️ **Le `push:` ci-dessous ne vérifie rien, et c'est son seul rôle : EXISTER.**
# Un contrôle exigé par la protection d'une branche doit avoir produit son
# check-run sur le commit poussé, sinon la forge refuse le push avec « Required
# status check "dco" is expected » — mesuré le 12/10/2026, `main` s'est retrouvée
# gelée jusqu'au retrait. Sur un push, le travail sort donc zéro en ÉNONÇANT ce
# qu'il n'a pas mesuré : un succès muet serait un faux vert, et c'est précisément
# ce que les autres contrôles de ce dépôt servent à ne pas produire.
#
# Les deux branches suffisent, et c'est le cadrage de `suivi.yml` : le commit promu
# sur `main` est celui de `dev`, donc c'est au push de `dev` que le check-run doit
# naître. Les branches de conv n'en ont pas besoin, et un vert qui n'a rien mesuré
# n'a pas à s'y multiplier.
on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # ⚠️ Le nom du job EST le nom du contrôle, comme pour `gitleaks` et
  # `structure`. L'exiger dans la protection de `main` est un geste à part,
  # fait sur la forge : tant qu'il n'est pas posé, ce travail informe sans
  # bloquer.
  dco:
    runs-on: ubuntu-24.04
    steps:
      # L'historique complet ne sert qu'à la vérification : sur un push, rien
      # n'est lu, donc rien n'est cloné.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: sur un push, ce contrôle existe sans rien attester
        if: github.event_name != 'pull_request'
        run: |
          echo '::notice title=dco — portée::Aucune signature vérifiée ici. Ce contrôle ne juge que les demandes de fusion ; sur un push il existe pour que la protection de branche soit satisfiable.'
          echo 'dco — ce qui vient d’être mesuré : RIEN.'
          echo ''
          echo 'Les pushes directs sur ce dépôt sont ceux du titulaire des droits, dont'
          echo 'aucune provenance n’est à attester : c’est écrit dans CONTRIBUTING.md et'
          echo 'dans l’en-tête de ce fichier. La vérification porte sur les demandes de'
          echo 'fusion, et elle y lit chaque commit.'
          echo ''
          echo 'Ce travail existe ici pour une seule raison : un contrôle exigé par la'
          echo 'protection d’une branche doit avoir produit son check-run sur le commit'
          echo 'poussé. Sans lui, exiger « dco » gèlerait la branche.'

      - name: chaque commit de la demande porte sa signature
        if: github.event_name == 'pull_request'
        env:
          # 🔑 Par l'environnement et non par interpolation directe dans le
          # script : une référence contrôlée par l'auteur de la demande n'entre
          # jamais dans un shell.
          BASE: ${{ github.event.pull_request.base.sha }}
          TETE: ${{ github.event.pull_request.head.sha }}
          # 🔑 Le NOM de la branche de base, pas seulement son empreinte : le
          # message de réparation doit nommer la base réelle de la demande.
          # Mesuré sur la PR #6 le 10/10/2026 — il disait `origin/main` en dur
          # sur une demande visant `dev`, et envoyait donc rebaser sur une base
          # de treize commits en retard.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -uo pipefail

          manquants=0
          total=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            total=$((total + 1))
            if ! git log -1 --format='%(trailers:key=Signed-off-by)' "$sha" | grep -q .; then
              manquants=$((manquants + 1))
              printf '  ✗ %s  %s\n' "${sha:0:8}" "$(git log -1 --format='%s' "$sha")"
            fi
          done < <(git rev-list "$BASE..$TETE" --no-merges)

          if [ "$total" -eq 0 ]; then
            echo "Aucun commit à vérifier."
            exit 0
          fi

          if [ "$manquants" -gt 0 ]; then
            echo ''
            echo 'Les commits ci-dessus n’attestent pas leur origine.'
            echo ''
            echo 'Chaque commit d’une demande de fusion porte une ligne « Signed-off-by: ».'
            echo 'Pour les poser sur ceux qui existent déjà :'
            echo ''
            echo "    git rebase --signoff origin/$BASE_REF"
            echo ''
            echo 'Et pour les suivants, « git commit -s » l’ajoute tout seul. Ce que tu attestes'
            echo 'est écrit dans le fichier DCO à la racine : tu as écrit l’apport, ou tu as le'
            echo 'droit de le soumettre sous la licence du projet. Aucun droit ne change de mains.'
            exit 1
          fi

          printf '✓ les %d commit(s) de la demande attestent leur origine\n' "$total"
